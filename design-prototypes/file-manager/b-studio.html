<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>استوديو — مدير ملفات (التصميم B)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Readex+Pro:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- tokens ---------- */
      :root {
        --font: 'Readex Pro', system-ui, 'Segoe UI', Tahoma, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        --r: 8px;
        --r-sm: 6px;
        --r-lg: 12px;
        --bg: #0d0d12;
        --panel: #14141b;
        --panel2: #1b1b24;
        --line: #25252f;
        --line2: #343441;
        --text: #e9e9f0;
        --mute: #9696a6;
        --faint: #666675;
        --accent: #7c5cff;
        --accent2: #a08bff;
        --accent-soft: rgba(124, 92, 255, 0.16);
        --accent-fg: #fff;
        --hover: rgba(255, 255, 255, 0.055);
        --sel: rgba(255, 255, 255, 0.11);
        --danger: #ff5c6c;
        --ok: #35d49a;
        --warn: #ffb547;
        --folder: #8f87ff;
        --shadow:
          0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --chk1: #1d1d26;
        --chk2: #16161d;
        color-scheme: dark;
      }
      [data-theme='light'] {
        --bg: #f6f6fa;
        --panel: #ffffff;
        --panel2: #efeff6;
        --line: #e4e4ee;
        --line2: #d2d2e0;
        --text: #16161e;
        --mute: #6a6a7a;
        --faint: #9b9bab;
        --accent: #6a45f5;
        --accent2: #5330d8;
        --accent-soft: rgba(106, 69, 245, 0.11);
        --hover: rgba(0, 0, 0, 0.045);
        --sel: rgba(0, 0, 0, 0.085);
        --danger: #e5384c;
        --ok: #12a374;
        --warn: #c97d00;
        --folder: #6f66f0;
        --shadow:
          0 12px 36px rgba(30, 20, 80, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.06);
        --chk1: #f1f1f7;
        --chk2: #e6e6ef;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font: 400 13px/1.45 var(--font);
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      [hidden] {
        display: none !important;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      kbd {
        font: 500 10.5px var(--mono);
        padding: 1px 5px;
        border-radius: 4px;
        border: 1px solid var(--line2);
        background: var(--panel2);
        color: var(--mute);
        direction: ltr;
        unicode-bidi: isolate;
      }
      .mono,
      .num {
        font-family: var(--mono);
        font-size: 0.92em;
      }
      bdi.num {
        unicode-bidi: isolate;
      }
      .grow {
        flex: 1;
      }
      .muted {
        color: var(--mute);
      }
      .ic {
        width: 16px;
        height: 16px;
        flex: none;
        vertical-align: middle;
      }
      .ic.big {
        width: 32px;
        height: 32px;
        opacity: 0.7;
      }
      :focus-visible {
        outline: 2px solid var(--accent2);
        outline-offset: 1px;
      }
      #main:focus-visible {
        outline: none;
      }
      ::selection {
        background: var(--accent-soft);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--line2) transparent;
      }
      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line2);
        border-radius: 9px;
        border: 2px solid transparent;
        background-clip: content-box;
      }

      /* ---------- controls ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 11px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line2);
        background: var(--panel2);
        color: var(--text);
        white-space: nowrap;
        transition:
          background 0.12s,
          border-color 0.12s,
          transform 0.06s;
      }
      .btn:hover {
        background: var(--hover);
        border-color: var(--faint);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.sm {
        height: 26px;
        padding: 0 9px;
        font-size: 12px;
      }
      .btn.pri {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      .btn.pri:hover {
        filter: brightness(1.1);
      }
      .btn.danger {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, var(--line2));
      }
      .btn.danger:hover {
        background: var(--danger);
        color: #fff;
        border-color: var(--danger);
      }
      .btn.wide {
        width: 100%;
        justify-content: center;
      }
      .btn.ghost {
        background: transparent;
        border-color: var(--line);
        color: var(--mute);
      }
      .btn:disabled,
      .ib:disabled {
        opacity: 0.4;
        pointer-events: none;
      }
      .btn.on,
      .ib.on {
        border-color: var(--accent);
        color: var(--accent2);
        background: var(--accent-soft);
      }
      .ib {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: var(--r-sm);
        border: 1px solid transparent;
        background: transparent;
        color: var(--mute);
        transition:
          background 0.12s,
          color 0.12s;
        flex: none;
      }
      .ib.sm {
        width: 24px;
        height: 24px;
      }
      .ib:hover {
        background: var(--hover);
        color: var(--text);
      }
      .linkbtn {
        background: none;
        border: 0;
        color: var(--accent2);
        padding: 2px 4px;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
      }
      .linkbtn:hover {
        text-decoration: underline;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        border-radius: var(--r);
        background: var(--panel2);
        border: 1px solid var(--line);
        gap: 2px;
      }
      .seg button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 9px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--mute);
        font-size: 12px;
      }
      .seg button:hover {
        color: var(--text);
      }
      .seg button.on {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      .fb {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        margin-inline-start: 4px;
        border-radius: 99px;
        border: 1px dashed var(--accent2);
        color: var(--accent2);
        font: 500 10px var(--font);
        cursor: pointer;
        flex: none;
      }
      .fb.part {
        border-color: var(--warn);
        color: var(--warn);
      }
      body.nofut [data-fut],
      body.nofut .futonly {
        display: none !important;
      }
      body:not(.nofut) .futoff {
        display: none;
      }
      .thumb.priv {
        display: grid;
        place-items: center;
      }
      .thumb.priv .bh {
        width: 100%;
        height: 100%;
        display: block;
      }
      .thumb.priv.neutral {
        background: var(--panel2);
        color: var(--faint);
        border: 1px solid var(--line2);
      }
      .thumb.priv.neutral > .ic {
        width: 62%;
        height: 62%;
      }
      .lockb {
        position: absolute;
        inset-inline-end: 0;
        bottom: 0;
        display: grid;
        place-items: center;
        width: 10px;
        height: 10px;
        border-radius: 4px 0 0 0;
        background: rgba(0, 0, 0, 0.62);
        color: #fff;
      }
      .lockb .ic {
        width: 7px;
        height: 7px;
        stroke-width: 2.4;
      }
      .thumb.fill .lockb {
        width: 22px;
        height: 22px;
        border-radius: 8px 0 0 0;
      }
      .thumb.fill .lockb .ic {
        width: 12px;
        height: 12px;
      }
      .thumb.fill.neutral > .ic {
        width: 34%;
        height: 34%;
      }
      .stk .thumb {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
      .fcnt {
        font: 400 10.5px var(--font);
        color: var(--faint);
        flex: none;
        white-space: nowrap;
        cursor: help;
      }
      .row:hover .fcnt {
        display: none;
      }
      .col.active .row.sel .fcnt,
      .lrow.sel .fcnt {
        color: rgba(255, 255, 255, 0.8);
      }
      .tmeta .fcnt {
        font-size: 10.5px;
      }
      .usedtag {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        height: 16px;
        padding: 0 6px;
        border-radius: 99px;
        border: 1px dashed var(--accent2);
        color: var(--accent2);
        font-size: 10px;
        flex: none;
        white-space: nowrap;
      }
      .usedtag .ic {
        width: 10px;
        height: 10px;
      }
      .tile .fcnt {
        font: 400 10.5px var(--font);
        color: var(--faint);
        flex: none;
        white-space: nowrap;
        cursor: help;
      }
      .row:hover .fcnt {
        display: none;
      }
      .col.active .row.sel .fcnt,
      .lrow.sel .fcnt {
        color: rgba(255, 255, 255, 0.8);
      }
      .tmeta .fcnt {
        font-size: 10.5px;
      }
      .usedtag {
        position: absolute;
        top: 12px;
        inset-inline-start: 36px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.5);
      }
      .usedbox {
        padding: 8px 10px;
        border-radius: var(--r-sm);
        border: 1px dashed var(--accent2);
        background: var(--accent-soft);
        font-size: 12px;
      }
      .usedbox > b {
        display: flex;
        gap: 6px;
        align-items: center;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .usedbox .nlist li {
        background: var(--panel);
      }
      .modal.xl {
        width: min(920px, 100%);
      }
      .pdfframe {
        width: 100%;
        height: min(64dvh, 640px);
        border: 1px solid var(--line);
        border-radius: var(--r);
        background: #fff;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 8px;
        border-radius: 99px;
        background: var(--panel2);
        border: 1px solid var(--line2);
        font: 500 10.5px var(--mono);
        color: var(--mute);
      }
      .tag.t-pdf {
        color: #ff7b7b;
        border-color: rgba(239, 68, 68, 0.4);
      }
      .tag.t-docx {
        color: #6ea8ff;
        border-color: rgba(59, 130, 246, 0.4);
      }
      .tag.t-xlsx {
        color: #4ade80;
        border-color: rgba(34, 197, 94, 0.4);
      }
      .vis {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 8px;
        border-radius: 99px;
        font-size: 11px;
      }
      .vis .ic {
        width: 12px;
        height: 12px;
      }
      .vis.pub {
        background: rgba(53, 212, 154, 0.13);
        color: var(--ok);
      }
      .vis.priv {
        background: var(--panel2);
        color: var(--mute);
      }
      .inote {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 12px;
        color: var(--mute);
        padding: 8px 10px;
        border-radius: var(--r-sm);
        background: var(--panel2);
        border: 1px solid var(--line);
      }
      .inote .ic {
        margin-top: 2px;
      }
      .inote.ok {
        color: var(--ok);
      }
      .inote.warn {
        color: var(--warn);
      }
      .inote.err {
        color: var(--danger);
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 12.5px;
        padding: 8px 10px;
        border-radius: var(--r-sm);
        background: rgba(255, 92, 108, 0.08);
        border: 1px solid rgba(255, 92, 108, 0.3);
        cursor: pointer;
      }
      .check input {
        margin-top: 3px;
        accent-color: var(--danger);
      }
      .skb {
        display: inline-block;
        height: 10px;
        border-radius: 5px;
        background: linear-gradient(
          90deg,
          var(--panel2),
          var(--line),
          var(--panel2)
        );
        background-size: 200% 100%;
        animation: shimmer 1.3s infinite linear;
      }
      .skb.sq {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        flex: none;
      }
      .skb.ln {
        display: block;
        height: 12px;
        margin: 8px 0;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      .spin {
        display: inline-flex;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------- shell ---------- */
      .app {
        display: flex;
        height: 100dvh;
      }
      .shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .navbtns {
        display: flex;
        gap: 2px;
      }
      .pathbar {
        flex: 1 1 200px;
        min-width: 0;
        display: flex;
        align-items: center;
        height: 32px;
        padding: 0 4px;
        border-radius: var(--r);
        background: var(--bg);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .pseg {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        border-radius: 6px;
        flex: 0 1 auto;
        transition:
          background 0.12s,
          box-shadow 0.12s;
      }
      .pseg.last {
        flex: 0 1 auto;
      }
      .pseg .pname {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 7px;
        border: 0;
        background: none;
        color: var(--mute);
        border-radius: 6px 0 0 6px;
        border-radius: 6px;
        min-width: 0;
      }
      .pseg .pname span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 150px;
      }
      .pseg.last .pname {
        color: var(--text);
        font-weight: 500;
      }
      .pseg .pdd {
        display: grid;
        place-items: center;
        width: 16px;
        height: 24px;
        border: 0;
        background: none;
        color: var(--faint);
        border-radius: 5px;
        padding: 0;
        margin-inline-start: -4px;
      }
      .pseg .pdd .ic {
        width: 12px;
        height: 12px;
      }
      .pseg:hover .pname,
      .pseg .pdd:hover {
        background: var(--hover);
        color: var(--text);
      }
      .pseg.res {
        gap: 6px;
        padding: 0 8px;
        color: var(--accent2);
      }
      .pseg.link {
        border: 0;
        background: none;
        color: var(--mute);
        margin-inline-start: 8px;
        padding: 0 8px;
        height: 24px;
      }
      .psep {
        color: var(--faint);
        display: inline-flex;
        flex: none;
      }
      .psep .ic {
        width: 12px;
        height: 12px;
      }
      .searchbox {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 1 340px;
        min-width: 150px;
        height: 32px;
        padding: 0 9px;
        border-radius: var(--r);
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--mute);
      }
      .searchbox:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .searchbox input {
        flex: 1;
        min-width: 60px;
        background: none;
        border: 0;
        outline: 0;
        color: var(--text);
        height: 28px;
      }
      .searchbox input::placeholder {
        color: var(--faint);
      }
      .qhint {
        position: absolute;
        top: calc(100% + 6px);
        inset-inline: 0;
        z-index: 60;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        padding: 8px;
        font-size: 12px;
        color: var(--mute);
      }
      .qmin {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--warn);
      }
      .qscope {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--mute);
      }
      .qscope .seg {
        flex: 1;
        min-width: 0;
      }
      .qscope .seg button {
        flex: 1;
        min-width: 0;
        justify-content: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .qnote {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 6px;
        font-size: 11.5px;
        color: var(--mute);
      }
      .qhint .gbtn {
        margin-top: 8px;
      }
      .seg.fill {
        display: flex;
        width: 100%;
      }
      .seg.fill button {
        flex: 1;
        justify-content: center;
      }
      .fbadge {
        display: inline-grid;
        place-items: center;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 99px;
        background: var(--accent);
        color: #fff;
        font: 600 10px var(--mono);
      }
      .stfilt {
        color: var(--accent2);
      }
      .subbar {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
      .subbar > * {
        flex: none;
      }
      .subbar .grp {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .subbar .grow {
        flex: 1 0 8px;
      }
      .bulk {
        padding-inline: 4px 8px;
        border-radius: var(--r);
        background: var(--accent-soft);
        height: 30px;
        border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      }
      .bulk .bcount {
        font-weight: 500;
        color: var(--accent2);
        padding-inline: 4px;
        white-space: nowrap;
      }
      .bulk .sep {
        width: 1px;
        height: 16px;
        background: var(--line2);
      }
      .bulk .btn {
        background: transparent;
      }
      .bulk .btn.pri {
        background: var(--accent);
      }
      .tray {
        gap: 8px;
        height: 32px;
        padding: 0 6px 0 8px;
        border-radius: var(--r);
        background: var(--accent-soft);
        border: 1px solid var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
        animation: pop 0.14s ease-out;
      }
      .tstack {
        display: inline-flex;
        align-items: center;
        padding-inline-end: 8px;
      }
      .tk {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--panel);
        border: 2px solid var(--panel);
        margin-inline-end: -8px;
        position: relative;
        z-index: calc(4 - var(--i));
        overflow: hidden;
      }
      .tk .thumb,
      .tk .dtile {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
      .tk .fi .ic {
        width: 16px;
        height: 16px;
      }
      .tcount {
        display: none;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 99px;
        background: var(--accent);
        color: #fff;
        font: 600 11px var(--mono);
        place-items: center;
      }
      .ttext {
        color: var(--accent2);
        font-weight: 500;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .tray .btn:not(.pri) {
        background: var(--panel);
      }
      .btn.is-disabled {
        opacity: 0.55;
        filter: saturate(0.4);
      }
      .chipbtn {
        margin-inline-end: 2px;
      }
      .cut {
        opacity: 0.45;
        outline: 1.5px dashed var(--accent2);
        outline-offset: -2px;
      }
      .cut:hover {
        opacity: 0.65;
      }
      .tilewrap {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--faint);
      }
      .tilewrap input {
        width: 110px;
        accent-color: var(--accent);
      }
      .tilewrap .ic {
        width: 13px;
        height: 13px;
      }
      .content {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .main {
        flex: 1;
        display: flex;
        min-width: 0;
        min-height: 0;
        position: relative;
        outline: none;
      }
      .strip {
        display: none;
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .gridview,
      .listview {
        display: none;
        flex: 1;
        min-width: 0;
        overflow: auto;
        position: relative;
      }
      .main[data-show='strip'] .strip {
        display: flex;
      }
      .main[data-show='grid'] .gridview {
        display: block;
      }
      .main[data-show='list'] .listview {
        display: flex;
        flex-direction: column;
      }
      .side {
        flex: 0 0 330px;
        width: 330px;
        border-inline-start: 1px solid var(--line);
        background: var(--panel);
        overflow-y: auto;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 28px;
        padding: 0 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        font-size: 11.5px;
        color: var(--mute);
        position: relative;
      }
      .status > span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #stPath {
        min-width: 0;
        flex: 1;
        overflow: hidden;
      }
      #stPath span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .stbtn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: none;
        border: 1px dashed var(--line2);
        border-radius: 99px;
        color: var(--mute);
        height: 20px;
        padding: 0 8px;
        font-size: 11px;
      }
      .upind {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 9px;
        border-radius: 6px;
        border: 1px solid var(--line2);
        background: var(--panel2);
        color: var(--mute);
        font-size: 11.5px;
      }
      .upind:hover {
        color: var(--text);
      }
      .upind.active {
        border-color: var(--accent);
        color: var(--accent2);
      }
      .upind .mini {
        width: 44px;
        height: 3px;
        background: var(--line2);
        border-radius: 3px;
        overflow: hidden;
      }
      .upind .mini i {
        display: block;
        height: 100%;
        background: var(--accent);
      }

      /* ---------- Miller columns ---------- */
      .col {
        position: relative;
        flex: 0 0 var(--w, 248px);
        width: var(--w, 248px);
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-inline-end: 1px solid var(--line);
        background: var(--bg);
      }
      .col.dz-ok {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .col.dz-bad {
        box-shadow: inset 0 0 0 2px var(--danger);
      }
      .chead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        color: var(--mute);
        flex: none;
      }
      .chead .cname {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .chead .cname b {
        font-weight: 500;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chead .ic {
        width: 13px;
        height: 13px;
      }
      .list {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 4px;
        position: relative;
      }
      .rz {
        position: absolute;
        top: 0;
        bottom: 0;
        inset-inline-end: -4px;
        width: 8px;
        cursor: col-resize;
        z-index: 5;
      }
      .rz::after {
        content: '';
        position: absolute;
        inset-block: 0;
        inset-inline-start: 3px;
        width: 2px;
        background: transparent;
        transition: background 0.12s;
      }
      .rz:hover::after,
      body.resizing .rz::after {
        background: var(--accent);
      }
      body.resizing {
        cursor: col-resize;
        user-select: none;
      }
      .row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding-inline: 8px 6px;
        border-radius: 6px;
        color: var(--text);
        cursor: default;
        user-select: none;
      }
      .row:hover {
        background: var(--hover);
      }
      .row.open {
        background: var(--sel);
      }
      .row.sel {
        background: var(--sel);
      }
      .col.active .row.sel {
        background: var(--accent);
        color: #fff;
      }
      .col.active .row.sel .sz,
      .col.active .row.sel .chev,
      .col.active .row.sel .more {
        color: rgba(255, 255, 255, 0.8);
      }
      .col.active .row.sel .fi svg {
        color: #fff;
        fill: rgba(255, 255, 255, 0.25);
      }
      #main:focus-visible .row.cur {
        box-shadow: inset 0 0 0 1.5px var(--accent2);
      }
      .row .nm,
      .lrow .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .sz {
        font: 400 10.5px var(--mono);
        color: var(--faint);
        flex: none;
      }
      .row .chev {
        color: var(--faint);
        display: inline-flex;
        flex: none;
      }
      .row .chev .ic {
        width: 14px;
        height: 14px;
      }
      .row .pub,
      .tile .pub {
        color: var(--ok);
        display: inline-flex;
      }
      .row .pub .ic {
        width: 12px;
        height: 12px;
      }
      .more {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--mute);
        opacity: 0;
        flex: none;
      }
      .row:hover .more,
      .row.sel .more,
      .lrow:hover .more,
      .lrow.sel .more,
      .tile:hover .more,
      .tile.sel .more {
        opacity: 1;
      }
      .more:hover {
        background: var(--hover);
        color: var(--text);
      }
      .row .more {
        margin-inline: -2px;
      }
      .row:hover .sz {
        display: none;
      }
      .row:hover .chev {
        display: none;
      }
      .ico {
        position: relative;
        width: 20px;
        height: 20px;
        flex: none;
        display: grid;
        place-items: center;
      }
      .icm {
        display: grid;
        place-items: center;
        transition: opacity 0.1s;
      }
      .chk {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1.5px solid var(--faint);
        background: var(--panel);
        color: transparent;
        display: grid;
        place-items: center;
        opacity: 0;
        transition: opacity 0.1s;
      }
      .chk .ic {
        width: 11px;
        height: 11px;
        stroke-width: 3;
      }
      .row:hover .chk,
      .lrow:hover .chk,
      .tile:hover .chk {
        opacity: 1;
      }
      .row:hover .icm,
      .lrow:hover .icm {
        opacity: 0;
      }
      .sel .chk {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .col.active .row.sel .chk,
      .lrow.sel .chk {
        background: #fff;
        border-color: #fff;
        color: var(--accent);
      }
      .main.multi .sel .chk {
        opacity: 1;
      }
      .main.multi .row.sel .icm,
      .main.multi .lrow.sel .icm {
        opacity: 0;
      }
      .fi {
        display: inline-flex;
      }
      .fi .ic {
        color: var(--folder);
        fill: color-mix(in srgb, var(--folder) 28%, transparent);
        width: 18px;
        height: 18px;
      }
      .thumb {
        position: relative;
        display: block;
        width: 20px;
        height: 20px;
        border-radius: 4px;
        overflow: hidden;
        flex: none;
        background: linear-gradient(
          135deg,
          hsl(var(--h, 260) 65% 52%),
          hsl(calc(var(--h, 260) + 45) 65% 38%)
        );
      }
      .thumb img,
      .bigthumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .thumb.fill {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
      .dtile {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 20px;
        height: 20px;
        border-radius: 4px;
        color: #fff;
        flex: none;
      }
      .dtile b {
        font: 600 6px var(--mono);
        letter-spacing: 0.02em;
      }
      .dtile .ic {
        display: none;
      }
      .dtile.fill {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
      .dtile.fill b {
        font-size: 15px;
      }
      .dtile.fill .ic {
        display: block;
        width: 34px;
        height: 34px;
        opacity: 0.9;
      }
      .d-pdf {
        background: linear-gradient(160deg, #f87171, #b91c1c);
      }
      .d-docx {
        background: linear-gradient(160deg, #60a5fa, #1d4ed8);
      }
      .d-xlsx {
        background: linear-gradient(160deg, #4ade80, #15803d);
      }
      .d-file {
        background: linear-gradient(160deg, #94a3b8, #475569);
      }
      .row.editing {
        background: var(--accent-soft);
      }
      .ed {
        flex: 1;
        min-width: 0;
        height: 22px;
        border-radius: 5px;
        border: 1.5px solid var(--accent);
        background: var(--bg);
        color: var(--text);
        padding: 0 6px;
        outline: 0;
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .ed.busy {
        opacity: 0.6;
      }
      .flash {
        animation: flash 1.4s ease-out;
      }
      @keyframes flash {
        0% {
          box-shadow: 0 0 0 3px var(--accent);
          background: var(--accent-soft);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      .dz-ok:not(.col) {
        background: var(--accent-soft) !important;
        box-shadow: inset 0 0 0 1.5px var(--accent);
        color: var(--text) !important;
      }
      .dz-bad:not(.col) {
        background: rgba(255, 92, 108, 0.1) !important;
        box-shadow: inset 0 0 0 1.5px var(--danger);
        cursor: not-allowed;
      }
      .sprung {
        animation: flash 0.6s ease-out;
      }
      .moreRow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px;
        color: var(--mute);
        font-size: 12px;
      }
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
        padding: 36px 16px;
        color: var(--mute);
      }
      .empty h4 {
        margin: 4px 0 0;
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
      }
      .empty p {
        margin: 0;
        font-size: 12px;
        max-width: 280px;
      }
      .empty .illu {
        width: 130px;
        height: auto;
        margin-bottom: 4px;
      }
      .empty .erow {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .empty.err .ic.big {
        color: var(--danger);
      }
      .row.sk {
        pointer-events: none;
      }

      /* ---------- inspector ---------- */
      .insp {
        position: relative;
        flex: 0 0 var(--w, 340px);
        width: var(--w, 340px);
        background: var(--panel);
        border-inline-end: 1px solid var(--line);
        min-height: 0;
      }
      .insp .ihost {
        height: 100%;
        overflow-y: auto;
      }
      .ibody {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .ipv {
        position: relative;
        height: 210px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: conic-gradient(
            var(--chk1) 25%,
            var(--chk2) 0 50%,
            var(--chk1) 0 75%,
            var(--chk2) 0
          )
          0 0 / 16px 16px;
        display: grid;
        place-items: center;
        cursor: zoom-in;
      }
      .ipv.folder {
        cursor: default;
        background: var(--panel2);
        height: 130px;
      }
      .ipv .bigthumb {
        width: 100%;
        height: 100%;
        background: transparent;
      }
      .ipv .bigthumb img {
        object-fit: contain;
      }
      .ipvhint {
        position: absolute;
        bottom: 8px;
        inset-inline-end: 8px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 11px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .ipv:hover .ipvhint {
        opacity: 1;
      }
      .bigdoc {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 104px;
        height: 132px;
        border-radius: 12px;
        color: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .bigdoc .ic {
        width: 38px;
        height: 38px;
        opacity: 0.92;
      }
      .bigdoc b {
        font: 600 15px var(--mono);
      }
      .bigfi .ic {
        width: 64px;
        height: 64px;
        color: var(--folder);
        fill: color-mix(in srgb, var(--folder) 28%, transparent);
        stroke-width: 1.2;
      }
      .ititle {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ititle h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .itags,
      .iact {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .linkhint {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 11.5px;
        color: var(--mute);
      }
      .linkhint .ic {
        width: 13px;
        height: 13px;
      }
      .meta {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 7px 14px;
        margin: 0;
        font-size: 12px;
        padding: 10px 0;
        border-block: 1px solid var(--line);
      }
      .meta dt {
        color: var(--mute);
      }
      .meta dd {
        margin: 0;
        min-width: 0;
        word-break: break-word;
      }
      .crumbs {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
      }
      .crumbs a {
        color: var(--accent2);
        cursor: pointer;
      }
      .crumbs a:hover {
        text-decoration: underline;
      }
      .isec h5 {
        margin: 0 0 6px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--mute);
        display: flex;
        align-items: center;
      }
      .usedlist {
        list-style: none;
        margin: 0 0 6px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .usedlist li {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 8px;
        border-radius: var(--r-sm);
        background: var(--panel2);
        border: 1px solid var(--line);
        font-size: 12px;
      }
      .usedlist li span {
        flex: 1;
        min-width: 0;
      }
      .usedlist em {
        font: normal 10px var(--mono);
        color: var(--faint);
      }
      .usedlist .ic {
        width: 13px;
        height: 13px;
        color: var(--accent2);
      }
      .isec.fut {
        padding: 10px;
        border: 1px dashed var(--line2);
        border-radius: var(--r);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ghostfield {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 11px;
        color: var(--mute);
        cursor: pointer;
      }
      .ghostfield i {
        display: block;
        height: 26px;
        border-radius: 6px;
        border: 1px dashed var(--line2);
        background: var(--bg);
      }
      .gbtn {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 30px;
        padding: 0 10px;
        border-radius: var(--r-sm);
        border: 1px dashed var(--line2);
        background: transparent;
        color: var(--mute);
        text-align: start;
      }
      .gbtn:hover {
        border-color: var(--accent2);
        color: var(--text);
      }
      .gbtn .fb {
        margin-inline-start: auto;
      }
      .stack {
        position: relative;
        height: 130px;
        display: grid;
        place-items: center;
      }
      .stk {
        position: absolute;
        width: 84px;
        height: 84px;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid var(--panel);
        background: var(--panel2);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        display: grid;
        place-items: center;
        transform: translateX(calc(var(--i) * -18px + 27px))
          rotate(calc(var(--i) * 4deg - 6deg));
        z-index: calc(10 - var(--i));
      }
      .stk img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .stk .bigfi .ic {
        width: 44px;
        height: 44px;
      }
      .stk .dtile b {
        font-size: 13px;
      }

      /* ---------- grid ---------- */
      .gridview {
        padding: 8px 14px 24px;
      }
      .gwrap {
        min-height: 100%;
        padding-bottom: 20px;
      }
      .gh {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        color: var(--mute);
        margin: 12px 4px 8px;
      }
      .gcount {
        font: 400 10.5px var(--mono);
        color: var(--faint);
        padding: 0 6px;
        border-radius: 99px;
        border: 1px solid var(--line);
        margin-inline-start: 6px;
      }
      .gcells {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--t, 150px), 1fr));
        gap: 10px;
      }
      .tile {
        position: relative;
        padding: 6px;
        border-radius: 11px;
        border: 1px solid transparent;
        user-select: none;
        cursor: default;
      }
      .tile:hover {
        background: var(--hover);
      }
      .tile.sel {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      #main:focus-visible .tile.cur {
        box-shadow: 0 0 0 2px var(--accent2);
      }
      .tpv {
        aspect-ratio: 1;
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel2);
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
      }
      .tile.fol .tpv {
        background: linear-gradient(160deg, var(--panel2), var(--panel));
      }
      .tfoot {
        padding: 6px 2px 0;
        text-align: center;
        min-width: 0;
      }
      .tnm {
        display: block;
        font-size: 12px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .tmeta {
        display: block;
        font-size: 10.5px;
        color: var(--faint);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .tile .chk {
        inset: auto;
        top: 12px;
        inset-inline-start: 12px;
        margin: 0;
        width: 18px;
        height: 18px;
        background: rgba(0, 0, 0, 0.35);
        border-color: #fff;
      }
      .tile .more {
        position: absolute;
        top: 12px;
        inset-inline-end: 12px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        opacity: 0;
      }
      .tile .pub {
        position: absolute;
        bottom: 46px;
        inset-inline-start: 12px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.55);
        align-items: center;
        justify-content: center;
      }
      .tile .pub .ic {
        width: 11px;
        height: 11px;
      }
      .tile .ed {
        width: 100%;
        text-align: center;
      }
      .tile.sk {
        pointer-events: none;
      }
      .tile.sk .tpv {
        border: 0;
        height: auto;
      }
      .rbanner {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .rbanner b {
        font-weight: 500;
      }
      .rbanner .rcount {
        color: var(--mute);
        font-size: 12px;
        flex: 1;
      }

      /* ---------- list ---------- */
      .listview {
        --lg: minmax(220px, 1fr) 96px 96px 84px 64px 70px 28px;
      }
      .lhead {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: var(--lg);
        align-items: center;
        height: 28px;
        padding-inline: 10px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        font-size: 11.5px;
        color: var(--mute);
      }
      .rbanner + .lhead {
        top: 45px;
      }
      .lhead button.lc {
        background: none;
        border: 0;
        text-align: start;
        padding: 0;
        height: 28px;
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--mute);
      }
      .lhead button.lc:hover,
      .lhead button.lc.on {
        color: var(--text);
      }
      .lhead .ic {
        width: 12px;
        height: 12px;
      }
      .lbody {
        flex: 1;
        min-height: 0;
        padding: 2px 6px 30px;
        position: relative;
      }
      .lrow {
        display: grid;
        grid-template-columns: var(--lg);
        align-items: center;
        height: 28px;
        padding-inline: 4px;
        border-radius: 6px;
        user-select: none;
        cursor: default;
      }
      .lrow:hover {
        background: var(--hover);
      }
      .lrow.sel {
        background: var(--accent);
        color: #fff;
      }
      .lrow.sel .lc,
      .lrow.sel .more {
        color: rgba(255, 255, 255, 0.85);
      }
      .lrow.sel .fi .ic {
        color: #fff;
        fill: rgba(255, 255, 255, 0.25);
      }
      #main:focus-visible .lrow.cur {
        box-shadow: inset 0 0 0 1.5px var(--accent2);
      }
      .lc {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: var(--mute);
      }
      .lname {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text);
        font-size: 13px;
      }
      .lrow.sel .lname {
        color: #fff;
      }
      .indent {
        width: calc(var(--d, 0) * 18px);
        flex: none;
      }
      .disc {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--faint);
        border-radius: 4px;
        flex: none;
        transition: transform 0.12s;
      }
      .disc .ic {
        width: 13px;
        height: 13px;
      }
      .disc.open {
        transform: rotate(-90deg);
      }
      .disc.sp {
        visibility: hidden;
      }
      .lrow.sel .disc {
        color: #fff;
      }
      .npath {
        font-size: 10.5px;
        color: var(--faint);
        margin-inline-start: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 40%;
      }
      .lrow.sel .npath {
        color: rgba(255, 255, 255, 0.7);
      }
      .lsec {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 12px 8px 4px;
        font-size: 11px;
        color: var(--mute);
      }
      .lrow .vis {
        height: 18px;
        font-size: 10.5px;
        padding: 0 6px;
      }
      .lrow.sel .vis {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
      }
      .lrow.errrow .lname {
        color: var(--danger);
      }
      .lrow.sk {
        pointer-events: none;
      }
      .lact {
        display: flex;
        justify-content: flex-end;
      }
      .lrow .ico {
        width: 18px;
        height: 18px;
      }
      .lrow .thumb,
      .lrow .dtile {
        width: 18px;
        height: 18px;
      }

      /* ---------- menus + pops ---------- */
      .menu,
      .pop {
        position: fixed;
        z-index: 200;
        min-width: 220px;
        max-width: 320px;
        padding: 5px;
        border-radius: 10px;
        background: var(--panel);
        border: 1px solid var(--line2);
        box-shadow: var(--shadow);
        animation: pop 0.12s ease-out;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }
      .mi {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        height: 28px;
        padding: 0 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        text-align: start;
        color: var(--text);
      }
      .mi:hover,
      .mi:focus {
        background: var(--accent);
        color: #fff;
        outline: 0;
      }
      .mi:hover kbd,
      .mi:focus kbd {
        color: rgba(255, 255, 255, 0.85);
        background: transparent;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .mi:disabled {
        opacity: 0.38;
        pointer-events: none;
      }
      .mi.danger {
        color: var(--danger);
      }
      .mi.danger:hover,
      .mi.danger:focus {
        background: var(--danger);
        color: #fff;
      }
      .mi.futi {
        color: var(--mute);
      }
      .mic {
        width: 16px;
        display: inline-grid;
        place-items: center;
        flex: none;
      }
      .ml {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mi kbd {
        border: 0;
        background: none;
        padding: 0;
      }
      .msub {
        display: inline-flex;
      }
      .msub .ic {
        width: 13px;
        height: 13px;
      }
      .msep {
        height: 1px;
        background: var(--line);
        margin: 5px 4px;
      }
      .mhead {
        padding: 4px 8px;
        font-size: 10.5px;
        color: var(--faint);
      }
      .filterpop {
        width: 300px;
        padding: 10px;
      }
      .fhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .fhead b {
        display: flex;
        gap: 6px;
        align-items: center;
        font-weight: 500;
      }
      .fgroup {
        margin-bottom: 10px;
      }
      .fgroup h6 {
        margin: 0 0 5px;
        font-size: 11px;
        font-weight: 500;
        color: var(--mute);
      }
      .fopts {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .fc {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 24px;
        padding: 0 9px;
        border-radius: 6px;
        border: 1px solid var(--line2);
        background: var(--panel2);
        font-size: 11.5px;
        color: var(--mute);
      }
      .fc .ic {
        width: 12px;
        height: 12px;
      }
      .fc:hover {
        color: var(--text);
      }
      .fc.on {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent2);
      }

      .toasts {
        position: fixed;
        bottom: 42px;
        inset-inline: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        z-index: 400;
        pointer-events: none;
        padding: 0 12px;
      }
      .toast {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: min(560px, 100%);
        padding: 9px 10px 9px 12px;
        border-radius: 10px;
        background: var(--panel);
        border: 1px solid var(--line2);
        box-shadow: var(--shadow);
        font-size: 12.5px;
        animation: toastin 0.2s ease-out;
      }
      .toast.out {
        opacity: 0;
        transform: translateY(6px);
        transition: 0.18s;
      }
      .toast .tmsg {
        flex: 1;
      }
      .toast > button {
        border: 0;
        background: none;
        color: var(--faint);
        display: grid;
        place-items: center;
        padding: 2px;
        border-radius: 4px;
      }
      .toast > button:hover {
        color: var(--text);
      }
      .toast.error {
        border-color: rgba(255, 92, 108, 0.5);
      }
      .toast.error > .ic {
        color: var(--danger);
      }
      .toast.ok > .ic {
        color: var(--ok);
      }
      .toast.future {
        border: 1px dashed var(--accent2);
      }
      .toast.future > .ic {
        color: var(--accent2);
      }
      @keyframes toastin {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      .modal-wrap,
      .pal-wrap {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: grid;
        place-items: center;
        background: rgba(5, 5, 10, 0.55);
        backdrop-filter: blur(3px);
        animation: fade 0.14s ease-out;
        padding: 14px;
      }
      .pal-wrap {
        place-items: start center;
        padding-top: 12vh;
        z-index: 350;
      }
      .modal-wrap.out {
        opacity: 0;
        transition: opacity 0.14s;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      .modal {
        width: min(460px, 100%);
        max-height: 88dvh;
        display: flex;
        flex-direction: column;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid var(--line2);
        box-shadow: var(--shadow);
        animation: pop 0.16s ease-out;
      }
      .modal.wide {
        width: min(580px, 100%);
      }
      .modal header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      .modal header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        display: flex;
        gap: 8px;
        align-items: center;
        flex: 1;
      }
      .mbody {
        padding: 14px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .modal footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
      }
      .warnbox {
        display: flex;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--r);
        background: rgba(255, 181, 71, 0.09);
        border: 1px solid rgba(255, 181, 71, 0.35);
      }
      .warnbox .ic {
        color: var(--warn);
        margin-top: 2px;
        width: 18px;
        height: 18px;
      }
      .warnbox p {
        margin: 3px 0 0;
        color: var(--mute);
        font-size: 12px;
      }
      .nlist {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 12.5px;
      }
      .nlist li {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 4px 8px;
        background: var(--panel2);
        border-radius: 6px;
      }
      .nlist li span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nlist li.more {
        color: var(--mute);
        background: none;
      }
      .picker {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .ptree {
        height: 300px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: var(--r);
        background: var(--bg);
        padding: 4px;
      }
      .ptree ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .pnode {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding-inline: 6px;
        padding-inline-start: calc(6px + var(--d, 0) * 18px);
        border-radius: 6px;
        cursor: default;
      }
      .pnode:hover {
        background: var(--hover);
      }
      .pnode.on {
        background: var(--accent);
        color: #fff;
      }
      .pnode.on .fi .ic {
        color: #fff;
        fill: rgba(255, 255, 255, 0.25);
      }
      .pnode.on .disc {
        color: #fff;
      }
      .pnode.bad {
        opacity: 0.4;
      }
      .pnode .pname {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pload,
      .pempty {
        list-style: none;
        padding: 5px 8px;
        padding-inline-start: calc(30px + var(--d, 0) * 18px);
        font-size: 12px;
        color: var(--faint);
      }
      .perr {
        min-height: 16px;
        font-size: 12px;
        color: var(--danger);
      }

      .pal {
        width: min(580px, 100%);
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid var(--line2);
        box-shadow: var(--shadow);
        overflow: hidden;
        animation: pop 0.14s ease-out;
      }
      .pin {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        height: 48px;
        border-bottom: 1px solid var(--line);
        color: var(--mute);
      }
      .pin input {
        flex: 1;
        background: none;
        border: 0;
        outline: 0;
        color: var(--text);
        font-size: 14px;
        height: 44px;
      }
      .plist {
        max-height: 52vh;
        overflow-y: auto;
        padding: 6px;
      }
      .pgroup {
        padding: 8px 10px 3px;
        font-size: 10.5px;
        color: var(--faint);
      }
      .prow {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 32px;
        padding: 0 10px;
        border: 0;
        background: none;
        border-radius: 7px;
        text-align: start;
        color: var(--text);
      }
      .prow.on {
        background: var(--accent);
        color: #fff;
      }
      .prow.on kbd {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.4);
        background: transparent;
      }
      .prow .pl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .prow small {
        color: inherit;
        opacity: 0.6;
        font-size: 11px;
        max-width: 40%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .prow.futi:not(.on) {
        color: var(--mute);
      }
      .pempty {
        padding: 24px;
        text-align: center;
        color: var(--faint);
      }
      .pfoot {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 8px 14px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--faint);
      }
      .pfoot span {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .keysheet {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px 22px;
      }
      .keysheet h5 {
        margin: 0 0 6px;
        font-size: 11.5px;
        color: var(--accent2);
        font-weight: 500;
      }
      .krow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .krow .kk {
        display: inline-flex;
        gap: 4px;
        flex: none;
      }

      /* ---------- quick look ---------- */
      .ql {
        position: fixed;
        inset: 0;
        z-index: 320;
        background: rgba(4, 4, 8, 0.88);
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        animation: fade 0.14s ease-out;
      }
      .qlbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        color: #e9e9f0;
        position: relative;
        z-index: 2;
      }
      .qltitle {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex-wrap: wrap;
      }
      .qltitle b {
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 46vw;
      }
      .qltitle span {
        color: #9a9aaa;
        font-size: 12px;
      }
      .qlpos {
        font: 400 11px var(--mono);
      }
      .qlbtns {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .ql .ib {
        color: #c8c8d6;
      }
      .ql .ib:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      .qlz {
        background: none;
        border: 0;
        color: #c8c8d6;
        font: 500 11px var(--mono);
        min-width: 48px;
        height: 28px;
        border-radius: 6px;
      }
      .qlz:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .qlstage {
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 0 70px 24px;
      }
      .qlimg {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 6px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        cursor: zoom-in;
        user-select: none;
        transition: transform 0.12s ease-out;
        background: conic-gradient(
            #222 25%,
            #1a1a1a 0 50%,
            #222 0 75%,
            #1a1a1a 0
          )
          0 0 / 16px 16px;
      }
      .qlimg.zoomed {
        cursor: grab;
        transition: none;
      }
      .qlnav {
        position: absolute;
        top: 50%;
        translate: 0 -50%;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(20, 20, 28, 0.7);
        color: #fff;
        display: grid;
        place-items: center;
        z-index: 3;
      }
      .qlnav:hover {
        background: var(--accent);
      }
      .qlnav.prev {
        inset-inline-start: 14px;
      }
      .qlnav.next {
        inset-inline-end: 14px;
      }
      .qlnav:disabled {
        opacity: 0.25;
        pointer-events: none;
      }
      .qldoc {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        color: #e9e9f0;
        text-align: center;
        padding: 30px;
      }
      .qldoc h3 {
        margin: 6px 0 0;
        font-weight: 500;
      }
      .qldoc p {
        margin: 0;
        color: #9a9aaa;
      }
      .qldoc .bigdoc {
        width: 150px;
        height: 190px;
      }

      /* ---------- uploads + overlays ---------- */
      .uppop {
        position: fixed;
        z-index: 150;
        bottom: 34px;
        inset-inline-end: 12px;
        width: min(380px, calc(100vw - 24px));
        max-height: 60dvh;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--line2);
        box-shadow: var(--shadow);
        animation: pop 0.14s ease-out;
        overflow: hidden;
      }
      .uphead {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px 8px 8px;
        border-bottom: 1px solid var(--line);
      }
      .uphead b {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 500;
      }
      .upsum {
        flex: 1;
        color: var(--mute);
        font-size: 11.5px;
        padding-inline: 6px;
      }
      .obar {
        height: 3px;
        background: var(--line);
      }
      .obar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), #22d3ee);
        transition: width 0.2s;
      }
      .uplist {
        overflow-y: auto;
        padding: 4px;
        min-height: 60px;
      }
      .upi {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 8px;
        border-radius: 8px;
      }
      .upi:hover {
        background: var(--hover);
      }
      .upi .thumb,
      .upi .dtile {
        width: 32px;
        height: 32px;
        border-radius: 6px;
      }
      .upi .dtile b {
        font-size: 8px;
      }
      .uinfo {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .urow {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .urow.sub {
        font-size: 11px;
        color: var(--mute);
        flex-wrap: wrap;
      }
      .unm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ust {
        font-size: 10.5px;
        color: var(--mute);
        flex: none;
      }
      .upi.st-done .ust {
        color: var(--ok);
      }
      .upi.st-fail .ust {
        color: var(--danger);
      }
      .upi.st-rl .ust {
        color: var(--warn);
      }
      .upi.st-run .ust {
        color: var(--accent2);
      }
      .upi.st-cancel {
        opacity: 0.6;
      }
      .pbar {
        flex: 1;
        height: 4px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
        min-width: 60px;
      }
      .pbar i {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 0.12s linear;
      }
      .udet.ok {
        color: var(--ok);
      }
      .udet.err {
        color: var(--danger);
      }
      .udet.warn {
        color: var(--warn);
      }
      .udet .ic {
        width: 12px;
        height: 12px;
        margin-inline-end: 3px;
      }
      .udest {
        color: var(--faint);
      }
      .upfoot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-top: 1px solid var(--line);
        font-size: 11.5px;
        color: var(--mute);
      }
      .upfoot .fut {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .upempty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 22px;
        color: var(--faint);
        text-align: center;
        font-size: 12px;
      }
      .upempty p {
        margin: 0;
      }
      .dropveil {
        position: fixed;
        inset: 0;
        z-index: 250;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.12s;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .dropveil::before {
        content: '';
        position: absolute;
        inset: 10px;
        border: 2px dashed var(--accent2);
        border-radius: 16px;
      }
      .dropveil.on {
        opacity: 1;
      }
      .vbox {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 22px 34px;
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--accent);
        box-shadow: var(--shadow);
      }
      .vbox .ic {
        width: 34px;
        height: 34px;
        color: var(--accent2);
      }
      .vbox span {
        color: var(--mute);
        font-size: 12px;
      }
      .draghint {
        position: fixed;
        z-index: 260;
        left: 0;
        top: 0;
        pointer-events: none;
        padding: 5px 10px;
        border-radius: 8px;
        font-size: 12px;
        background: var(--accent);
        color: #fff;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        max-width: 320px;
      }
      .draghint.bad {
        background: var(--danger);
      }
      .ghost {
        position: fixed;
        top: -200px;
        left: -400px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 6px 8px;
        border-radius: 9px;
        background: var(--accent);
        color: #fff;
        font: 500 12px var(--font);
        max-width: 220px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
      }
      .ghost .gc {
        display: grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 99px;
        background: #fff;
        color: var(--accent);
        font: 600 11px var(--mono);
      }
      .ghost .gn {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ghost.multi {
        box-shadow:
          4px 4px 0 -1px rgba(124, 92, 255, 0.6),
          8px 8px 0 -2px rgba(124, 92, 255, 0.35);
      }
      .marquee {
        position: fixed;
        z-index: 90;
        pointer-events: none;
        background: var(--accent-soft);
        border: 1px solid var(--accent);
        border-radius: 3px;
      }
      body.marqueeing,
      body.dragging .row,
      body.marqueeing * {
        user-select: none !important;

        .lcre {

          box-shadow: 0 0 0 3px var(--accent-soft);
          animation: pop 0.14s ease-out;
        }
        .tstack {
          display: inline-flex;
          align-items: center;
          padding-inline-end: 8px;
        }
        .tk {
          display: inline-grid;
          place-items: center;
          width: 22px;
          height: 22px;
          border-radius: 6px;
          background: var(--panel);
          border: 2px solid var(--panel);
          margin-inline-end: -8px;
          position: relative;
          z-index: calc(4 - var(--i));
          overflow: hidden;
        }
        .tk .thumb,
        .tk .dtile {
          width: 100%;
          height: 100%;
          border-radius: 0;
        }
        .tk .fi .ic {
          width: 16px;
          height: 16px;
        }
        .tcount {
          display: none;
          min-width: 20px;
          height: 20px;
          padding: 0 5px;
          border-radius: 99px;
          background: var(--accent);
          color: #fff;
          font: 600 11px var(--mono);
          place-items: center;
        }
        .ttext {
          color: var(--accent2);
          font-weight: 500;
          white-space: nowrap;
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }
        .tray .btn:not(.pri) {
          background: var(--panel);
        }
        .btn.is-disabled {
          opacity: 0.55;
          filter: saturate(0.4);
        }
        .chipbtn {
          margin-inline-end: 2px;
        }
        .cut {
          opacity: 0.45;
          outline: 1.5px dashed var(--accent2);
          outline-offset: -2px;
        }
        .cut:hover {
          opacity: 0.65;
        }
        .tilewrap {
          display: none;
        }
        .tstack,
        .ttext {
          display: none;
        }
        .tcount {
          display: inline-grid;
        }
        .tray {
          gap: 6px;
        }
        .status {
          gap: 8px;
        }
        #stPath {
          display: none;
        }
        .uppop {
          inset-inline: 8px;
          width: auto;
        }
        .lsz {
          display: none;
        }
        .listview {
          --lg: minmax(140px, 1fr) 64px 26px;
        }
        .lhead .lsz {
          display: none;
        }
        .lvis,
        .lhead .lvis {
          display: none;
        }
        .listview {
          --lg: minmax(140px, 1fr) 26px;
        }
      }
      @media (hover: none) {
        .chk {
          position: static;
          opacity: 1;
          flex: none;
          margin: 0;
        }
        .ico {
          width: auto;
          gap: 6px;
          display: flex;
        }
        .tile .chk {

        .row:hover .icm,

        <div class="subbar">

        imgs(team, 5);

        const y24 = addFolder('2024', archive);
