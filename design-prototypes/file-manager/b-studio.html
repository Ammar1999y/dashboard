            '[data-id],.chead,button,a,input,.moreRow,.empty,.rbanner,.lhead,.gh,.lsec,#insp,#side'
          )
        )
          return;
        startMarquee(e, cont);
      });
      function startResize(e, rz) {
        e.preventDefault();
        const isI = rz.hasAttribute('data-rzi');
        const col = rz.parentElement;
        const startW = col.offsetWidth,
          sx = e.clientX,
          i = isI ? 'insp' : +rz.dataset.rz;
        document.body.classList.add('resizing');
        const move = (ev) => {
          const w = clamp(startW + (sx - ev.clientX), 170, 680);
          col.style.setProperty('--w', w + 'px');
          S.colW[i] = w;
        };
        const up = () => {
          document.body.classList.remove('resizing');
          removeEventListener('pointermove', move);
          removeEventListener('pointerup', up);
          removeEventListener('pointercancel', up);
        };
        addEventListener('pointermove', move);
        addEventListener('pointerup', up);
        addEventListener('pointercancel', up);
      }
      function startMarquee(e, cont) {
        e.preventDefault();
        mainEl.focus({ preventScroll: true });
        const host = cont.matches('.list') ? cont : cont.closest('#grid,#list');
        if (!host) return;
        const colKey = isNaN(+cont.dataset.col)
          ? cont.dataset.col
          : +cont.dataset.col;
        const items = $$('[data-id]', host);
        const additive = e.ctrlKey || e.metaKey || e.shiftKey;
        const base = additive ? new Set(S.sel) : new Set();
        const sx = e.clientX,
          sy = e.clientY,
          box = $('#marquee');
        let active = false,
          last = null;
        const move = (ev) => {
          if (!active) {
            if (Math.abs(ev.clientX - sx) < 5 && Math.abs(ev.clientY - sy) < 5)
              return;
            active = true;
            box.hidden = false;
            document.body.classList.add('marqueeing');
            S.cursor = { id: null, col: colKey };
          }
          const hr = host.getBoundingClientRect();
          const x = clamp(ev.clientX, hr.left, hr.right),
            y = clamp(ev.clientY, hr.top, hr.bottom);
          const l = Math.min(sx, x),
            t = Math.min(sy, y),
            r = Math.max(sx, x),
            b = Math.max(sy, y);
          box.style.left = l + 'px';
          box.style.top = t + 'px';
          box.style.width = r - l + 'px';
          box.style.height = b - t + 'px';
          const hit = new Set(base);
          items.forEach((it) => {
            const q = it.getBoundingClientRect();
            if (q.right > l && q.left < r && q.bottom > t && q.top < b) {
              hit.add(it.dataset.id);
              last = it.dataset.id;
            }
          });
          S.sel = hit;
          paintSel();
          if (ev.clientY < hr.top + 24) host.scrollTop -= 14;
          else if (ev.clientY > hr.bottom - 24) host.scrollTop += 14;
        };
        const up = () => {
          removeEventListener('pointermove', move);
          removeEventListener('pointerup', up);
          removeEventListener('pointercancel', up);
          box.hidden = true;
          document.body.classList.remove('marqueeing');
          if (!active) {
            if (!additive) clearSel(colKey);
            return;
          }
          const ids = [...S.sel];
          S.cursor = {
            id: last && S.sel.has(last) ? last : ids[ids.length - 1] || null,
            col: colKey,
          };
          S.anchor = ids[0] || null;
          afterSel();
        };
        addEventListener('pointermove', move);
        addEventListener('pointerup', up);
        addEventListener('pointercancel', up);
      }

      /* ---------- keyboard ---------- */
      function qlKey(e) {
        const k = e.key;
        if (k === 'Escape' || k === ' ') {
          e.preventDefault();
          closeQL();
        } else if (k === 'ArrowLeft') {
          e.preventDefault();
          qlGo(1);
        } else if (k === 'ArrowRight') {
          e.preventDefault();
          qlGo(-1);
        } else if (k === '+' || k === '=') {
          e.preventDefault();
          qlZoom(1.25);
        } else if (k === '-') {
          e.preventDefault();
          qlZoom(0.8);
        } else if (k === '0') {
          e.preventDefault();
          qlZoom(1, true);
        } else if (k === 'Tab') {
          e.preventDefault();
        }
      }
      document.addEventListener('keydown', (e) => {
        const t = e.target,
          k = e.key,
          mod = e.ctrlKey || e.metaKey;
        if (S.ql && !modals.length) {
          qlKey(e);
          return;
        }
        if ($('#pal')) return;
        if (mod && (k.toLowerCase() === 'k' || e.code === 'KeyK')) {
          e.preventDefault();
          openPalette();
          return;
        }
        if (modals.length) {
          if (k === 'Escape') {
            e.preventDefault();
            modals[modals.length - 1].close(undefined);
          }
          return;
        }
        if (menuEl) return;
        if (t.matches && t.matches('input,textarea,select,[contenteditable]'))
          return;
        const interactive = t.closest && t.closest('button,a,summary');
        if (
          interactive &&
          (k === 'Enter' || k === ' ' || k.startsWith('Arrow'))
        )
          return;
        if (mod && (k.toLowerCase() === 'a' || e.code === 'KeyA')) {
          e.preventDefault();
          selectAll();
          return;
        }
        if (mod && e.code === 'KeyX') {
          if (S.sel.size) {
            e.preventDefault();
            runAct('cut');
          }
          return;
        }
        if (mod && e.code === 'KeyV') {
          if (S.clip) {
            e.preventDefault();
            runAct('paste');
          }
          return;
        }
        if (mod && k === '[') {
          e.preventDefault();
          histGo(-1);
          return;
        }
        if (mod && k === ']') {
          e.preventDefault();
          histGo(1);
          return;
        }
        if (mod && k === 'ArrowUp') {
          e.preventDefault();
          goUp();
          return;
        }
        if (e.altKey && !mod) {
          const m = {
            KeyN: 'newfolder',
            KeyU: 'upload',
            Digit1: 'view-columns',
            Digit2: 'view-grid',
            Digit3: 'view-list',
            KeyI: 'inspector',
          }[e.code];
          if (m) {
            e.preventDefault();
            runAct(m);
          }
          return;
        }
        if (mod) return;
        if (k === '/') {
          e.preventDefault();
          qEl.focus();
          return;
        }
        if (k === '?' || k === '؟') {
          e.preventDefault();
          openShortcuts();
          return;
        }
        if (k === 'Escape') {
          if (S.upOpen) {
            S.upOpen = false;
            renderUploads();
            return;
          }
          if (S.sel.size) clearSel();
          else if (S.clip) {
            if (!S.clip.busy) cancelCut();
          } else if (resultsMode()) leaveResults();
          return;
        }
        if (k === 'F2') {
          e.preventDefault();
          runAct('rename');
          return;
        }
        if (k === 'Delete') {
          if (S.sel.size) {
            e.preventDefault();
            runAct('delete');
          }
          return;
        }
        if (k === 'Enter') {
          const s = selInfo();
          if (s.n === 1) {
            e.preventDefault();
            if (s.folders.length) enterFolder(s.ids[0]);
            else openQL(s.ids[0]);
          } else if (s.files.length) {
            e.preventDefault();
            runAct('preview');
          }
          return;
        }
        if (k === ' ') {
          e.preventDefault();
          if (selInfo().files.length) runAct('preview');
          return;
        }
        if (k === 'Backspace') {
          e.preventDefault();
          goUp();
          return;
        }
        if (k === 'ArrowDown' || k === 'ArrowUp') {
          e.preventDefault();
          if (e.shiftKey && viewMode() !== 'grid')
            moveCursor(k === 'ArrowDown' ? 1 : -1, true);
          else if (e.shiftKey)
            moveCursor(k === 'ArrowDown' ? gridPerRow() : -gridPerRow(), true);
          else keyDirection(k);
          return;
        }
        if (k === 'ArrowLeft' || k === 'ArrowRight') {
          e.preventDefault();
          if (e.shiftKey && viewMode() === 'grid')
            moveCursor(k === 'ArrowLeft' ? 1 : -1, true);
          else keyDirection(k);
          return;
        }
        if (k.length === 1 && !e.altKey) typeAhead(k);
      });

      /* ---------- drag & drop (internal moves + desktop files) ---------- */
      const hint = $('#draghint'),
        veil = $('#dropveil');
      let veilTimer = null;
      const dtTypes = (e) =>
        Array.from((e.dataTransfer && e.dataTransfer.types) || []);
      function judgeMove(key) {
        if (key == null || !S.drag) return { ok: false, reason: '' };
        const target = fromKey(key),
          ids = S.drag.ids;
        if (target == null && ids.some((i) => !isFolderId(i)))
          return {
            ok: false,
            reason: 'الجذر يحتوي مجلدات فقط — لا يمكن نقل الملفات إليه',
          };
        const folders = ids.filter(isFolderId);
        if (target != null && chainOf(target).some((x) => folders.includes(x)))
          return {
            ok: false,
            reason: 'لا يمكن نقل مجلد إلى داخل نفسه أو أحد مجلداته الفرعية',
          };
        const same = ids.every((i) => {
          const it = S.items.get(i);
          if (!it) return false;
          return (isFolderId(i) ? it.parentId : it.folderId) === target;
        });
        if (same)
          return {
            ok: false,
            reason: 'العناصر موجودة في هذا المجلد بالفعل',
            soft: true,
          };
        return { ok: true };
      }
      function clearDz() {
        if (S.dz) {
          S.dz.classList.remove('dz-ok', 'dz-bad');
          S.dz = null;
        }
        if (S.spring) {
          clearTimeout(S.spring.timer);
          S.spring = null;
        }
      }
      function endDrag() {
        S.drag = null;
        clearDz();
        hint.hidden = true;
        veil.classList.remove('on');
        clearTimeout(veilTimer);
        document.body.classList.remove('dragging');
      }
      function springOpen(el) {
        const id = el.dataset.dz;
        if (!id || id === 'root' || !el.isConnected) return;
        el.classList.add('sprung');
        if (
          S.view === 'columns' &&
          !resultsMode() &&
          el.classList.contains('row')
        ) {
          const ci = +el.closest('.list').dataset.col;
          setPath(S.path.slice(0, ci + 1).concat(id));
        } else if (el.classList.contains('lrow')) toggleExpand(id, true);
        else goTo(id);
      }
      document.addEventListener('pointerdown', () => {
        S.drag = null;
      });
      document.addEventListener('dragstart', (e) => {
        const el =
          e.target.closest &&
          e.target.closest('#main [data-id][draggable="true"]');
        if (!el) {
          if (e.target.tagName === 'IMG') e.preventDefault();
          return;
        }
        const id = el.dataset.id;
        if (!S.sel.has(id)) itemClick(id, colOf(el), {});
        const ids = [...S.sel];
        S.drag = { ids };
        const dt = e.dataTransfer;
        dt.effectAllowed = 'move';
        dt.setData('application/x-fm', ids.join(','));
        dt.setData(
          'text/plain',
          ids.map((i) => nameOf(S.items.get(i) || { name: i })).join('\n')
        );
        const g = $('#ghost');
        g.innerHTML = `<span class="gc">${ids.length}</span><span class="gn">${esc(nameOf(S.items.get(id) || { name: '' }))}</span>`;
        g.classList.toggle('multi', ids.length > 1);
        dt.setDragImage(g, 14, 14);
        document.body.classList.add('dragging');
      });
      document.addEventListener('dragover', (e) => {
        const types = dtTypes(e);
        const internal = !!S.drag && types.includes('application/x-fm');
        const external = !internal && types.includes('Files');
        if (!internal && !external) return;
        const dz = e.target.closest && e.target.closest('[data-dz]');
        let key = dz && dz.dataset.dz ? dz.dataset.dz : null;
        let ok,
          reason = '',
          label = '',
          soft = false;
        if (internal) {
          const v = judgeMove(key);
          ok = v.ok;
          reason = v.reason || '';
          soft = !!v.soft;
          if (ok)
            label = `نقل ${cnt(S.drag.ids.length, 'item')} إلى «${folderName(fromKey(key))}»`;
        } else {
          if (key == null) key = dkey(loc());
          ok = true;
          label =
            key === 'root'
              ? 'أفلت لاختيار مجلد الرفع (الجذر لا يقبل ملفات)'
              : `رفع إلى «${folderName(fromKey(key))}»`;
          veil.classList.add('on');
          $('#veilTarget').textContent = label;
          clearTimeout(veilTimer);
          veilTimer = setTimeout(() => veil.classList.remove('on'), 1200);
        }
        e.dataTransfer.dropEffect = ok ? (internal ? 'move' : 'copy') : 'none';
        if (ok || external) e.preventDefault();
        if (internal && !ok && reason) e.dataTransfer.dropEffect = 'none';
        if (dz !== S.dz) {
          clearDz();
          if (dz && dz.dataset.dz) {
            S.dz = dz;
            if (ok || !soft) dz.classList.add(ok ? 'dz-ok' : 'dz-bad');
            if (
              ok &&
              dz.matches('.row,.tile,.lrow') &&
              dz.dataset.dz !== 'root'
            )
              S.spring = { timer: setTimeout(() => springOpen(dz), 700) };
          }
        } else if (S.dz) {
          S.dz.classList.toggle('dz-ok', ok);
          S.dz.classList.toggle('dz-bad', !ok && !soft);
        }
        const text = ok ? label : reason;
        if (text && internal) {
          hint.hidden = false;
          hint.textContent = text;
          hint.classList.toggle('bad', !ok);
          hint.style.transform = `translate(${Math.min(e.clientX + 16, innerWidth - hint.offsetWidth - 8)}px, ${Math.min(e.clientY + 18, innerHeight - 40)}px)`;
        } else hint.hidden = true;
      });
      document.addEventListener('dragleave', (e) => {
        if (e.relatedTarget === null) {
          veil.classList.remove('on');
          hint.hidden = true;
          clearDz();
        }
      });
      document.addEventListener('drop', (e) => {
        const types = dtTypes(e);
        const internal = !!S.drag && types.includes('application/x-fm');
        const external = !internal && types.includes('Files');
        if (!internal && !external) return;
        e.preventDefault();
        const dz = e.target.closest && e.target.closest('[data-dz]');
        const key = dz && dz.dataset.dz ? dz.dataset.dz : null;
        const ids = S.drag ? S.drag.ids.slice() : [];
        const v = internal ? judgeMove(key) : null;
        const dt = e.dataTransfer;
        endDrag();
        if (internal) {
          if (!v.ok) {
            if (v.reason && !v.soft) toast(v.reason, 'error');
            return;
          }
          moveItems(ids, fromKey(key));
        } else handleDesktopDrop(dt, key == null ? undefined : fromKey(key));
      });
      document.addEventListener('dragend', endDrag);

      /* ---------- quick look interactions ---------- */
      const qlEl = $('#ql');
      qlEl.addEventListener('click', (e) => {
        const b = e.target.closest('[data-ql]');
        if (b) {
          const a = b.dataset.ql;
          if (a === 'close') closeQL();
          else if (a === 'prev') qlGo(-1);
          else if (a === 'next') qlGo(1);
          else if (a === 'zin') qlZoom(1.25);
          else if (a === 'zout') qlZoom(0.8);
          else if (a === 'zreset') qlZoom(1, true);
          else if (a === 'download' && S.ql) downloadFiles([S.ql.list[S.ql.i]]);
          else if (a === 'pdf' && S.ql) openPdfPreview(S.ql.list[S.ql.i]);
          return;
        }
        if (e.target.id === 'qlstage') closeQL();
      });
      qlEl.addEventListener(
        'wheel',
        (e) => {
          if (!S.ql || !$('#qlimg')) return;
          e.preventDefault();
          qlZoom(e.deltaY < 0 ? 1.15 : 1 / 1.15);
        },
        { passive: false }
      );
      qlEl.addEventListener('pointerdown', (e) => {
        const img = e.target.closest('#qlimg');
        if (!img || !S.ql || e.button !== 0) return;
        e.preventDefault();
        const q = S.ql,
          sx = e.clientX,
          sy = e.clientY,
          tx = q.tx,
          ty = q.ty;
        let moved = false;
        const move = (ev) => {
          if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 4)
            moved = true;
          if (q.z > 1 && moved) {
            q.tx = tx + (ev.clientX - sx);
            q.ty = ty + (ev.clientY - sy);
            applyQL();
          }
        };
        const up = () => {
          removeEventListener('pointermove', move);
          removeEventListener('pointerup', up);
          if (!moved) qlZoom(q.z > 1 ? 1 : 2.5, q.z > 1);
        };
        addEventListener('pointermove', move);
        addEventListener('pointerup', up);
      });

      /* ---------- global safety nets ---------- */
      document.addEventListener(
        'error',
        (e) => {
          const t = e.target;
          if (t && t.tagName === 'IMG') {
            if (t.id === 'qlimg') {
              const st = $('#qlstage');
              if (st)
                st.innerHTML = `<div class="qldoc">${ic('triangle-alert', 'big')}<h3>تعذّر تحميل المعاينة</h3></div>`;
            } else if (t.closest('.thumb,.bigthumb,.stk')) t.remove();
          }
        },
        true
      );
      addEventListener('resize', () => {
        closeMenu();
      });
      addEventListener('beforeunload', () => {
        S.uploads.forEach((u) => {
          if (u.thumb) URL.revokeObjectURL(u.thumb);
        });
      });

      /* ---------- boot ---------- */
      function boot() {
        $$('i[data-ic]').forEach((el) => {
          el.outerHTML = ic(el.dataset.ic);
        });
        $('#palKbd').textContent = MOD + 'K';
        S.showInsp = innerWidth >= 900;
        setTheme(S.theme);
        renderFilterBadge();
        syncViewUi();
        setFuture(true);
        watchBlurs();
        paintBlurs();
        $('#tile').value = S.tile;
        $('#grid').style.setProperty('--t', S.tile + 'px');
        S.hist = [[null]];
        S.hi = 0;
        loadDir(null);
        renderView();
        afterNav();
        afterSelUi();
        renderUploads();
      }
      boot();
    </script>
  </body>
</html>
