        const y25 = addFolder('2025', archive);
        imgs(y25, 15);
        docs(y25, ['pdf', 'xlsx', 'docx', 'pdf', 'xlsx']);
        const q1 = addFolder('الربع الأول', y25);
        imgs(q1, 2);

        // files that are in use (cannot be deleted)
        const firstOf = (fid) =>
          [...files.values()].find((f) => f.folderId === fid).id;
        const lastOf = (fid) =>
          [...files.values()].filter((f) => f.folderId === fid).pop().id;
        const U = (resource, recordId, name) => ({ resource, recordId, name });
        used.set(firstOf(home), [
          U('page', 3, 'الصفحة الرئيسية — البانر الرئيسي'),
          U('project', 12, 'صورة مشروع — الواجهة البحرية'),
        ]);
        used.set(lastOf(home), [U('section', 7, 'قسم الشركاء')]);
        used.set(firstOf(brand), [
          U('settings', 1, 'إعدادات الموقع — الشعار'),
          U('layout', 2, 'الترويسة'),
          U('layout', 3, 'تذييل الصفحة'),
        ]);
        used.set(firstOf(team), [U('page', 5, 'صفحة من نحن — فريق العمل')]);
        used.set(firstOf(oasis), [U('project', 12, 'مشروع الواحة — المعرض')]);
        used.set(firstOf(ramadan), [
          U('campaign', 4, 'حملة رمضان — البانر'),
          U('newsletter', 9, 'النشرة البريدية'),
        ]);
        used.set(firstOf(official), [U('page', 8, 'صفحة الشروط والأحكام')]);
        hidden.set(firstOf(home), 1);
        hidden.set(firstOf(brand), 2);

        // a couple of private-use public files so the "public" state is visible early
        files.get(firstOf(home)).bucketType = 'public';
        files.get(firstOf(brand)).bucketType = 'public';

        return { folders, files, used, hidden, seq: { d: dN, f: fN } };
      }

      /* =====================================================================
   2. MOCK API  (the UI touches data ONLY through `api`)
   Every method: 200-600 ms latency, rejects with { status, message }.
   ===================================================================== */
      const db = seedDb();
      const seq = { d: db.seq.d, f: db.seq.f };
      const publishLog = [];
      const jitter = () => sleep(200 + Math.random() * 400);
      // every rejection: { status, code, message, ...extra } - the UI branches on `code`
      const fail = (status, code, message, extra) => {
        throw Object.assign({ status, code, message }, extra || {});
      };
      const byAr = (a, b) =>
        a.localeCompare(b, 'ar', { numeric: true, sensitivity: 'base' });

      function checkName(name, max, what) {
        if (typeof name !== 'string' || !name.trim().length)
          fail(400, 'NAME_INVALID', `${what} لا يمكن أن يكون فارغًا`);
        if (name.length > max)
          fail(400, 'NAME_INVALID', `${what} يجب ألا يتجاوز ${max} حرفًا`);
        if (/[\/\\]/.test(name))
          fail(
            400,
            'NAME_INVALID',
            `${what} لا يجوز أن يحتوي على الرمز / أو \\`
          );
      }
      function checkFolderName(name) {
        checkName(name, 100, 'اسم المجلد');
        if (name.trim() === '.' || name.trim() === '..')
          fail(400, 'NAME_INVALID', 'اسم المجلد غير صالح');
      }
      const dbChildren = (pid) =>
        [...db.folders.values()]
          .filter((f) => f.parentId === pid)
          .sort((a, b) => byAr(a.name, b.name));
      function dbCrumbs(id) {
        const out = [];
        let c = id;
        while (c != null) {
          const f = db.folders.get(c);
          if (!f) break;
          out.unshift({ id: f.id, name: f.name });
          c = f.parentId;
        }
        return out;
      }
      const dbDepth = (id) => dbCrumbs(id).length;
      function dbDescendants(id) {
        const out = [];
        const walk = (p) => {
          for (const f of dbChildren(p)) {
            out.push(f.id);
            walk(f.id);
          }
        };
        walk(id);
        return out;
      }
      const dbIsInside = (id, ancestor) => {
        let c = id;
        while (c != null) {
          if (c === ancestor) return true;
          const f = db.folders.get(c);
          c = f ? f.parentId : null;
        }
        return false;
      };
      function dbHeight(id) {
        const kids = dbChildren(id);
        return (
          1 + (kids.length ? Math.max(...kids.map((k) => dbHeight(k.id))) : 0)
        );
      }
      const dbFilesIn = (fid) =>
        [...db.files.values()].filter((f) => f.folderId === fid);
      function assertUnique(parentId, name, exceptId) {
        const n = name.trim().toLowerCase();
        if (
          dbChildren(parentId).some(
            (f) => f.id !== exceptId && f.name.trim().toLowerCase() === n
          )
        )
          fail(409, 'FOLDER_NAME_EXISTS', 'يوجد مجلد بهذا الاسم في نفس المكان');
      }
      // in-use files: the 409 carries code FILE_IN_USE and the ids of the files that block the request
      function usedInfo(ids) {
        const parts = [],
          used = [];
        for (const id of ids) {
          const u = db.used.get(id);
          if (u && u.length) {
            used.push(id);
            parts.push(
              `«${db.files.get(id).displayName}» ← ${u.map((x) => `${RES_AR[x.resource] || x.resource} #${x.recordId}`).join('، ')}`
            );
          }
        }
        return used.length
          ? {
              ids: used,
              message: `لا يمكن حذف الملف لأنه مستخدم في: ${parts.join(' | ')}`,
            }
          : null;
      }
      const touch = (o) => {
        o.updatedAt = Date.now();
        return o;
      };

      function applyFilters(pool, fl) {
        fl = fl || {};
        return pool.filter((f) => {
          if (fl.kind && f.kind !== fl.kind) return false;
          if (fl.bucketType && f.bucketType !== fl.bucketType) return false;
          if (fl.type && tkey(f) !== fl.type) return false;
          if (fl.minSize != null && f.sizeBytes < fl.minSize) return false;
          if (fl.maxSize != null && f.sizeBytes > fl.maxSize) return false;
          if (fl.createdAfter != null && f.createdAt < fl.createdAfter)
            return false;
          return true;
        });
      }
      function sortFiles(pool, sort) {
        const s = (sort && sort[0]) || { id: 'name', desc: false };
        const dir = s.desc ? -1 : 1;
        const key =
          {
            name: (a, b) => byAr(a.displayName, b.displayName),
            size: (a, b) => a.sizeBytes - b.sizeBytes,
            type: (a, b) =>
              a.mimeType.localeCompare(b.mimeType) ||
              byAr(a.displayName, b.displayName),
            createdAt: (a, b) => a.createdAt - b.createdAt,
            updatedAt: (a, b) => a.updatedAt - b.updatedAt,
          }[s.id] || ((a, b) => byAr(a.displayName, b.displayName));
        return pool
          .slice()
          .sort(
            (a, b) => dir * key(a, b) || byAr(a.displayName, b.displayName)
          );
      }
      const readDims = (url) =>
        new Promise((res) => {
          const img = new Image();
          const t = setTimeout(() => res(null), 1500);
          img.onload = () => {
            clearTimeout(t);
            res({ w: img.naturalWidth, h: img.naturalHeight });
          };
          img.onerror = () => {
            clearTimeout(t);
            res(null);
          };
          img.src = url;
        });

      // tiny valid PDF served from a blob: stands in for a signed previewUrl
      function mockPdfUrl(f) {
        if (!f._prev) {
          const content =
            'BT /F1 22 Tf 60 740 Td (Mock PDF preview - ' + f.id + ') Tj ET';
          const objs = [
            '<< /Type /Catalog /Pages 2 0 R >>',
            '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
            '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 5 0 R /Resources << /Font << /F1 4 0 R >> >> >>',
            '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
            '<< /Length ' +
              content.length +
              ' >>\nstream\n' +
              content +
              '\nendstream',
          ];
          let pdf = '%PDF-1.4\n';
          const offs = [];
          objs.forEach((o, i) => {
            offs.push(pdf.length);
            pdf += i + 1 + ' 0 obj\n' + o + '\nendobj\n';
          });
          const xref = pdf.length;
          pdf +=
            'xref\n0 ' +
            (objs.length + 1) +
            '\n0000000000 65535 f \n' +
            offs
              .map((o) => String(o).padStart(10, '0') + ' 00000 n \n')
              .join('') +
            'trailer\n<< /Size ' +
            (objs.length + 1) +
            ' /Root 1 0 R >>\nstartxref\n' +
            xref +
            '\n%%EOF';
          f._prev = URL.createObjectURL(
            new Blob([pdf], { type: 'application/pdf' })
          );
        }
        return f._prev;
      }

      const api = {
        // GET /api/dash/media   (scope=folder + search filters the folder's DIRECT files only; subfolders come back unfiltered)
        async list({
          scope = 'folder',
          folderId = null,
          search = '',
          sort,
          filters,
          page = 1,
          perPage = PER_PAGE,
        } = {}) {
          await jitter();
          perPage = clamp(perPage | 0 || PER_PAGE, 1, 100);
          page = Math.max(1, page | 0);
          const term = String(search || '')
            .trim()
            .toLowerCase();
          const useSearch = term.length >= 3;
          let folders = [],
            pool,
            breadcrumbs = [];
          if (scope === 'folder') {
            if (folderId != null && !db.folders.has(folderId))
              fail(404, 'NOT_FOUND', 'المجلد غير موجود');
            breadcrumbs = dbCrumbs(folderId);
            // itemCount: FUTURE (itemcount) - a cheap direct-child count the real list does not return yet
            folders = dbChildren(folderId).map((f) => ({
              ...f,
              itemCount: dbChildren(f.id).length + dbFilesIn(f.id).length,
            }));
            pool = folderId == null ? [] : dbFilesIn(folderId);
          } else {
            pool = [...db.files.values()];
            if (useSearch)
              folders = [...db.folders.values()]
                .filter((f) => f.name.toLowerCase().includes(term))
                .sort((a, b) => byAr(a.name, b.name))
                .slice(0, 20)
                .map((f) => ({
                  ...f,
                  itemCount: dbChildren(f.id).length + dbFilesIn(f.id).length,
                  breadcrumbs: dbCrumbs(f.id),
                }));
          }
          if (useSearch)
            pool = pool.filter((f) =>
              f.displayName.toLowerCase().includes(term)
            );
          pool = sortFiles(applyFilters(pool, filters), sort);
          const total = pool.length,
            pageCount = Math.max(1, Math.ceil(total / perPage));
          return {
            breadcrumbs,
            folders, // inUse: FUTURE (inuse) - the real list does not say whether a file is in use
            files: pool
              .slice((page - 1) * perPage, page * perPage)
              .map((f) => ({ ...f, inUse: db.used.has(f.id) })),
            meta: { page, perPage, total, pageCount },
            canPublish: true,
          };
        },

        // GET /api/dash/media/files/:id
        async details(id) {
          await jitter();
          const f = db.files.get(id);
          if (!f) fail(404, 'NOT_FOUND', 'الملف غير موجود');
          if (!f._blob && f.url === '#')
            f._blob = URL.createObjectURL(
              new Blob(['ملف تجريبي — ' + f.displayName], {
                type: 'text/plain',
              })
            );
          const exp = Date.now() + 3600e3;
          return {
            ...f,
            downloadUrl: f._blob || f.url,
            previewUrl: f.mimeType === 'application/pdf' ? mockPdfUrl(f) : null,
            permanentUrl:
              f.bucketType === 'public'
                ? `https://cdn.studio.example/media/${f.id}/${encodeURIComponent(f.displayName)}`
                : null,
            tempUrl: `https://api.studio.example/api/dash/media/files/${f.id}/download?token=${Math.random().toString(36).slice(2, 12)}&exp=${exp}`,
            // the real API returns resource + recordId only; `name` is FUTURE (usedby-names)
            usedBy: (db.used.get(id) || []).map((x) => ({ ...x })),
            hiddenUsages: db.hidden.get(id) || 0,
          };
        },

        // POST /api/dash/media/files?folder=   (ONE file per request)
        async upload(folderId, file, { onProgress, signal } = {}) {
          await jitter();
          const aborted = () => fail(0, 'ABORTED', 'أُلغي الرفع');
          if (signal && signal.aborted) aborted();
          if (folderId == null)
            fail(
              400,
              'ROOT_HOLDS_FOLDERS_ONLY',
              'لا يمكن رفع الملفات إلى الجذر، اختر مجلدًا أولًا'
            );
          if (!db.folders.has(folderId))
            fail(404, 'NOT_FOUND', 'المجلد غير موجود');
          const key = tkeyOfFile(file);
          if (!key)
            fail(400, 'UNSUPPORTED_TYPE', `نوع الملف "${file.name}" غير مدعوم`);
          const t = TYPES[key],
            max = t.kind === 'image' ? IMG_MAX : DOC_MAX;
          if (file.size > max)
            fail(
              400,
              'FILE_TOO_LARGE',
              `حجم الملف "${file.name}" (${fmtSize(file.size)}) يتجاوز الحد المسموح للـ${t.kind === 'image' ? 'صور' : 'مستندات'} وهو ${fmtSize(max)}`
            );
          if (Math.random() < 1 / 12)
            fail(429, 'RATE_LIMITED', 'تجاوزت حد الرفع المسموح', {
              retryAfter: 3 + Math.floor(Math.random() * 6),
            });
          await new Promise((res, rej) => {
            let p = 0;
            const timer = setInterval(() => {
              if (signal && signal.aborted) {
                clearInterval(timer);
                rej({ status: 0, code: 'ABORTED', message: 'أُلغي الرفع' });
                return;
              }
              p += 8 + Math.random() * 14;
              if (p >= 100) {
                clearInterval(timer);
                onProgress && onProgress(100);
                res();
              } else onProgress && onProgress(p);
            }, 110);
          });
          const reencode = key === 'png' || key === 'webp';
          const id = 'f' + ++seq.f,
            now = Date.now();
          const url = URL.createObjectURL(file);
          const dims = t.kind === 'image' ? await readDims(url) : null;
          const rec = {
            id,
            kind: t.kind,
            displayName: reencode
              ? file.name.replace(/\.[^.]+$/, '') + '.webp'
              : file.name,
            mimeType: reencode ? TYPES.webp.mime : t.mime,
            sizeBytes: reencode
              ? Math.max(1, Math.round(file.size * (0.3 + Math.random() * 0.4)))
              : file.size,
            url,
            bucketType: 'private',
            transition: null,
            width: dims ? dims.w : null,
            height: dims ? dims.h : null,
            // the real server computes a blurhash for every raster upload; the mock borrows a seeded one
            blurhash: reencode ? BLURHASHES[seq.f % BLURHASHES.length] : null,
            folderId,
            uploadedBy: USERS[0],
            createdAt: now,
            updatedAt: now,
          };
          db.files.set(id, rec);
          return { ...rec };
        },

        // PUT /api/dash/media/files/:id   { displayName }
        async renameFile(id, displayName) {
          await jitter();
          const f = db.files.get(id);
          if (!f) fail(404, 'NOT_FOUND', 'الملف غير موجود');
          checkName(displayName, 150, 'اسم الملف');
          f.displayName = displayName;
          touch(f);
          return { ...f };
        },

        // PUT /api/dash/media/files/:id   { folderId }
        async moveFile(id, folderId) {
          await jitter();
          const f = db.files.get(id);
          if (!f) fail(404, 'NOT_FOUND', 'الملف غير موجود');
          if (folderId == null)
            fail(
              400,
              'ROOT_HOLDS_FOLDERS_ONLY',
              'لا يمكن نقل الملفات إلى الجذر، اختر مجلدًا'
            );
          if (!db.folders.has(folderId))
            fail(404, 'NOT_FOUND', 'المجلد الوجهة غير موجود');
          f.folderId = folderId;
          touch(f);
          return { ...f };
        },

        // PUT /api/dash/media/files   { ids, folderId }   (1-50, all-or-nothing)
        async moveFiles(ids, folderId) {
          await jitter();
          if (!Array.isArray(ids) || ids.length < 1 || ids.length > BULK_MAX)
            fail(
              400,
              'BULK_SIZE_INVALID',
              `يجب تحديد من 1 إلى ${BULK_MAX} ملفًا في الطلب الواحد`
            );
          if (ids.some(isFolderId))
            fail(
              400,
              'BULK_FOLDERS_NOT_ALLOWED',
              'لا يمكن نقل المجلدات عبر هذا الطلب'
            );
          if (folderId == null)
            fail(
              400,
              'ROOT_HOLDS_FOLDERS_ONLY',
              'لا يمكن نقل الملفات إلى الجذر، اختر مجلدًا'
            );
          if (!db.folders.has(folderId))
            fail(404, 'NOT_FOUND', 'المجلد الوجهة غير موجود');
          if (ids.some((i) => !db.files.has(i)))
            fail(404, 'NOT_FOUND', 'بعض الملفات غير موجودة');
          ids.forEach((i) => {
            const f = db.files.get(i);
            f.folderId = folderId;
            touch(f);
          });
          return { moved: ids.length };
        },

        // DELETE /api/dash/media/files   { ids }   (1-50, all-or-nothing, permanent)
        async deleteFiles(ids) {
          await jitter();
          if (!Array.isArray(ids) || ids.length < 1 || ids.length > BULK_MAX)
            fail(
              400,
              'BULK_SIZE_INVALID',
              `يجب تحديد من 1 إلى ${BULK_MAX} ملفًا في الطلب الواحد`
            );
          if (ids.some(isFolderId))
            fail(
              400,
              'BULK_FOLDERS_NOT_ALLOWED',
              'لا يمكن حذف المجلدات عبر هذا الطلب'
            );
          if (ids.some((i) => !db.files.has(i)))
            fail(404, 'NOT_FOUND', 'بعض الملفات غير موجودة');
          const used = usedInfo(ids);
          if (used) fail(409, 'FILE_IN_USE', used.message, { ids: used.ids });
          ids.forEach((i) => db.files.delete(i));
          return { deleted: ids.length, pending: 0 };
        },

        // POST /api/dash/media/files/:id/publish   (10 per minute)
        async publish(id) {
          await jitter();
          const f = db.files.get(id);
          if (!f) fail(404, 'NOT_FOUND', 'الملف غير موجود');
          rateLimitPublish();
          if (f.bucketType === 'public')
            fail(409, 'FILE_ALREADY_PUBLIC', 'الملف منشور بالفعل');
          f.bucketType = 'public';
          touch(f);
          return { ...f };
        },

        // POST /api/dash/media/files/:id/unpublish   (10 per minute)
        async unpublish(id) {
          await jitter();
          const f = db.files.get(id);
          if (!f) fail(404, 'NOT_FOUND', 'الملف غير موجود');
          rateLimitPublish();
          if (f.bucketType === 'private')
            fail(409, 'FILE_ALREADY_PRIVATE', 'الملف خاص بالفعل');
          f.bucketType = 'private';
          touch(f);
          return { ...f };
        },

        // POST /api/dash/media/folders   { parentId, name }
        async createFolder(parentId, name) {
          await jitter();
          checkFolderName(name);
          if (parentId != null && !db.folders.has(parentId))
            fail(404, 'NOT_FOUND', 'المجلد الأب غير موجود');
          if (parentId != null && dbDepth(parentId) + 1 > MAX_DEPTH)
            fail(
              422,
              'FOLDER_TOO_DEEP',
              `لا يمكن تجاوز ${MAX_DEPTH} مستويات من المجلدات`
            );
          if (dbChildren(parentId).length >= MAX_CHILDREN)
            fail(
              422,
              'FOLDER_FULL',
              `بلغ المجلد الحد الأقصى (${MAX_CHILDREN} مجلد فرعي)`
            );
          assertUnique(parentId, name);
          const id = 'd' + ++seq.d,
            now = Date.now();
          db.folders.set(id, {
            id,
            parentId,
            name: name.trim(),
            createdBy: USERS[0],
            createdAt: now,
            updatedAt: now,
          });
          return { id, name: name.trim() };
        },

        // PUT /api/dash/media/folders/:id   { name?, parentId? }   (parentId null = root)
        async updateFolder(id, { name, parentId } = {}) {
          await jitter();
          const f = db.folders.get(id);
          if (!f) fail(404, 'NOT_FOUND', 'المجلد غير موجود');
          const target = parentId !== undefined ? parentId : f.parentId;
          const nextName = name !== undefined ? name : f.name;
          if (name !== undefined) checkFolderName(name);
          if (parentId !== undefined) {
            if (parentId != null && !db.folders.has(parentId))
              fail(404, 'NOT_FOUND', 'المجلد الوجهة غير موجود');
            if (parentId != null && dbIsInside(parentId, id))
              fail(
                422,
                'FOLDER_CYCLE',
                'لا يمكن نقل مجلد إلى داخل نفسه أو أحد مجلداته الفرعية'
              );
            const base = parentId == null ? 0 : dbDepth(parentId);
            if (base + dbHeight(id) > MAX_DEPTH)
              fail(
                422,
                'FOLDER_TOO_DEEP',
                `لا يمكن تجاوز ${MAX_DEPTH} مستويات من المجلدات`
              );
            if (
              parentId !== f.parentId &&
              dbChildren(parentId).length >= MAX_CHILDREN
            )
              fail(
                422,
                'FOLDER_FULL',
                `بلغ المجلد الوجهة الحد الأقصى (${MAX_CHILDREN} مجلد فرعي)`
              );
          }
          assertUnique(target, nextName, id);
          f.name = nextName.trim();
          f.parentId = target;
          touch(f);
          return { ...f };
        },

        // FUTURE (delete-preview): GET /api/dash/media/folders/:id/stats - does not exist today
        async folderStats(id) {
          await jitter();
          if (!db.folders.has(id)) fail(404, 'NOT_FOUND', 'المجلد غير موجود');
          const sub = dbDescendants(id),
            fl = [id, ...sub].flatMap(dbFilesIn);
          return {
            folders: sub.length,
            files: fl.length,
            total: sub.length + fl.length,
            sizeBytes: fl.reduce((a, x) => a + x.sizeBytes, 0),
          };
        },

        // DELETE /api/dash/media/folders/:id?recursive=
        async deleteFolder(id, recursive) {
          await jitter();
          const f = db.folders.get(id);
          if (!f) fail(404, 'NOT_FOUND', 'المجلد غير موجود');
          const subFolders = dbDescendants(id);
          const allFolderIds = [id, ...subFolders];
          const fl = allFolderIds.flatMap(dbFilesIn);
          const total = subFolders.length + fl.length;
          if (total > 0 && !recursive)
            fail(
              409,
              'FOLDER_NOT_EMPTY',
              'لا يمكن حذف مجلد غير فارغ — احذف محتوياته أولًا أو فعّل الحذف المتكرر'
            );
          if (total > RECURSIVE_MAX)
            fail(
              422,
              'FOLDER_TOO_LARGE',
              `المجلد يحتوي ${total} عنصرًا، والحد الأقصى للحذف المتكرر ${RECURSIVE_MAX} عنصر`
            );
          const used = usedInfo(fl.map((x) => x.id));
          if (used) fail(409, 'FILE_IN_USE', used.message, { ids: used.ids });
          fl.forEach((x) => db.files.delete(x.id));
          allFolderIds.forEach((x) => db.folders.delete(x));
          return { deleted: total + 1 };
        },
      };
      function rateLimitPublish() {
        const now = Date.now();
        while (publishLog.length && now - publishLog[0] > 60e3)
          publishLog.shift();
        if (publishLog.length >= 10)
          fail(
            429,
            'RATE_LIMITED',
            'تجاوزت حد النشر (10 عمليات في الدقيقة)، حاول بعد قليل',
            { retryAfter: Math.ceil((60e3 - (now - publishLog[0])) / 1000) }
          );
        publishLog.push(now);
      }

      /* =====================================================================
   3. STATE + DATA LAYER (loading, navigation, selection)
   ===================================================================== */
      const LS = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch (e) {
            /* storage unavailable */
          }
        },
      };
      const S = {
        theme:
          LS.get('fm-b-theme') ||
          (matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'),
        view: ['columns', 'grid', 'list'].includes(LS.get('fm-b-view'))
          ? LS.get('fm-b-view')
          : 'columns',
        future: true,
        showInsp: true,
        path: [null], // opened chain; path[0] = root
        dirs: new Map(), // folderKey -> { status, folders, files, meta, breadcrumbs, perPage, gen, error, loadingMore }
        items: new Map(), // id -> latest folder/file object
        fold: new Map(), // folderId -> { id, name, parentId }
        sel: new Set(),
        cursor: { id: null, col: 0 },
        anchor: null,
        colW: [],
        tile: 150,
        sort: { id: 'name', desc: false },
        filters: {},
        q: '',
        qFolder: null,
        all: false,
        scope: 'all',
        res: null,
        expanded: new Set(),
        editing: null,
        hist: [],
        hi: -1,
        det: new Map(),
        uploads: [],
        upOpen: false,
        busy: 0,
        fstats: new Map(),
        clip: null,
        drag: null,
        dz: null,
        pendingFocus: null,
        typeBuf: '',
        typeAt: 0,
      };

      const loc = () => S.path[S.path.length - 1];
      const dirOf = (id) => S.dirs.get(dkey(id));
      const resultsMode = () => !!(S.q || S.all);
      const folderName = (id) =>
        id == null ? 'المكتبة' : (S.fold.get(id) || { name: '…' }).name;
      function chainOf(id) {
        const out = [];
        let c = id;
        while (c != null) {
          out.unshift(c);
          const f = S.fold.get(c);
          if (!f) break;
          c = f.parentId;
        }
        return out;
      }
      const pathText = (id) =>
        ['المكتبة', ...chainOf(id).map(folderName)].join(' / ');
      const dirIds = (fid) => {
        const d = dirOf(fid);
        return d
          ? [...d.folders.map((f) => f.id), ...d.files.map((f) => f.id)]
          : [];
      };
      const resultIds = () =>
        S.res
          ? [...S.res.folders.map((f) => f.id), ...S.res.files.map((f) => f.id)]
          : [];

      function ingest(r) {
        r.breadcrumbs.forEach((c, i) =>
          S.fold.set(c.id, {
            id: c.id,
            name: c.name,
            parentId: i ? r.breadcrumbs[i - 1].id : null,
          })
        );
        r.folders.forEach((f) => {
          S.fold.set(f.id, { id: f.id, name: f.name, parentId: f.parentId });
          S.items.set(f.id, f);
          if (f.breadcrumbs)
            f.breadcrumbs.forEach((c, i) =>
              S.fold.set(c.id, {
                id: c.id,
                name: c.name,
                parentId: i ? f.breadcrumbs[i - 1].id : null,
              })
            );
        });
        r.files.forEach((f) => S.items.set(f.id, f));
      }

      /* ---------- directory loading (one level per request) ---------- */
      async function loadDir(folderId, o = {}) {
        const k = dkey(folderId);
        let d = S.dirs.get(k);
        if (!d) {
          d = {
            status: 'idle',
            folders: [],
            files: [],
            meta: null,
            breadcrumbs: [],
            perPage: PER_PAGE,
            gen: 0,
            error: null,
            loadingMore: false,
          };
          S.dirs.set(k, d);
        }
        const silent = d.status === 'ok';
        if (o.more) {
          if (d.loadingMore || !d.meta || d.meta.page >= d.meta.pageCount)
            return;
          d.loadingMore = true;
          paintDir(folderId);
        } else if (!silent) {
          d.status = 'loading';
          d.error = null;
          paintDir(folderId);
        }
        const my = ++d.gen;
        try {
          const page = o.more ? d.meta.page + 1 : 1;
          const perPage = o.more
            ? d.perPage
            : silent
              ? Math.min(100, Math.max(PER_PAGE, d.files.length))
              : PER_PAGE;
          const r = await api.list({
            scope: 'folder',
            folderId,
            sort: [S.sort],
            filters: apiFilters(),
            page,
            perPage,
          });
          if (my !== d.gen) return;
          ingest(r);
          d.breadcrumbs = r.breadcrumbs;
          d.folders = r.folders;
          d.files = o.more
            ? d.files.concat(
                r.files.filter((f) => !d.files.some((x) => x.id === f.id))
              )
            : r.files;
          d.meta = r.meta;
          d.perPage = perPage;
          d.status = 'ok';
          d.error = null;
        } catch (e) {
          if (my !== d.gen) return;
          if (e.code === 'NOT_FOUND' && folderId != null) {
            S.dirs.delete(k);
            goneFolder(folderId);
            return;
          }
          d.error = e.message || 'تعذّر التحميل';
          if (o.more || d.status === 'ok') toast(d.error, 'error');
          else d.status = 'error';
        }
        d.loadingMore = false;
        paintDir(folderId);
        afterDirLoad(folderId);
      }

      let resGen = 0;
      async function loadResults(o = {}) {
        const my = ++resGen;
        if (o.more) {
          if (
            !S.res ||
            S.res.loadingMore ||
            S.res.meta.page >= S.res.meta.pageCount
          )
            return;
          S.res.loadingMore = true;
          paintResults();
        } else if (!o.keep || !S.res) {
          S.res = {
            status: 'loading',
            folders: [],
            files: [],
            meta: null,
            error: null,
            perPage: PER_PAGE,
            loadingMore: false,
          };
          paintResults();
        }
        const res = S.res;
        try {
          const page = o.more ? res.meta.page + 1 : 1;
          const perPage = o.more
            ? res.perPage
            : o.keep
              ? Math.min(100, Math.max(PER_PAGE, res.files.length))
              : PER_PAGE;
          const scoped = S.qFolder != null;
          const r = await api.list(
            scoped
              ? {
                  scope: 'folder',
                  folderId: S.qFolder,
                  search: S.q,
                  sort: [S.sort],
                  filters: apiFilters(),
                  page,
                  perPage,
                }
              : {
                  scope: 'all',
                  search: S.q,
                  sort: [S.sort],
                  filters: apiFilters(),
                  page,
                  perPage,
                }
          );
          if (my !== resGen) return;
          ingest(r);
          // folder scope: the server filters direct files only and returns subfolders unfiltered
          if (scoped) {
            const t = S.q.toLowerCase();
            r.folders = r.folders.filter((f) =>
              f.name.toLowerCase().includes(t)
            );
          }
          res.folders = r.folders;
          res.files = o.more
            ? res.files.concat(
                r.files.filter((f) => !res.files.some((x) => x.id === f.id))
              )
            : r.files;
          res.meta = r.meta;
          res.perPage = perPage;
          res.status = 'ok';
          res.error = null;
        } catch (e) {
          if (my !== resGen) return;
          res.error = e.message || 'تعذّر التحميل';
          if (o.more || res.status === 'ok') toast(res.error, 'error');
          else res.status = 'error';
        }
        res.loadingMore = false;
        paintResults();
        updateStatus();
      }

      function paintDir(id) {
        if (resultsMode()) return;
        const k = dkey(id);
        if (S.view === 'columns')
          S.path.forEach((p, i) => {
            if (dkey(p) === k) renderColumn(i);
          });
        else if (S.view === 'grid') {
          if (dkey(loc()) === k) renderGrid();
        } else if (dkey(loc()) === k || S.expanded.has(id)) renderList();
      }
      function paintResults() {
        if (!resultsMode()) return;
        if (S.view === 'grid') renderGrid();
        else renderList();
      }
      function afterDirLoad(folderId) {
        if (
          S.pendingFocus != null &&
          dkey(S.path[S.pendingFocus]) === dkey(folderId)
        ) {
          const i = S.pendingFocus;
          S.pendingFocus = null;
          const ids = dirIds(S.path[i]);
          if (ids.length) selectOnly(ids[0], i);
        }
        if (
          S.reveal &&
          dkey(loc()) === dkey(folderId) &&
          dirIds(folderId).includes(S.reveal)
        ) {
          const id = S.reveal;
          S.reveal = null;
          selectOnly(id, lastCol());
        }
        updateStatus();
        if (S.editing && S.editing.kind === 'new') focusEditor();
      }

      function goneFolder(id) {
        S.expanded.delete(id);
        const idx = S.path.indexOf(id);
        if (idx > 0) {
          S.path = S.path.slice(0, idx);
          S.sel.clear();
          S.cursor = { id: null, col: S.path.length - 1 };
          renderView();
          afterNav();
          afterSelUi();
        } else paintDir(id);
      }
      function truncatePathAt(ids) {
        const idx = S.path.findIndex((p, i) => i > 0 && ids.includes(p));
        if (idx > 0) {
          S.path = S.path.slice(0, idx);
          if (typeof S.cursor.col === 'number')
            S.cursor = {
              id: null,
              col: Math.min(S.cursor.col, S.path.length - 1),
            };
        }
        ids.forEach((id) => S.expanded.delete(id));
      }

      function reloadAll() {
        S.dirs.forEach((d, k) => loadDir(fromKey(k)));
        if (resultsMode()) loadResults({ keep: true });
      }
      async function refreshAll() {
        S.fstats.clear();
        const need = new Set(S.path.map(dkey));
        S.expanded.forEach((id) => need.add(id));
        for (const k of [...S.dirs.keys()]) if (!need.has(k)) S.dirs.delete(k);
        const jobs = [...S.dirs.keys()].map((k) => loadDir(fromKey(k)));
        if (resultsMode()) jobs.push(loadResults({ keep: true }));
        await Promise.all(jobs);
        pruneSel();
        renderView();
        afterNav();
        afterSelUi();
      }
      function pruneSel() {
        const valid = new Set();
        S.dirs.forEach((d) => {
          d.folders.forEach((f) => valid.add(f.id));
          d.files.forEach((f) => valid.add(f.id));
        });
        if (S.res) {
          S.res.folders.forEach((f) => valid.add(f.id));
          S.res.files.forEach((f) => valid.add(f.id));
        }
        [...S.sel].forEach((id) => {
          if (!valid.has(id)) S.sel.delete(id);
        });
        if (S.cursor.id && !valid.has(S.cursor.id))
          S.cursor = { id: null, col: S.cursor.col };
        if (S.anchor && !valid.has(S.anchor)) S.anchor = null;
      }

      /* ---------- navigation ---------- */
      function pushHist(p) {
        const cur = S.hist[S.hi];
        if (cur && cur.join('|') === p.join('|')) return;
        S.hist = S.hist.slice(0, S.hi + 1);
        S.hist.push(p.slice());
        if (S.hist.length > 60) S.hist.shift();
        S.hi = S.hist.length - 1;
      }
      function setPath(np, o = {}) {
        const old = S.path;
        let common = 0;
        while (
          common < old.length &&
          common < np.length &&
          old[common] === np[common]
        )
          common++;
        const changed = !(common === old.length && common === np.length);
        S.path = np;
        if (changed && !o.noHist) pushHist(np);
        for (let i = common; i < np.length; i++) loadDir(np[i]);
        renderView();
        afterNav();
      }
      function afterNav() {
        renderPathbar();
        updateNavBtns();
        updateStatus();
        updateBulk();
      }
      function goTo(id, o = {}) {
        exitResults(true);
        const chain = chainOf(id);
        S.sel.clear();
        S.anchor = null;
        S.pendingFocus = null;
        S.cursor = { id: null, col: chain.length };
        if (S.view === 'columns' && id != null) {
          S.sel.add(id);
          S.cursor = { id, col: chain.length - 1 };
          S.anchor = id;
        }
        setPath([null, ...chain], o);
        afterSelUi();
      }
      function histGo(d) {
        const i = S.hi + d;
        if (i < 0 || i >= S.hist.length) return;
        S.hi = i;
        exitResults(true);
        S.sel.clear();
        S.cursor = { id: null, col: S.hist[i].length - 1 };
        setPath(S.hist[i].slice(), { noHist: true });
        afterSelUi();
      }
      function goUp() {
        if (resultsMode()) {
          exitResults();
          return;
        }
        const p = S.path;
        if (p.length < 2) return;
        const target = p[p.length - 2];
        S.sel.clear();
        S.anchor = null;
        S.cursor = { id: null, col: p.length - 2 };
        if (S.view === 'columns' && p.length > 2) {
          S.sel.add(p[p.length - 2]);
          S.cursor = { id: p[p.length - 2], col: p.length - 3 };
          S.anchor = p[p.length - 2];
        }
        setPath(p.slice(0, -1));
        afterSelUi();
        return target;
      }
      function exitResults(silent) {
        if (!resultsMode()) return;
        S.q = '';
        S.qFolder = null;
        S.all = false;
        S.res = null;
        resGen++;
        $('#q').value = '';
        $('#qhint').hidden = true;
        S.sel.clear();
        S.cursor = { id: null, col: viewCol() };
        if (!silent) {
          renderView();
          afterNav();
          afterSelUi();
        }
      }
      function viewCol() {
        if (resultsMode()) return 'R';
        if (S.view === 'columns')
          return typeof S.cursor.col === 'number'
            ? Math.min(S.cursor.col, S.path.length - 1)
            : S.path.length - 1;
        return S.view === 'grid' ? 'G' : 'L';
      }
      const lastCol = () =>
        resultsMode()
          ? 'R'
          : S.view === 'columns'
            ? S.path.length - 1
            : S.view === 'grid'
              ? 'G'
              : 'L';
      function viewMode() {
        return resultsMode()
          ? S.view === 'grid'
            ? 'grid'
            : 'list'
          : S.view === 'columns'
            ? 'strip'
            : S.view;
      }

      function renderView() {
        const mode = viewMode();
        $('#main').dataset.show = mode;
        [
          ['strip', '#strip'],
          ['grid', '#grid'],
          ['list', '#list'],
        ].forEach(([m, sel]) => {
          if (m !== mode) $(sel).innerHTML = '';
        });
        if (resultsMode()) {
          if (S.view === 'grid') renderGrid();
          else renderList();
        } else if (S.view === 'columns') reconcileStrip();
        else if (S.view === 'grid') renderGrid();
        else renderList();
        updateInspector();
      }

      /* ---------- selection ---------- */
      function listRows() {
        const out = [];
        const walk = (fid, depth) => {
          const d = dirOf(fid);
          if (!d || d.status === 'loading' || d.status === 'idle') {
            out.push({ sk: true, depth });
            return;
          }
          if (d.status === 'error') {
            out.push({ err: d.error, depth, fid });
            return;
          }
          d.folders.forEach((f) => {
            out.push({ id: f.id, depth, it: f });
            if (S.expanded.has(f.id)) walk(f.id, depth + 1);
          });
          d.files.forEach((f) => out.push({ id: f.id, depth, it: f }));
          if (d.meta && d.meta.page < d.meta.pageCount)
            out.push({ more: true, fid, depth });
        };
        walk(loc(), 0);
        return out;
      }
      function itemsOf(col) {
        if (col === 'R') return resultIds();
        if (col === 'G') return dirIds(loc());
        if (col === 'L')
          return listRows()
            .filter((r) => r.id)
            .map((r) => r.id);
        return dirIds(S.path[col]);
      }
      function setSel(ids, cursorId, col, anchor) {
        S.sel = new Set(ids);
        S.cursor = { id: cursorId, col };
        if (anchor !== undefined) S.anchor = anchor;
        S.pendingFocus = null;
        afterSel();
      }
      function selectOnly(id, col) {
        setSel([id], id, col, id);
        scrollToItem(id);
      }
      function clearSel(col) {
        S.sel.clear();
        S.anchor = null;
        S.cursor = { id: null, col: col !== undefined ? col : S.cursor.col };
        afterSel();
      }
      function afterSel() {
        paintSel();
        if (S.view === 'columns' && !resultsMode()) syncPathToSel();
        afterSelUi();
      }
      function afterSelUi() {
        paintSel();
        updateInspector();
        updateStatus();
        updateBulk();
      }
      function syncPathToSel() {
        const c = S.cursor;
        if (typeof c.col !== 'number') return;
        const col = Math.min(c.col, S.path.length - 1);
        const np = S.path.slice(0, col + 1);
        if (S.sel.size === 1 && c.id && isFolderId(c.id) && S.sel.has(c.id))
          np.push(c.id);
        const same =
          np.length === S.path.length && np.every((v, i) => v === S.path[i]);
        if (!same) setPath(np);
      }
      function scrollToItem(id) {
        const el = $(`#main [data-id="${id}"]`);
        if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
      function selInfo() {
        const ids = [...S.sel];
        const folders = ids.filter(isFolderId),
          files = ids.filter((i) => !isFolderId(i));
        return {
          ids,
          folders,
          files,
          n: ids.length,
          one: ids.length === 1 ? S.items.get(ids[0]) : null,
        };
      }

      function itemClick(id, col, e) {
        const ctrl = e.ctrlKey || e.metaKey,
          shift = e.shiftKey;
        const sameCol = S.cursor.col === col;
        if (shift && S.anchor && sameCol) {
          const list = itemsOf(col);
          const a = list.indexOf(S.anchor),
            b = list.indexOf(id);
          if (a >= 0 && b >= 0) {
            const range = list.slice(Math.min(a, b), Math.max(a, b) + 1);
            setSel(ctrl ? [...S.sel, ...range] : range, id, col);
            return;
          }
        }
        if (ctrl && (sameCol || !S.sel.size)) {
          const next = new Set(S.sel);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          setSel(next, id, col, id);
          return;
        }
        setSel([id], id, col, id);
      }

      function paintSel() {
        const main = $('#main');
        main.classList.toggle('selmode', S.sel.size > 0);
        main.classList.toggle('multi', S.sel.size > 1);
        const colEls = S.view === 'columns' && !resultsMode();
        $$('#main [data-id]').forEach((el) => {
          const id = el.dataset.id,
            on = S.sel.has(id);
          el.classList.toggle('sel', on);
          el.classList.toggle('cur', S.cursor.id === id);
          el.classList.toggle('cut', isCut(id));
          el.setAttribute('aria-selected', on ? 'true' : 'false');
          if (colEls && el.classList.contains('row') && isFolderId(id)) {
            const ci = +el.closest('.col').dataset.col;
            el.classList.toggle('open', !on && S.path[ci + 1] === id);
          }
        });
        if (colEls)
          $$('#strip > .col').forEach((c) =>
            c.classList.toggle('active', c.dataset.col === String(S.cursor.col))
          );
      }

      /* ---------- keyboard navigation inside the active container ---------- */
      function gridPerRow() {
        const cells = $$('#grid .gcells')[0];
        if (!cells) return 1;
        const kids = Array.from(cells.children).filter((c) => c.dataset.id);
        if (!kids.length) return 1;
        const top = kids[0].offsetTop;
        let n = 0;
        for (const k of kids) {
          if (k.offsetTop !== top) break;
          n++;
        }
        return Math.max(1, n);
      }
      function moveCursor(delta, shift) {
        const col = viewCol();
        const list = itemsOf(col);
        if (!list.length) return;
        const cur = S.cursor.col === col ? list.indexOf(S.cursor.id) : -1;
        let next =
          cur < 0
            ? delta > 0
              ? 0
              : list.length - 1
            : clamp(cur + delta, 0, list.length - 1);
        const id = list[next];
        if (shift) {
          const anchorId =
            S.anchor && list.includes(S.anchor)
              ? S.anchor
              : list[cur < 0 ? 0 : cur];
          const a = list.indexOf(anchorId);
          setSel(
            list.slice(Math.min(a, next), Math.max(a, next) + 1),
            id,
            col,
            anchorId
          );
          scrollToItem(id);
        } else selectOnly(id, col);
      }
      function keyDirection(key) {
        // RTL: ArrowLeft goes "in" (deeper / next), ArrowRight goes "out"
        const v = viewMode();
        if (v === 'strip') {
          if (key === 'ArrowDown') moveCursor(1, false);
          else if (key === 'ArrowUp') moveCursor(-1, false);
          else if (key === 'ArrowLeft') moveInto();
          else if (key === 'ArrowRight') moveOut();
          return;
        }
        if (v === 'grid') {
          const per = gridPerRow();
          if (key === 'ArrowDown') moveCursor(per, false);
          else if (key === 'ArrowUp') moveCursor(-per, false);
          else if (key === 'ArrowLeft') moveCursor(1, false);
          else if (key === 'ArrowRight') moveCursor(-1, false);
          return;
        }
        if (key === 'ArrowDown') moveCursor(1, false);
        else if (key === 'ArrowUp') moveCursor(-1, false);
        else if (key === 'ArrowLeft') listExpand(true);
        else if (key === 'ArrowRight') listExpand(false);
      }
      function moveInto() {
        const c = S.cursor;
        if (typeof c.col !== 'number') return;
        if (!c.id || !S.sel.has(c.id) || !isFolderId(c.id)) {
          if (!c.id && S.path.length > c.col + 1) focusCol(c.col + 1);
          return;
        }
        focusCol(c.col + 1);
      }
      function focusCol(i) {
        if (i >= S.path.length) return;
        const ids = dirIds(S.path[i]);
        if (ids.length) selectOnly(ids[0], i);
        else {
          const d = dirOf(S.path[i]);
          S.pendingFocus = d && d.status === 'ok' ? null : i;
        }
      }
      function moveOut() {
        const c = S.cursor;
        if (typeof c.col !== 'number' || c.col < 1) return;
        const parent = S.path[c.col];
        S.pendingFocus = null;
        setSel([parent], parent, c.col - 1, parent);
        scrollToItem(parent);
      }
      function listExpand(open) {
        const id = S.cursor.id;
        const col = 'L';
        if (!id) {
          moveCursor(1, false);
          return;
        }
        if (isFolderId(id)) {
          if (open) {
            if (!S.expanded.has(id)) toggleExpand(id, true);
            else {
              const rows = itemsOf(col);
              const i = rows.indexOf(id);
              if (rows[i + 1]) selectOnly(rows[i + 1], col);
            }
          } else if (S.expanded.has(id)) toggleExpand(id, false);
          else parentRow(id);
        } else if (!open) parentRow(id);
      }
      function parentRow(id) {
        const it = S.items.get(id);
        const pid = it ? (isFolderId(id) ? it.parentId : it.folderId) : null;
        if (pid != null && pid !== loc()) selectOnly(pid, 'L');
      }
      function toggleExpand(id, force) {
        const on = force !== undefined ? force : !S.expanded.has(id);
        if (on) {
          S.expanded.add(id);
          loadDir(id);
        } else {
          S.expanded.delete(id);
          // keep selection valid: collapse hides descendants
          const hidden = new Set(itemsOfHidden(id));
          [...S.sel].forEach((x) => {
            if (hidden.has(x)) S.sel.delete(x);
          });
        }
        renderList();
        afterSelUi();
      }
      function itemsOfHidden(fid) {
        const out = [];
        const walk = (id) => {
          const d = dirOf(id);
          if (!d) return;
          d.folders.forEach((f) => {
            out.push(f.id);
            walk(f.id);
          });
          d.files.forEach((f) => out.push(f.id));
        };
        walk(fid);
        return out;
      }
      function typeAhead(ch) {
        const now = Date.now();
        S.typeBuf = (now - S.typeAt > 800 ? '' : S.typeBuf) + ch.toLowerCase();
        S.typeAt = now;
        const col = viewCol();
        const list = itemsOf(col);
        const hit = list.find((id) => {
          const it = S.items.get(id);
          return it && nameOf(it).toLowerCase().startsWith(S.typeBuf);
        });
        if (hit) selectOnly(hit, col);
      }

      const skLrows = (n) =>

        ).join('');

      /* ---------- icons / thumbnails ---------- */
      const folderIc = `<span class="fi">${ic('folder')}</span>`;
      function thumbHtml(f) {
        if (f.kind === 'image') return rasterThumb(f);

      }
      function bigPreview(f) {
        if (f.kind === 'image')
          return `<div class="bigthumb" style="--h:${hue(f.id)}"><img src="${esc(f.url)}" alt="" draggable="false"></div>`;
        const k = tkey(f);
        return `<div class="bigdoc d-${k}">${ic('file-text')}<b>${k.toUpperCase()}</b></div>`;
      }
      const chkHtml = `<span class="chk" data-chk role="checkbox" aria-label="تحديد">${ic('check')}</span>`;
      const pubDot = (f) =>

          : '';
      const menuBtn = `<button class="more" data-menu tabindex="-1" aria-label="المزيد">${ic('ellipsis-vertical')}</button>`;

      /* ---------- inline editor (rename / new folder) ---------- */
      function stashEditor() {
        const el = $('#main .ed');
        if (el && S.editing) S.editing.value = el.value;
      }
      const edValue = (def) =>
        S.editing && S.editing.value != null ? S.editing.value : def;
      function focusEditor() {
        const el = $('#main .ed');
        if (!el || document.activeElement === el || !S.editing) return;
        el.focus();
        if (S.editing.value != null)
          el.setSelectionRange(el.value.length, el.value.length);
        else {
          const v = el.value,
            dot =
              S.editing.kind === 'rename' && !isFolderId(S.editing.id)
                ? v.lastIndexOf('.')
                : -1;
          el.setSelectionRange(0, dot > 0 ? dot : v.length);
        }

      }
      const edInput = (def, max, label) =>
        `<input class="ed" data-ed value="${esc(edValue(def))}" maxlength="${max}" spellcheck="false" autocomplete="off" aria-label="${label}">`;
      const isRenaming = (id) =>
        S.editing && S.editing.kind === 'rename' && S.editing.id === id;
      const isNewIn = (fid) =>
        S.editing && S.editing.kind === 'new' && S.editing.parent === fid;

      /* ---------- Miller columns ---------- */
      function wantInspCol() {
        return (
          S.view === 'columns' &&
          !resultsMode() &&
          S.showInsp &&
          (S.sel.size > 1 || [...S.sel].some((id) => !isFolderId(id)))
        );
      }
      function reconcileStrip() {
        const strip = $('#strip');
        let grew = false;
        const cols = Array.from(strip.children).filter((c) =>
          c.classList.contains('col')
        );
        S.path.forEach((p, i) => {
          let el = cols[i];
          if (!el || el.dataset.k !== dkey(p)) {
            const ne = document.createElement('section');
            ne.className = 'col';
            ne.dataset.col = i;
            ne.dataset.k = dkey(p);
            ne.dataset.dz = dkey(p);
            ne.style.setProperty('--w', (S.colW[i] || 248) + 'px');
            if (el) el.replaceWith(ne);
            else strip.insertBefore(ne, $('#insp'));
            cols[i] = ne;
            renderColumn(i);
            grew = true;
          }
        });
        cols.slice(S.path.length).forEach((c) => c.remove());
        let insp = $('#insp');
        if (wantInspCol()) {
          if (!insp) {
            insp = document.createElement('aside');
            insp.id = 'insp';
            insp.className = 'insp';
            insp.innerHTML =
              '<div class="ihost"></div><span class="rz" data-rzi aria-hidden="true"></span>';
            insp.style.setProperty('--w', (S.colW.insp || 340) + 'px');
            strip.appendChild(insp);
            grew = true;
          }
        } else if (insp) insp.remove();
        if (grew) {
          const last = $('#insp') || strip.lastElementChild;
          requestAnimationFrame(
            () =>
              last &&
              last.scrollIntoView({
                inline: 'nearest',

                behavior: reducedMotion() ? 'auto' : 'smooth',

      function renderColumn(i) {

          d = dirOf(fidv);

          top = list ? list.scrollTop : 0;

        const total =
          d && d.status === 'ok' ? d.folders.length + d.meta.total : null;
        let body;
        if (!d || d.status === 'idle' || d.status === 'loading')
          body = skRows(7);
        else if (d.status === 'error')
          body = errorHtml(d.error, `data-retry="${dkey(fidv)}"`);
        else {
          const ne = isNewIn(fidv);
          body = ne ? newRowHtml() : '';
          body +=
            d.folders.map((f) => rowHtml(f, i)).join('') +
            d.files.map((f) => rowHtml(f, i)).join('');
          if (!d.folders.length && !d.files.length && !ne)
            body = emptyHtml(

          `<div class="chead"><span class="cname">${ic(i === 0 ? 'house' : 'folder-open')}<b>${esc(name)}</b></span><span class="ccount">${total != null ? cnt(total, 'item') : ''}</span></div>` +

      /* ---------- grid ---------- */

      function newTileHtml() {
        return `<div class="tile fol editing"><div class="tpv"><span class="bigfi">${ic('folder')}</span></div><div class="tfoot">${edInput('مجلد جديد', 100, 'اسم المجلد الجديد')}</div></div>`;

        if (d.files.length)

            sectionHead('الملفات', d.meta.total) +

      }
      function resultsBanner() {
        const r = S.res;
        const n =
          r && r.status === 'ok' ? r.folders.length + r.meta.total : null;
        const title = S.q
          ? S.qFolder != null

        const fc = filterCount();
        return (
          `<div class="rbanner">${ic(S.q ? 'search' : 'file-image')}<b>${title}</b><span class="rcount">${n != null ? cnt(n, 'item') : '…'}</span>` +

            ? `<button class="linkbtn" data-act="clearfilters">${ic('list-filter')}إزالة التصفية (${fc})</button>`

          `</div>`

      function resultsBody(kind) {
        const r = S.res;
        if (!r || r.status === 'loading')
          return kind === 'grid'
            ? `<div class="gcells">${skTiles(10)}</div>`
            : skLrows(8);
        if (r.status === 'error') return errorHtml(r.error, 'data-retry="res"');

          return emptyHtml(
            S.q ? 'search' : filterCount() ? 'filter' : 'allempty',

              ? 'لا توجد ملفات تطابق البحث مع عوامل التصفية الحالية.'

                : null
          );

          r.meta && r.meta.page < r.meta.pageCount
            ? `<div class="moreRow" data-sent="res">${r.loadingMore ? `<span class="spin">${ic('loader')}</span> جارٍ التحميل…` : `<button class="linkbtn" data-loadmore="res">تحميل المزيد (${r.meta.total - r.files.length})</button>`}</div>`
            : '';
        if (kind === 'grid') {
          if (r.folders.length)
            h +=
              sectionHead('مجلدات مطابقة', r.folders.length) +
              `<div class="gcells">${r.folders.map((f) => tileHtml(f, 'R', { path: true })).join('')}</div>`;
          if (r.files.length)
            h +=
              sectionHead('ملفات', r.meta.total) +
              `<div class="gcells">${r.files.map((f) => tileHtml(f, 'R', { path: true })).join('')}</div>`;
        } else {
          if (r.folders.length)
            h +=
              `<div class="lsec">مجلدات مطابقة<span class="gcount">${r.folders.length}</span></div>` +
              r.folders
                .map((f) =>
                  lrowHtml({ id: f.id, depth: 0, it: f }, { path: true })
                )
                .join('');
          if (r.files.length)
            h +=
              `<div class="lsec">ملفات<span class="gcount">${r.meta.total}</span></div>` +
              r.files
                .map((f) =>
                  lrowHtml({ id: f.id, depth: 0, it: f }, { path: true })

                .join('');

        return h + more;
      }
      function renderGrid() {
        const host = $('#grid');
        stashEditor();
        const top = host.scrollTop,
          res = resultsMode();
        host.style.setProperty('--t', S.tile + 'px');
        host.innerHTML =
          (res ? resultsBanner() : '') +
          `<div class="gwrap" data-col="${res ? 'R' : 'G'}" data-dz="${res ? '' : dkey(loc())}">${res ? resultsBody('grid') : dirGridHtml()}</div>`;
        host.scrollTop = top;
        afterRender(host);
      }

      /* ---------- list (Finder list view with disclosure triangles) ---------- */
      const LCOLS = [
        ['name', 'الاسم', 'lname'],
        ['createdAt', 'أُضيف', 'lcre'],
        ['updatedAt', 'عُدّل', 'lmod'],
        ['size', 'الحجم', 'lsz'],
        ['type', 'النوع', 'lkind'],
      ];
      function listHead() {
        return `<div class="lhead" role="row">${LCOLS.map(([id, label, c]) => `<button class="lc ${c}${S.sort.id === id ? ' on' : ''}" data-sort="${id}">${label}${S.sort.id === id ? ic(S.sort.desc ? 'arrow-down' : 'arrow-up') : ''}</button>`).join('')}<span class="lc lvis">الرؤية</span><span class="lc lact"></span></div>`;
      }
      function lrowHtml(r, o = {}) {
        const it = r.it,
          id = r.id,
          isD = isFolderId(id),
          on = S.sel.has(id);
        const cls =
          'lrow' +
          (isD ? ' fol' : '') +
          (on ? ' sel' : '') +
          (isCut(id) ? ' cut' : '') +
          (S.cursor.id === id ? ' cur' : '');
        const nm = isRenaming(id)
          ? edInput(nameOf(it), isD ? 100 : 150, 'الاسم الجديد')
          : `<span class="nm" title="${esc(nameOf(it))}">${esc(nameOf(it))}</span>`;
        const path = o.path
          ? `<span class="npath">${esc(isD ? pathText(it.parentId) : pathText(it.folderId))}</span>`
          : '';
        const disc = o.path
          ? ''
          : isD
            ? `<button class="disc${S.expanded.has(id) ? ' open' : ''}" data-disc tabindex="-1" aria-label="${S.expanded.has(id) ? 'طيّ' : 'توسيع'}">${ic('chevron-left')}</button>`
            : '<span class="disc sp"></span>';
        return (
          `<div class="${cls}" role="option" aria-selected="${on}" data-id="${id}" ${isD ? `data-dz="${id}"` : ''} draggable="${!isRenaming(id)}" style="--d:${r.depth}">` +
          `<span class="lc lname"><span class="indent"></span>${disc}<span class="ico"><span class="icm">${isD ? folderIc : thumbHtml(it)}</span>${chkHtml}</span>${nm}${path}${isD ? '' : usedTag(it)}</span>` +
          `<span class="lc lcre">${isD ? fmtDate(it.createdAt) : fmtDate(it.createdAt)}</span><span class="lc lmod">${fmtDate(it.updatedAt)}</span>` +
          `<span class="lc lsz">${isD ? `${countTag(it)}<span class="futoff">—</span>` : ltr(fmtSize(it.sizeBytes))}</span><span class="lc lkind">${isD ? 'مجلد' : typeLabel(it)}</span>` +
          `<span class="lc lvis">${isD ? '' : it.bucketType === 'public' ? `<span class="vis pub">${ic('globe')}عام</span>` : `<span class="vis priv">${ic('lock')}خاص</span>`}</span><span class="lc lact">${menuBtn}</span></div>`
        );

      function dirListHtml() {
        const rows = listRows();

          ? `<div class="lrow fol editing" style="--d:0"><span class="lc lname"><span class="indent"></span><span class="disc sp"></span><span class="ico"><span class="icm">${folderIc}</span></span>${edInput('مجلد جديد', 100, 'اسم المجلد الجديد')}</span></div>`
          : '';
        const d = dirOf(fidv);
        if (
          d &&
          d.status === 'ok' &&
          !d.folders.length &&
          !d.files.length &&
          !ne
        )
          return emptyHtml(
            fidv == null ? 'root' : filterCount() ? 'filter' : 'folder'
          );
        rows.forEach((r) => {
          if (r.sk)
            h += `<div class="lrow sk" style="--d:${r.depth}"><span class="lc lname"><span class="indent"></span><span class="disc sp"></span><span class="skb sq"></span><span class="skb" style="width:40%"></span></span></div>`;
          else if (r.err)
            h += `<div class="lrow errrow" style="--d:${r.depth}"><span class="lc lname"><span class="indent"></span>${ic('triangle-alert')}<span class="nm">${esc(r.err)}</span><button class="linkbtn" data-retry="${dkey(r.fid)}">إعادة المحاولة</button></span></div>`;
          else if (r.more) {
            const dd = dirOf(r.fid);
            h += `<div class="lrow moreRow" data-sent="${dkey(r.fid)}" style="--d:${r.depth}"><span class="lc lname"><span class="indent"></span>${dd.loadingMore ? `<span class="spin">${ic('loader')}</span> جارٍ التحميل…` : `<button class="linkbtn" data-loadmore="${dkey(r.fid)}">تحميل المزيد</button>`}</span></div>`;
          } else h += lrowHtml(r);

        return h;
      }
      function renderList() {
        const host = $('#list');
        stashEditor();
        const top = host.scrollTop,
          res = resultsMode();
        host.innerHTML =
          (res ? resultsBanner() : '') +
          listHead() +
          `<div class="lbody" data-col="${res ? 'R' : 'L'}" data-dz="${res ? '' : dkey(loc())}" role="listbox" aria-multiselectable="true">${res ? resultsBody('list') : dirListHtml()}</div>`;
        host.scrollTop = top;
        afterRender(host);
      }

      /* ---------- infinite scroll + post-render ---------- */
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((en) => {
            if (!en.isIntersecting) return;
            io.unobserve(en.target);
            const k = en.target.dataset.sent;
            if (k === 'res') loadResults({ more: true });
            else loadDir(fromKey(k), { more: true });
          });
        },
        { rootMargin: '240px' }
      );
      function afterRender(root) {
        $$('[data-sent]', root).forEach((el) => io.observe(el));
        paintBlurs(root);
        paintSelFast(root);
        focusEditor();
      }
      function paintSelFast(root) {
        const main = $('#main');
        main.classList.toggle('selmode', S.sel.size > 0);
        main.classList.toggle('multi', S.sel.size > 1);
        if (S.view === 'columns' && !resultsMode())
          $$('#strip > .col').forEach((c) =>
            c.classList.toggle('active', c.dataset.col === String(S.cursor.col))
          );
      }

      /* ---------- toolbar pieces ---------- */
      function renderPathbar() {
        const bar = $('#pathbar');
        if (resultsMode()) {
          bar.innerHTML = `<span class="pseg res">${ic(S.q ? 'search' : 'file-image')}<b>${S.q ? 'نتائج البحث' + (S.qFolder != null ? ' · ' + esc(folderName(S.qFolder)) : '') : 'كل الملفات'}</b></span><button class="pseg link" data-act="${S.q ? 'clearsearch' : 'viewfolders'}">${S.q ? 'مسح البحث' : 'العودة إلى المجلدات'}</button>`;
          return;
        }
        bar.innerHTML = S.path
          .map((p, i) => {
            const last = i === S.path.length - 1;
            return (
              `<span class="pseg${last ? ' last' : ''}" data-dz="${dkey(p)}" data-pseg="${i}">` +
              `<button class="pname" data-pgo="${i}">${i === 0 ? ic('house') : ''}<span>${esc(i === 0 ? 'المكتبة' : folderName(p))}</span></button>` +
              `<button class="pdd" data-ppop="${i}" aria-label="المجلدات المجاورة" title="المجلدات المجاورة">${ic('chevron-down')}</button></span>` +
              (last ? '' : `<span class="psep">${ic('chevron-left')}</span>`)
            );
          })
          .join('');
        const last = bar.lastElementChild;
        if (last)
          requestAnimationFrame(() =>
            last.scrollIntoView({ inline: 'nearest', block: 'nearest' })
          );
      }
      function updateNavBtns() {
        $('#btnBack').disabled = S.hi <= 0;
        $('#btnFwd').disabled = S.hi >= S.hist.length - 1;
        $('#btnUp').disabled = !resultsMode() && S.path.length < 2;
      }
      function filterCount() {
        const f = S.filters;
        return (
          ['kind', 'bucketType', 'type', 'days'].filter((k) => f[k]).length +
          (f.minSize != null || f.maxSize != null ? 1 : 0)
        );
      }
      function renderFilterBadge() {
        const n = filterCount(),
          b = $('#fbadge');
        b.hidden = n === 0;
        b.textContent = n;
        $('#btnFilter').classList.toggle('on', n > 0);
      }
      function updateBulk() {
        const si = selInfo(),
          el = $('#bulk'),
          tray = $('#tray'),
          c = S.clip;
        // columns view: a single selected folder is just navigation, so the move tray stays up while browsing
        const nav =
          !!c &&
          S.view === 'columns' &&
          !resultsMode() &&
          si.n === 1 &&
          si.folders.length === 1;
        const n = nav ? 0 : si.n;
        const showTray = !!c && n === 0;
        tray.hidden = !showTray;
        el.hidden = n === 0;
        $('#lead').hidden = n > 0 || !!c;
        if (showTray) tray.innerHTML = trayHtml();
        if (!n) return;
        el.innerHTML =
          (c ? pasteChipHtml() : '') +
          `<button class="ib sm" data-act="clear" title="إلغاء التحديد (Esc)">${ic('x')}</button><span class="bcount">${cnt(si.n, 'item')} محدد</span>` +
          `<span class="sep"></span><button class="btn sm" data-act="cut" title="قص للنقل (${MOD}X)">${ic('scissors')}<span class="lbl">نقل</span></button>` +
          (si.folders.length
            ? ''
            : `<button class="btn sm" data-act="download">${ic('download')}<span class="lbl">تنزيل</span></button>`) +
          `<button class="btn sm danger" data-act="delete">${ic('bin')}<span class="lbl">حذف</span></button>` +
          (si.files.length > 1
            ? `<button class="btn sm futonly" data-act="bulkpublish">${ic('globe')}<span class="lbl">نشر الكل</span>${futBadge('bulkpub')}</button>`
            : '');
      }
      function updateStatus() {
        let total = 0,
          where = '',
          d;
        if (resultsMode()) {
          total =
            S.res && S.res.status === 'ok'
              ? S.res.folders.length + S.res.meta.total
              : 0;
          where = S.q
            ? `بحث: «${esc(S.q)}»${S.qFolder != null ? ` في «${esc(folderName(S.qFolder))}»` : ''}`
            : 'كل الملفات';
        } else {
          const fid =
            S.view === 'columns' &&
            typeof S.cursor.col === 'number' &&
            S.cursor.col < S.path.length
              ? S.path[S.cursor.col]
              : loc();
          d = dirOf(fid);
          total = d && d.status === 'ok' ? d.folders.length + d.meta.total : 0;
          where = esc(pathText(fid));
        }
        let size = 0;
        S.sel.forEach((id) => {
          const it = S.items.get(id);
          if (it && it.sizeBytes) size += it.sizeBytes;
        });
        const fc = filterCount();
        $('#stCount').innerHTML =
          `${cnt(total, 'item')}، ${S.sel.size} محدد${S.sel.size ? ` (${ltr(fmtSize(size))})` : ''}${fc ? ` · <span class="stfilt">تصفية فعّالة (${fc})</span>` : ''}`;
        $('#stPath').innerHTML = `${ic('folder-open')}<span>${where}</span>`;
        $('#stBusy').hidden = S.busy <= 0;
      }

      /* ---------- inspector ---------- */
      let inspTok = 0;
      const detPending = new Map();
      const detFresh = (d, it) =>
        d.updatedAt === it.updatedAt &&
        d.displayName === it.displayName &&
        d.bucketType === it.bucketType &&
        d.folderId === it.folderId;
      function updateInspector() {
        let host;
        const inCols = S.view === 'columns' && !resultsMode();
        if (inCols) {
          if (wantInspCol() !== !!$('#insp')) reconcileStrip();
          host = $('#insp .ihost');
        } else host = $('#side');
        $('#side').hidden = inCols || !S.showInsp;
        $('#btnInsp').classList.toggle('on', S.showInsp);
        if (!host) return;
        renderInspector(host);
      }
      function crumbLinks(fid) {
        const chain = chainOf(fid);
        return (
          `<a data-goto="root">المكتبة</a>` +
          chain
            .map(
              (id) =>
                ` <span class="psep">${ic('chevron-left')}</span> <a data-goto="${id}">${esc(folderName(id))}</a>`
            )
            .join('')
        );
      }
      function renderInspector(host) {
        const si = selInfo(),
          tok = ++inspTok;
        if (si.n === 0) {
          host.innerHTML = inspFolderHtml(loc(), false);
          ensureFolderStats(loc(), host);
          return;
        }
        if (si.n > 1) {
          host.innerHTML = inspMultiHtml(si);
          return;
        }
        const it = si.one;
        if (!it) {
          host.innerHTML = '';
          return;
        }
        if (isFolderId(it.id)) {
          host.innerHTML = inspFolderHtml(it.id, true);
          ensureFolderStats(it.id, host);
          return;
        }
        const cached = S.det.get(it.id);
        if (cached && detFresh(cached, it)) {
          host.innerHTML = inspFileHtml(it, cached);
          return;
        }
        host.innerHTML = inspFileHtml(it, null);
        let p = detPending.get(it.id);
        if (!p) {
          p = api.details(it.id);
          detPending.set(it.id, p);
          p.then(
            () => detPending.delete(it.id),
            () => detPending.delete(it.id)
          );
        }
        p.then((d) => {
          S.det.set(it.id, d);
          if (
            tok !== inspTok ||
            !host.isConnected ||
            !S.sel.has(it.id) ||
            S.sel.size !== 1
          )
            return;
          host.innerHTML = inspFileHtml(S.items.get(it.id) || it, d);
        }).catch((e) => {
          if (tok !== inspTok || !host.isConnected) return;
          const u = $('.usedby', host);
          if (u)
            u.innerHTML = `<div class="inote err">${ic('triangle-alert')}${esc(e.message)}</div>`;
        });
      }
      const mrow = (k, v, mono) =>
        `<dt>${k}</dt><dd${mono ? ' class="mono"' : ''}>${v}</dd>`;
      function inspFileHtml(it, d) {
        const k = tkey(it);
        const pub = it.bucketType === 'public';
        let used;
        if (!d)
          used = `<div class="skb ln"></div><div class="skb ln" style="width:60%"></div>`;
        else if (!d.usedBy.length && !d.hiddenUsages)
          used = `<div class="inote">${ic('info')}غير مستخدم في أي سجل.</div>`;
        else
          used =
            `<ul class="usedlist">${d.usedBy.map((u) => `<li>${ic('link')}<span><span class="un futonly">${esc(u.name)}</span><span class="un futoff">${esc(RES_AR[u.resource] || u.resource)} #${esc(u.recordId)}</span></span><em>${esc(u.resource)}</em></li>`).join('')}</ul>` +
            (d.hiddenUsages
              ? `<div class="inote">+ ${d.hiddenUsages} استخدامات أخرى لا تملك صلاحية رؤيتها.</div>`
              : '') +
            `<div class="inote warn">${ic('lock')}لا يمكن حذف هذا الملف طالما هو مستخدم.</div>`;
        const dims = it.width ? ltr(`${it.width} × ${it.height} px`) : '—';
        return `<div class="ibody">
    <div class="ipv" data-act="preview" title="معاينة سريعة (Space)">${bigPreview(it)}<span class="ipvhint">${ic('maximize')}معاينة</span></div>
    <div class="ititle"><h3 title="${esc(it.displayName)}">${esc(it.displayName)}</h3><button class="ib sm" data-act="rename" title="إعادة تسمية (F2)">${ic('pencil')}</button></div>
    <div class="itags"><span class="tag t-${k}">${typeLabel(it)}</span><span class="vis ${pub ? 'pub' : 'priv'}">${ic(pub ? 'globe' : 'lock')}${pub ? 'عام' : 'خاص'}</span></div>
    <div class="iact">
      <button class="btn sm" data-act="download">${ic('download')}تنزيل</button>
      ${k === 'pdf' ? `<button class="btn sm" data-act="pdfpreview">${ic('eye')}معاينة${futBadge('pdfprev')}</button>` : ''}
      <button class="btn sm" data-act="copylink">${ic('link')}نسخ الرابط</button>
      <button class="btn sm" data-act="${pub ? 'unpublish' : 'publish'}">${ic(pub ? 'eye-off' : 'globe')}${pub ? 'إلغاء النشر' : 'نشر'}</button>
      <button class="ib sm" data-menu title="المزيد">${ic('ellipsis')}</button>
    </div>
    <div class="linkhint">${pub ? `${ic('globe')}رابط دائم متاح لأي شخص على الإنترنت.` : `${ic('clock')}الملف خاص: يتوفر رابط مؤقت لمدة ساعة فقط.`}</div>
    <dl class="meta">
      ${mrow('النوع', `${typeLabel(it)} <span class="muted mono" dir="ltr">${esc(it.mimeType.split('/').pop().split('.').pop())}</span>`)}
      ${mrow('الحجم', ltr(fmtSize(it.sizeBytes) + ' · ' + it.sizeBytes.toLocaleString('en') + ' B'), true)}
      ${mrow('الأبعاد', dims, true)}

      ${mrow('أُنشئ', fmtDateTime(it.createdAt))}
      ${mrow('عُدّل', fmtDateTime(it.updatedAt))}
      ${mrow('الرافع', `${esc(it.uploadedBy)} ${futBadge('uploader')}`)}
    </dl>
    <section class="isec"><h5>مستخدم في ${futBadge('usedbynames')}</h5><div class="usedby">${used}</div></section>
    <button class="btn danger wide" data-act="delete">${ic('bin')}حذف نهائي…</button>
  </div>`;
      }
      const fsizeHtml = (fid) =>
        S.fstats.has(fid)
          ? ltr(fmtSize(S.fstats.get(fid).sizeBytes))
          : `<span class="spin">${ic('loader')}</span>`;
      const fstatPending = new Map();
      // FUTURE (foldersize): recursive size, computed only when a folder's details are opened
      function ensureFolderStats(fid, host) {
        if (!S.future || fid == null || S.fstats.has(fid)) return;
        let p = fstatPending.get(fid);
        if (!p) {
          p = api.folderStats(fid);
          fstatPending.set(fid, p);
          p.then(
            () => fstatPending.delete(fid),
            () => fstatPending.delete(fid)
          );
        }
        const paint = (html) => {
          const el = $('[data-fsize="' + fid + '"]', host);
          if (el && host.isConnected) el.innerHTML = html;
        };
        p.then((st) => {
          S.fstats.set(fid, st);
          paint(ltr(fmtSize(st.sizeBytes)));
        }).catch(() => paint('—'));
      }
      function inspFolderHtml(fid, selected) {
        const it = fid == null ? null : S.items.get(fid) || S.fold.get(fid);
        const name = fid == null ? 'المكتبة' : folderName(fid);
        const d = dirOf(fid);

      /* =====================================================================
   4b. private images: blurhash placeholder (inline decoder, no dependency)
   The real image is fetched only for the details preview and quick-look.
   ===================================================================== */
      const B83 =
        '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#$%*+,-.:;=?@[]^_{|}~';
      const b83 = (s, a, b) => {
        let v = 0;
        for (let i = a; i < b; i++) v = v * 83 + B83.indexOf(s[i]);
        return v;
      };
      const srgbToLinear = (v) => {
        v /= 255;
        return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      };
      const linearToSrgb = (v) => {
        v = Math.max(0, Math.min(1, v));
        return Math.round(
          v <= 0.0031308
            ? v * 12.92 * 255 + 0.5
            : (1.055 * Math.pow(v, 1 / 2.4) - 0.055) * 255 + 0.5
        );
      };
      const signPow = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);
      function decodeBlurhash(hash, w, h) {
        if (typeof hash !== 'string' || hash.length < 6)
          throw new Error('bad blurhash');
        const flag = b83(hash, 0, 1),
          ny = Math.floor(flag / 9) + 1,
          nx = (flag % 9) + 1;
        if (hash.length !== 4 + 2 * nx * ny)
          throw new Error('bad blurhash length');
        const maxV = (b83(hash, 1, 2) + 1) / 166;
        const colors = [];
        for (let i = 0; i < nx * ny; i++) {
          if (i === 0) {
            const v = b83(hash, 2, 6);
            colors.push([
              srgbToLinear(v >> 16),
              srgbToLinear((v >> 8) & 255),
              srgbToLinear(v & 255),
            ]);
          } else {
            const v = b83(hash, 4 + i * 2, 6 + i * 2);
            colors.push([
              signPow((Math.floor(v / 361) - 9) / 9, 2) * maxV,
              signPow(((Math.floor(v / 19) % 19) - 9) / 9, 2) * maxV,
              signPow(((v % 19) - 9) / 9, 2) * maxV,
            ]);
          }
        }
        const px = new Uint8ClampedArray(w * h * 4);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            let r = 0,
              g = 0,
              b = 0;
            for (let j = 0; j < ny; j++) {
              for (let i = 0; i < nx; i++) {
                const basis =
                    Math.cos((Math.PI * x * i) / w) *
                    Math.cos((Math.PI * y * j) / h),
                  c = colors[i + j * nx];
                r += c[0] * basis;
                g += c[1] * basis;
                b += c[2] * basis;
              }
            }
            const o = 4 * (x + y * w);
            px[o] = linearToSrgb(r);
            px[o + 1] = linearToSrgb(g);
            px[o + 2] = linearToSrgb(b);
            px[o + 3] = 255;
          }
        }
        return px;
      }
      const BH_SIZE = 32,
        BH_CACHE = new Map();
      function paintBlurs(root = document) {
        root
          .querySelectorAll('canvas[data-bh]:not([data-done])')
          .forEach((c) => {
            const hash = c.dataset.bh;
            let px = BH_CACHE.get(hash);
            if (px === undefined) {
              try {
                px = decodeBlurhash(hash, BH_SIZE, BH_SIZE);
              } catch {
                px = null;
              }
              BH_CACHE.set(hash, px);
            }
            const ctx = c.getContext && c.getContext('2d');
            if (!px || !ctx) {
              c.dataset.done = 'x';
              return;
            }
            const img = ctx.createImageData(BH_SIZE, BH_SIZE);
            img.data.set(px);
            ctx.putImageData(img, 0, 0);
            c.dataset.done = '1';
          });
      }
      let bhQueued = false;
      function watchBlurs() {
        new MutationObserver(() => {

      /* ---------- modal ---------- */
      const modals = [];
      function openModal(o) {
        const wrap = document.createElement('div');
