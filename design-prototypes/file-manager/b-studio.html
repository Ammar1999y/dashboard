        wrap.innerHTML = `<div class="modal${o.wide ? ' wide' : ''}${o.cls ? ' ' + o.cls : ''}" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><header><h3>${o.icon ? ic(o.icon) : ''}${esc(o.title)}</h3><button class="ib sm" data-mclose aria-label="إغلاق">${ic('x')}</button></header><div class="mbody"></div><footer></footer></div>`;
        const body = $('.mbody', wrap),
          foot = $('footer', wrap);
        if (typeof o.body === 'string') body.innerHTML = o.body;
        else body.appendChild(o.body);
        (o.footStart || []).forEach((b) => foot.appendChild(b));
        const spacer = document.createElement('span');
        spacer.className = 'grow';
        foot.appendChild(spacer);
        const prev = document.activeElement;
        let resolve;
        const done = new Promise((r) => {
          resolve = r;
        });
        const m = { el: wrap, body, foot, done, closed: false, btns: [] };
        m.close = (v) => {
          if (m.closed) return;
          m.closed = true;
          modals.splice(modals.indexOf(m), 1);
          wrap.classList.add('out');
          setTimeout(() => wrap.remove(), reducedMotion() ? 0 : 140);
          if (prev && prev.focus && prev.isConnected) prev.focus();
          resolve(v);
        };
        (o.actions || []).forEach((a, i) => {
          const b = document.createElement('button');
          b.className = 'btn ' + (a.kind || '') + (a.cls ? ' ' + a.cls : '');
          b.textContent = a.label;
          if (a.badge) b.insertAdjacentHTML('beforeend', futBadge(a.badge));
          b.onclick = () => {
            if (a.onClick && a.onClick(m) === false) return;
            if (!a.keep) m.close(a.value);
          };
          foot.appendChild(b);
          m.btns[i] = b;
        });
        wrap.addEventListener('pointerdown', (e) => {
          if (e.target === wrap) m.close(undefined);
        });
        $('[data-mclose]', wrap).onclick = () => m.close(undefined);
        wrap.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') {
            const f = $$(
              'button:not([disabled]),input:not([disabled]),[tabindex="0"],a[href]',
              wrap
            ).filter((x) => x.offsetParent !== null);
            if (!f.length) return;
            const first = f[0],
              last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first) {

            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();

            e.key === 'Enter' &&
            e.target.tagName === 'INPUT' &&
            e.target.type !== 'checkbox' &&

            const b = m.btns[o.enterBtn];
            if (b && !b.disabled) b.click();
          }
        });
        $('#modalhost').appendChild(wrap);
        modals.push(m);
        if (o.onMount) o.onMount(m);

          $(
            o.focus || 'input:not([type=checkbox]),button.pri,button.danger',

      /* ---------- context menu ---------- */
      let menuEl = null,
        menuCleanup = null;

        if (menuCleanup) {

        }
        $$('.menu,.pop').forEach((m) => m.remove());
        menuEl = null;
      }
      function menuHtml(items) {
        return items
          .map((it, i) => {
            if (it.sep) return '<div class="msep" role="separator"></div>';
            if (it.head) return `<div class="mhead">${esc(it.head)}</div>`;
            return (
              `<button class="mi${it.danger ? ' danger' : ''}${it.fut ? ' futi' : ''}" role="menuitem${it.checked != null ? (it.toggle ? 'checkbox' : 'radio') : ''}" ${it.checked != null ? `aria-checked="${it.checked}"` : ''} data-i="${i}" ${it.disabled ? 'disabled' : ''} ${it.fut ? `data-fut="${it.fut}"` : ''}>` +
              `<span class="mic">${it.checked ? ic('check') : it.icon ? ic(it.icon) : ''}</span><span class="ml">${esc(it.label)}</span>` +
              (it.fut ? futBadge(it.fut) : '') +
              (it.badge ? futBadge(it.badge) : '') +
              (it.partial ? partialBadge() : '') +
              (it.kbd ? `<kbd>${esc(it.kbd)}</kbd>` : '') +
              (it.sub
                ? `<span class="msub">${ic('chevron-left')}</span>`
                : '') +
              `</button>`

      function placeMenu(el, x, y, anchorW) {
        const vw = innerWidth,
          vh = innerHeight;
        el.style.left = '0px';
        el.style.top = '0px';
        const r = el.getBoundingClientRect();
        let left = x - r.width + (anchorW || 0);
        if (left < 6) left = Math.min(x, vw - r.width - 6);
        left = clamp(left, 6, Math.max(6, vw - r.width - 6));
        let top = y;
        if (top + r.height > vh - 6)
          top = Math.max(6, y - r.height - (anchorW ? 30 : 0));
        top = clamp(top, 6, Math.max(6, vh - r.height - 6));
        el.style.left = left + 'px';
        el.style.top = top + 'px';
      }
      function showMenu(items, x, y, anchorW) {

        el.className = 'menu';
        el.setAttribute('role', 'menu');
        el.innerHTML = menuHtml(items);
        document.body.appendChild(el);

        menuEl = el;

        const closeSub = () => {
          if (subEl) {

            subEl && subEl.contains(document.activeElement) ? subEl : el;

            e.preventDefault();
            e.stopPropagation();
            (
              btns[(i - 1 + btns.length) % btns.length] || btns[btns.length - 1]
            ).focus();
          } else if (
            e.key === 'ArrowLeft' &&
            scope === el &&
            document.activeElement &&
            items[+document.activeElement.dataset.i] &&
            items[+document.activeElement.dataset.i].sub

            e.preventDefault();
            e.stopPropagation();

          } else if (e.key === 'ArrowRight' && scope === subEl) {
            e.preventDefault();
            e.stopPropagation();
            const parent = $$('.mi', el).find((b) => items[+b.dataset.i].sub);
            closeSub();
            if (parent) parent.focus();

            e.preventDefault();
            e.stopPropagation();
            closeMenu();
          } else if (e.key === 'Tab') {
            e.preventDefault();
            closeMenu();
          }

        const onDown = (e) => {
          if (!e.target.closest('.menu,.pop')) closeMenu();
        };
        const onOther = () => closeMenu();
        document.addEventListener('keydown', onKey, true);
        document.addEventListener('pointerdown', onDown, true);
        addEventListener('resize', onOther);
        addEventListener('blur', onOther);
        menuCleanup = () => {
          document.removeEventListener('keydown', onKey, true);
          document.removeEventListener('pointerdown', onDown, true);
          removeEventListener('resize', onOther);
          removeEventListener('blur', onOther);

        if (ed.kind === 'rename') {
          const it = S.items.get(ed.id);
          if (it && val === nameOf(it)) {
            cancelEditor();
            return;
          }
        }
        ed.busy = true;
        input.disabled = true;
        input.classList.add('busy');
        busy(true);
        try {
          let focusId = null;
          if (ed.kind === 'rename') {
            if (isFolderId(ed.id)) await api.updateFolder(ed.id, { name: val });
            else await api.renameFile(ed.id, val);
            focusId = ed.id;
            S.det.delete(ed.id);
          } else {
            const f = await api.createFolder(ed.parent, val.trim());
            focusId = f.id;
          }
          const kind = ed.kind;
          S.editing = null;
          await refreshAll();
          toast(kind === 'new' ? 'تم إنشاء المجلد' : 'تمت إعادة التسمية', 'ok');
          flash(focusId);
        } catch (e) {
          toast(e.message || 'تعذّر تنفيذ العملية', 'error');
          ed.busy = false;
          const again = $('#main .ed');
          if (again) {
            again.disabled = false;
            again.classList.remove('busy');
            again.focus();
            again.select();
          }
        } finally {
          busy(false);
        }
      }

      /* ---------- folder picker (lazy tree) ---------- */
      function pickFolder({ title, confirm, note = '', startAt }) {
        return new Promise((resolve) => {
          const cache = new Map();
          const bad = (id) => id == null;
          const expanded = new Set(['root']);
          let selected,
            creating = null,
            errMsg = '';
          const body = document.createElement('div');
          body.className = 'picker';
          body.innerHTML = `${note ? `<div class="inote">${ic('info')}${esc(note)}</div>` : ''}<div class="ptree" role="tree"></div><div class="perr" role="alert"></div>`;
          const tree = $('.ptree', body),
            perr = $('.perr', body);
          const load = async (key) => {
            if (cache.has(key)) return;
            cache.set(key, { status: 'loading', folders: [] });
            render();
            try {
              const r = await api.list({
                scope: 'folder',
                folderId: fromKey(key),
                perPage: 1,
              });
              ingest(r);
              cache.set(key, { status: 'ok', folders: r.folders });
            } catch (e) {
              cache.set(key, {
                status: 'error',
                folders: [],
                error: e.message,
              });
            }
            render();
          };
          const node = (key, name, depth) => {
            const id = fromKey(key),
              c = cache.get(key),
              open = expanded.has(key),
              isBad = bad(id);
            const kids = open
              ? !c || c.status === 'loading'
                ? `<li class="pload" style="--d:${depth + 1}"><span class="skb" style="width:40%"></span></li>`
                : c.status === 'error'
                  ? `<li class="pload" style="--d:${depth + 1}">${esc(c.error)}</li>`
                  : ''
              : '';
            let sub = '';
            if (open && c && c.status === 'ok') {
              if (creating === key)
                sub += `<li style="--d:${depth + 1}"><div class="pnode"><span class="disc sp"></span>${folderIc}<input class="ed" data-pnew value="مجلد جديد" maxlength="100" aria-label="اسم المجلد الجديد"></div></li>`;
              sub += c.folders
                .map((f) => node(f.id, f.name, depth + 1))
                .join('');
              if (!c.folders.length && creating !== key)
                sub += `<li class="pempty" style="--d:${depth + 1}">لا توجد مجلدات فرعية</li>`;
            }
            return (
              `<li role="treeitem" aria-expanded="${open}"><div class="pnode${selected === id && selected !== undefined ? ' on' : ''}${isBad ? ' bad' : ''}" data-pid="${key}" style="--d:${depth}" ${isBad ? 'title="غير متاح كوجهة"' : ''}>` +
              `<button class="disc${open ? ' open' : ''}" data-ptoggle="${key}" tabindex="-1" aria-label="توسيع">${ic('chevron-left')}</button>${key === 'root' ? ic('house') : folderIc}<span class="pname">${esc(name)}</span></div><ul role="group">${kids}${sub}</ul></li>`
            );
          };
          const render = () => {
            const keep = tree.scrollTop;
            tree.innerHTML = `<ul>${node('root', 'المكتبة (الجذر)', 0)}</ul>`;
            tree.scrollTop = keep;
            const m = body.__m;
            if (m) m.btns[1].disabled = selected === undefined;
            const inp = $('[data-pnew]', tree);
            if (inp && document.activeElement !== inp) {
              inp.focus();
              inp.select();
            }
            perr.textContent = errMsg;
          };
          const newBtn = document.createElement('button');
          newBtn.className = 'btn';
          newBtn.innerHTML = `${ic('folder-plus')}مجلد جديد`;
          newBtn.onclick = () => {
            const parent = selected;
            if (parent === undefined) {
              errMsg = 'اختر المجلد الذي سيُنشأ بداخله أولًا';
              render();
              return;
            }
            errMsg = '';
            creating = dkey(parent);
            expanded.add(creating);
            if (!cache.has(creating)) load(creating);
            else render();
          };
          const m = openModal({
            title,
            icon: 'folder-open',
            body,
            wide: true,
            footStart: [newBtn],
            actions: [
              { label: 'إلغاء', value: undefined },
              {
                label: confirm,
                kind: 'pri',
                onClick: () => {
                  if (selected === undefined) return false;
                  resolve({ id: selected });
                  m.close(true);
                  return false;
                },
              },
            ],
          });
          body.__m = m;
          m.done.then((v) => {
            if (v !== true) resolve(undefined);
          });
          body.addEventListener('click', (e) => {
            const t = e.target.closest('[data-ptoggle]');
            if (t) {
              const k = t.dataset.ptoggle;
              if (expanded.has(k)) expanded.delete(k);
              else {
                expanded.add(k);
                load(k);
              }
              render();
              return;
            }
            const n = e.target.closest('[data-pid]');
            if (!n || e.target.closest('[data-pnew]')) return;
            const id = fromKey(n.dataset.pid);
            if (bad(id)) {
              errMsg =
                id == null
                  ? 'لا يمكن اختيار الجذر لهذه العملية'
                  : 'لا يمكن اختيار هذا المجلد كوجهة (هو نفسه أو أحد مجلداته الفرعية)';
              render();
              return;
            }
            errMsg = '';
            selected = id;
            render();
          });
          body.addEventListener('dblclick', (e) => {
            const n = e.target.closest('[data-pid]');
            if (!n) return;
            const k = n.dataset.pid;
            if (expanded.has(k)) expanded.delete(k);
            else {
              expanded.add(k);
              load(k);
            }
            render();
          });
          body.addEventListener('keydown', async (e) => {
            const inp = e.target.closest('[data-pnew]');
            if (!inp) return;
            if (e.key === 'Escape') {
              e.stopPropagation();
              creating = null;
              render();
            } else if (e.key === 'Enter') {
              e.preventDefault();
              e.stopPropagation();
              const parentKey = creating;
              inp.disabled = true;
              try {
                const f = await api.createFolder(
                  fromKey(parentKey),
                  inp.value.trim()
                );
                cache.delete(parentKey);
                creating = null;
                errMsg = '';
                await load(parentKey);
                selected = f.id;
                render();
                loadDir(fromKey(parentKey));
                if (parentKey === 'root') loadDir(null);
              } catch (err) {
                errMsg = err.message;
                render();
                const again = $('[data-pnew]', tree);
                if (again) {
                  again.disabled = false;
                  again.focus();
                }
              }
            }
          });
          render();
          chainOf(startAt !== undefined ? startAt : loc()).forEach((id) => {
            expanded.add(id);
          });
          expanded.forEach((k) => load(k));
        });
      }

      /* ---------- delete (permanent) ---------- */
      async function deleteItems(ids) {
        if (!ids.length) return;
        const folders = ids.filter(isFolderId),
          allFiles = ids.filter((i) => !isFolderId(i));
        const counts = new Map(),
          stats = new Map(); // direct children (list) / whole subtree (future stats endpoint)
        let loaded = !folders.length,
          recursive = false,
          failedCount = false,
          m = null;
        // FUTURE (inuse): the list marks files that are in use; today the server only says so after rejecting the batch
        const usedIds = allFiles.filter((id) => {
          const it = S.items.get(id);
          return !!(it && it.inUse);
        });
        const body = document.createElement('div');
        const li = (id) =>
          `<li>${ic(isFolderId(id) ? 'folder' : 'file')}<span>${esc(nameOf(S.items.get(id) || { name: '…' }))}</span></li>`;
        const names = ids.slice(0, 5).map(li).join('');
        const nonEmpty = () => folders.filter((f) => counts.get(f) > 0);
        const overLimit = () =>
          S.future &&
          nonEmpty().some(
            (f) => stats.has(f) && stats.get(f).total > RECURSIVE_MAX
          );
        const paint = () => {
          const ne = nonEmpty(),
            sub = ne.reduce((a, f) => a + counts.get(f), 0);
          let tree = '';
          if (
            S.future &&
            loaded &&
            ne.length &&
            ne.every((f) => stats.has(f))
          ) {
            const nF =
                folders.length +
                ne.reduce((a, f) => a + stats.get(f).folders, 0),
              nFiles =
                allFiles.length +
                ne.reduce((a, f) => a + stats.get(f).files, 0);
            tree = `<div class="inote futonly" id="delpreview">${ic('info')}<span>سيُحذف ${cnt(nF, 'folder')} و${cnt(nFiles, 'file')} ${futBadge('deletepreview')}</span></div><div class="qnote futonly" id="delnote">المعاينة تقريبية؛ قد يتغيّر المحتوى قبل التأكيد</div>`;
            ne.filter((f) => stats.get(f).total > RECURSIVE_MAX).forEach(
              (f) => {
                tree += `<div class="inote err futonly" id="dellimit">${ic('triangle-alert')}<span>«${esc(folderName(f))}» يحتوي ${cnt(stats.get(f).total, 'item')} ويتجاوز حد الحذف المتكرر (${RECURSIVE_MAX}) — سيرفض الخادم العملية ${futBadge('deletepreview')}</span></div>`;
              }
            );
          }
          const usedBox =
            S.future && usedIds.length
              ? `<div class="usedbox futonly" id="usedbox"><b>${ic('lock')}${cnt(usedIds.length, 'file')} مستخدمة — الخادم يرفض الدفعة كاملة إن ضمّت ملفًا مستخدمًا ${futBadge('inuse')}</b><ul class="nlist">${usedIds.slice(0, 5).map(li).join('')}${usedIds.length > 5 ? `<li class="more">و${usedIds.length - 5} أخرى…</li>` : ''}</ul></div>`
              : '';
          body.innerHTML = `<div class="warnbox">${ic('triangle-alert')}<div><b>الحذف نهائي ولا يمكن التراجع عنه.</b><p>سيُحذف ${cnt(ids.length, 'item')} من الخادم فورًا ولا يمكن استعادته بعد ذلك.</p></div></div>
      <ul class="nlist">${names}${ids.length > 5 ? `<li class="more">و${ids.length - 5} عناصر أخرى…</li>` : ''}</ul>${usedBox}
      ${Math.ceil(allFiles.length / BULK_MAX) > 1 ? `<div class="inote">${ic('info')}سيُقسَّم حذف الملفات إلى ${cnt(Math.ceil(allFiles.length / BULK_MAX), 'batch')} (حد الطلب ${BULK_MAX} ملفًا).</div>` : ''}
      ${!folders.length ? '' : !loaded ? `<div class="inote"><span class="spin">${ic('loader')}</span>جارٍ فحص محتويات المجلدات…</div>` : failedCount ? `<div class="inote warn">${ic('triangle-alert')}تعذّر فحص محتويات المجلدات.</div>` : ne.length ? `<label class="check"><input type="checkbox" id="recur" ${recursive ? 'checked' : ''}><span>حذف المحتويات أيضًا (${cnt(sub, 'item')} داخل ${cnt(ne.length, 'folder')})</span></label>${tree}` : `<div class="inote ok">${ic('circle-check')}المجلدات المحددة فارغة.</div>`}`;
          if (m) m.btns[1].disabled = overLimit();
        };
        paint();
        body.addEventListener('change', (e) => {
          if (e.target.id === 'recur') recursive = e.target.checked;
        });
        const unusedLeft = allFiles.length - usedIds.length + folders.length;
        const actions = [
          { label: 'إلغاء', value: false },
          { label: 'حذف نهائيًا', kind: 'danger', value: true },
        ];
        if (usedIds.length && unusedLeft > 0)
          actions.push({
            label: 'حذف غير المستخدمة فقط',
            kind: 'danger',
            value: 'unused',
            cls: 'futonly',
            badge: 'inuse',
          });
        m = openModal({
          title: 'حذف نهائي',
          icon: 'bin',
          body,
          actions,
          focus: 'footer .btn',
        });
        if (folders.length) {
          Promise.all(
            folders.map(async (f) => {
              const r = await api.list({
                scope: 'folder',
                folderId: f,
                perPage: 1,
              });
              counts.set(f, r.folders.length + r.meta.total);
              if (S.future && counts.get(f) > 0) {
                try {
                  stats.set(f, await api.folderStats(f));
                } catch {
                  /* the preview is optional */
                }
              }
            })
          )
            .catch(() => {
              failedCount = true;
            })
            .then(() => {
              loaded = true;
              if (!m.closed) paint();
            });
        }
        const choice = await m.done;
        if (!choice) return;
        const files =
          choice === 'unused'
            ? allFiles.filter((id) => !usedIds.includes(id))
            : allFiles;
        busy(true);
        const done = [],
          deletedFolders = [],
          errs = [],
          rejected = [],
          blocked = [];
        let blockMsg = '';
        try {
          for (const id of folders) {
            try {
              await api.deleteFolder(id, recursive);
              done.push(id);
              deletedFolders.push(id);
            } catch (e) {
              errs.push(e.message);
            }
          }
          const batches = chunk(files, BULK_MAX);
          if (batches.length > 1)
            toast(`جارٍ الحذف على ${cnt(batches.length, 'batch')}…`, 'info');
          for (const b of batches) {
            try {
              await api.deleteFiles(b);
              done.push(...b);
            } catch (e) {
              if (e.code === 'FILE_IN_USE') {
                rejected.push(...b);
                blocked.push(...e.ids);
                blockMsg = e.message;
              } else errs.push(e.message);
            }
          }
        } finally {
          busy(false);
        }
        truncatePathAt(deletedFolders);
        done.forEach((id) => {
          S.sel.delete(id);
          S.det.delete(id);
          S.dirs.delete(id);
        });
        clipDrop(done, deletedFolders);
        S.cursor = {
          id: null,
          col: Math.min(
            typeof S.cursor.col === 'number' ? S.cursor.col : 0,
            S.path.length - 1
          ),
        };
        if (deletedFolders.length) loadDir(null);
        await refreshAll();
        if (done.length)
          toast(`تم حذف ${cnt(done.length, 'item')} نهائيًا`, 'ok');
        [...new Set(errs)].slice(0, 3).forEach((m2) => toast(m2, 'error'));
        if (rejected.length)
          await offerUnusedRetry(rejected, blocked, blockMsg);
      }
      // The 409 FILE_IN_USE payload carries the ids of the blocking files, so this works without the list flag
      async function offerUnusedRetry(rejected, blocked, message) {
        const inUse = new Set(blocked),
          retry = rejected.filter((id) => !inUse.has(id));
        const li = (id) =>
          `<li>${ic('file')}<span>${esc(nameOf(S.items.get(id) || { name: id }))}</span></li>`;
        const body = `<div class="warnbox">${ic('triangle-alert')}<div><b>رفض الخادم الدفعة لأن ${cnt(inUse.size, 'file')} مستخدمة.</b><p>${esc(message)}</p></div></div><ul class="nlist" id="blockedlist">${[...inUse].slice(0, 6).map(li).join('')}</ul>`;
        const actions = [{ label: 'إغلاق', value: false }];
        if (retry.length)
          actions.push({
            label: `حذف الملفات غير المستخدمة (${retry.length})`,
            kind: 'danger',
            value: true,
            badge: 'inuseerr',
          });
        const m = openModal({
          title: 'تعذّر حذف ملفات مستخدمة',
          icon: 'bin',
          body,
          actions,
          focus: 'footer .btn',
        });
        if (!(await m.done)) return;
        busy(true);
        const done = [],
          errs = [];
        try {
          for (const b of chunk(retry, BULK_MAX)) {
            try {
              await api.deleteFiles(b);
              done.push(...b);
            } catch (e) {
              errs.push(e.message);
            }
          }
        } finally {
          busy(false);
        }
        done.forEach((id) => {
          S.sel.delete(id);
          S.det.delete(id);
        });
        clipDrop(done);
        await refreshAll();
        if (done.length)
          toast(`تم حذف ${cnt(done.length, 'file')} غير مستخدمة نهائيًا`, 'ok');
        [...new Set(errs)].slice(0, 3).forEach((m2) => toast(m2, 'error'));
      }

      /* ---------- bulk publish: one request per file, partial success ---------- */
      async function bulkPublish(ids) {
        const files = ids.filter((i) => !isFolderId(i)),
          todo = files.filter((id) => {
            const it = S.items.get(id);
            return it && it.bucketType !== 'public';
          });
        if (!todo.length) {
          toast('كل الملفات المحددة منشورة بالفعل', 'info');
          return;
        }
        const ok = await confirmModal({
          title: 'نشر عدة ملفات',
          icon: 'globe',
          confirm: `نشر ${cnt(todo.length, 'file')}`,
          body: `<div class="warnbox">${ic('triangle-alert')}<div><b>ستصبح هذه الملفات متاحة لأي شخص على الإنترنت.</b><p>يُرسَل طلب منفصل لكل ملف، وقد ينجح بعضها ويفشل بعضها (حد النشر ${10} طلبات في الدقيقة).</p></div></div>`,
        });
        if (!ok) return;
        const body = document.createElement('div');
        body.innerHTML = `<div class="pbar"><i id="bpbar" style="width:0%"></i></div><p class="muted" id="bpstat">…</p><div id="bpsum"></div>`;
        let stop = false,
          finished = false,
          okIds = [],
          failed = [];
        const m = openModal({
          title: 'نشر الملفات',
          icon: 'globe',
          body,
          wide: true,
          actions: [
            {
              label: 'إيقاف',
              onClick: () => {
                if (!finished) {
                  stop = true;
                  return false;
                }
              },
            },
            {
              label: 'إعادة محاولة الفاشلة',
              kind: 'pri',
              keep: true,
              onClick: () => {
                retryFailed();
                return false;
              },
            },
          ],
        });
        m.btns[1].hidden = true;
        const run = async (list) => {
          finished = false;
          stop = false;
          m.btns[0].textContent = 'إيقاف';
          m.btns[1].hidden = true;
          let i = 0;
          for (; i < list.length && !stop; i++) {
            const id = list[i];
            $('#bpstat', body).textContent =
              `نشر ${i + 1} / ${list.length} — ${nameOf(S.items.get(id) || { name: id })}`;
            $('#bpbar', body).style.width =
              Math.round((i / list.length) * 100) + '%';
            try {
              patchFile(await api.publish(id));
              okIds.push(id);
            } catch (e) {
              failed.push({ id, message: e.message, code: e.code });
            }
          }
          const notRun = list.length - i;
          finished = true;
          m.btns[0].textContent = 'إغلاق';
          $('#bpbar', body).style.width = '100%';
          $('#bpstat', body).textContent = '';
          $('#bpsum', body).innerHTML =
            `<div class="inote ${failed.length ? 'warn' : 'ok'}">${ic(failed.length ? 'triangle-alert' : 'circle-check')}<b>نُشر ${cnt(okIds.length, 'file')}${failed.length ? `، وتعذّر نشر ${failed.length}` : ''}${notRun ? `، وأُوقف قبل ${cnt(notRun, 'file')}` : ''}</b></div>` +
            (failed.length
              ? `<ul class="nlist" id="bpfail">${failed.map((f) => `<li>${ic('triangle-alert')}<span>«${esc(nameOf(S.items.get(f.id) || { name: f.id }))}» — ${esc(f.message)}</span></li>`).join('')}</ul>`
              : '');
          m.btns[1].hidden = failed.length === 0;
          renderView();
          afterSelUi();
        };
        const retryFailed = () => {
          const again = failed.map((f) => f.id);
          failed = [];
          run(again);
        };
        busy(true);
        try {
          await run(todo);
        } finally {
          busy(false);
        }
        await m.done;
        if (okIds.length)
          toast(
            `نُشر ${cnt(okIds.length, 'file')}${failed.length ? `، وتعذّر نشر ${failed.length}` : ''}`,
            failed.length ? 'info' : 'ok'
          );
      }

      /* ---------- PDF preview (iframe) ---------- */
      async function openPdfPreview(id) {
        const it = S.items.get(id);
        if (!it || tkey(it) !== 'pdf') return;
        let d;
        busy(true);
        try {
          d = await getDetails(id);
        } catch (e) {
          toast(e.message, 'error');
          return;
        } finally {
          busy(false);
        }
        if (!d.previewUrl) {
          toast('لا يوجد رابط معاينة لهذا الملف', 'error');
          return;
        }
        openModal({
          title: it.displayName,
          icon: 'file-text',
          cls: 'xl',
          body: `<iframe class="pdfframe" src="${esc(d.previewUrl)}" title="معاينة ${esc(it.displayName)}"></iframe><div class="inote">${ic('info')}معاينة تجريبية من رابط وهمي ${futBadge('pdfprev')} — التنزيل يعمل كما هو.</div>`,
          actions: [{ label: 'إغلاق', kind: 'pri', value: true }],
        });
      }

      /* ---------- publish / links / download ---------- */
      function patchFile(f) {
        const apply = (o) => {
          if (o && o.id === f.id) Object.assign(o, f);
        };
        S.dirs.forEach((d) => d.files.forEach(apply));
        if (S.res) S.res.files.forEach(apply);
        const cur = S.items.get(f.id);
        if (cur) Object.assign(cur, f);
        else S.items.set(f.id, f);
        S.det.delete(f.id);
      }
      async function publishFile(id, publish) {
        const it = S.items.get(id);
        if (!it) return;
        const ok = await confirmModal(
          publish
            ? {
                title: 'نشر الملف',
                icon: 'globe',
                confirm: 'نشر الملف',
                body: `<div class="warnbox">${ic('triangle-alert')}<div><b>سيصبح الملف متاحًا لأي شخص على الإنترنت.</b><p>«${esc(it.displayName)}» سيحصل على رابط دائم يمكن لأي زائر فتحه دون تسجيل دخول.</p></div></div>`,
              }
            : {
                title: 'إلغاء نشر الملف',
                icon: 'eye-off',
                confirm: 'إلغاء النشر',
                body: `<div class="inote">${ic('info')}سيتوقف الرابط الدائم لـ«${esc(it.displayName)}» عن العمل، وسيعود الملف خاصًا (رابط مؤقت لساعة واحدة فقط). قد تتأثر الصفحات التي تستخدم الرابط الدائم.</div>`,
              }
        );
        if (!ok) return;
        busy(true);
        try {
          const f = await (publish ? api.publish(id) : api.unpublish(id));
          patchFile(f);
          renderView();
          afterSelUi();
          toast(
            publish
              ? 'تم نشر الملف — الرابط الدائم جاهز للنسخ'
              : 'تم إلغاء نشر الملف',
            'ok'
          );
        } catch (e) {
          toast(e.message, 'error');
        } finally {
          busy(false);
        }
      }
      async function getDetails(id) {
        const it = S.items.get(id);
        let d = S.det.get(id);
        if (!d || (it && !detFresh(d, it))) {
          d = await api.details(id);
          S.det.set(id, d);
        }
        return d;
      }
      async function copyText(t) {
        try {
          await navigator.clipboard.writeText(t);
          return true;
        } catch (e) {
          /* file:// may block the async clipboard */
        }
        const ta = document.createElement('textarea');
        ta.value = t;
        ta.style.cssText = 'position:fixed;top:-100px;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try {
          ok = document.execCommand('copy');
        } catch (e) {
          ok = false;
        }
        ta.remove();
        return ok;
      }
      async function copyLink(id) {
        busy(true);
        try {
          const d = await getDetails(id);
          const link = d.permanentUrl || d.tempUrl;
          const ok = await copyText(link);
          if (!ok) toast('تعذّر النسخ تلقائيًا من هذا المتصفح', 'error');
          else
            toast(
              d.permanentUrl
                ? 'تم نسخ الرابط الدائم'
                : 'تم نسخ رابط مؤقت صالح لساعة واحدة فقط (الملف خاص)',
              'ok'
            );
        } catch (e) {
          toast(e.message, 'error');
        } finally {
          busy(false);
        }
      }
      async function downloadFiles(ids) {
        const files = ids.filter((i) => !isFolderId(i));
        if (!files.length) return;
        busy(true);
        try {
          for (const id of files) {
            const d = await getDetails(id);
            const a = document.createElement('a');
            a.href = d.downloadUrl;
            a.download = d.displayName;
            a.target = '_blank';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
            if (files.length > 1) await sleep(250);
          }
          toast(
            files.length > 1
              ? `بدأ تنزيل ${cnt(files.length, 'file')}`
              : 'بدأ التنزيل',
            'ok'
          );
        } catch (e) {
          toast(e.message, 'error');
        } finally {
          busy(false);
        }
      }

      /* =====================================================================
   5c. upload queue (sequential, concurrency 2, auto-retry on 429)
   ===================================================================== */
      let upSeq = 0,
        upTicker = null,
        upRefreshT = null,
        upBatch = { ok: 0, fail: 0 },
        upPaint = false;
      const UP_STATE = {
        wait: 'انتظار',
        run: 'جارٍ الرفع',
        rl: 'انتظار حد الرفع',
        done: 'تم',
        fail: 'فشل',
        cancel: 'أُلغي',
      };
      const upActive = () =>
        S.uploads.some(
          (u) => u.state === 'wait' || u.state === 'run' || u.state === 'rl'
        );

      async function ensureTarget(folderId) {
        if (folderId != null) return folderId;
        const pick = await pickFolder({
          title: 'اختر مجلد الرفع',
          confirm: 'رفع إلى هذا المجلد',
          note: 'الجذر يحتوي مجلدات فقط ولا يقبل ملفات. اختر مجلدًا أو أنشئ مجلدًا جديدًا ثم ارفع إليه.',
        });
        return pick ? pick.id : undefined;
      }
      async function uploadItems(items, folderId, extraDirs = []) {
        if (!items.length && !extraDirs.length) return;
        const target = await ensureTarget(folderId);
        if (target === undefined) return;
        const keys = new Map();
        const add = (parts) =>
          parts.forEach((_, i) => {
            const k = parts.slice(0, i + 1);
            keys.set(k.join('/'), k);
          });
        items.forEach((it) => add(it.dirs));
        extraDirs.forEach(add);
        const map = new Map([['', target]]);
        if (keys.size) {
          toast(
            `رفع مجلد كامل (ميزة جزئية): جارٍ إنشاء ${cnt(keys.size, 'folder')} ثم رفع الملفات واحدًا واحدًا`,
            'info'
          );
          busy(true);
          try {
            for (const [key, parts] of [...keys].sort(
              (a, b) => a[1].length - b[1].length
            )) {
              const pid = map.get(parts.slice(0, -1).join('/')),
                name = parts[parts.length - 1];
              try {
                const f = await api.createFolder(pid, name);
                map.set(key, f.id);
              } catch (e) {
                if (e.code !== 'FOLDER_NAME_EXISTS') throw e;
                const r = await api.list({
                  scope: 'folder',
                  folderId: pid,
                  perPage: 100,
                });
                ingest(r);
                const ex = r.folders.find(
                  (x) =>
                    x.name.trim().toLowerCase() === name.trim().toLowerCase()
                );
                if (!ex) throw e;
                map.set(key, ex.id);
              }
            }
          } catch (e) {
            busy(false);
            toast(`تعذّر إنشاء بنية المجلدات: ${e.message}`, 'error');
            refreshAll();
            return;
          }
          busy(false);
        }
        if (items.length)
          enqueue(
            items.map((it) => ({
              file: it.file,
              folderId: map.get(it.dirs.join('/')),
            }))
          );
        if (keys.size) refreshAll();
      }
      function enqueue(entries) {
        entries.forEach((e) =>
          S.uploads.push({
            id: ++upSeq,
            file: e.file,
            name: e.file.name,
            size: e.file.size,
            folderId: e.folderId,
            state: 'wait',
            progress: 0,
            error: null,
            retryAt: 0,
            ctrl: null,
            result: null,
            thumb:
              e.file.type && e.file.type.startsWith('image/')
                ? URL.createObjectURL(e.file)
                : null,
          })
        );
        S.upOpen = true;
        renderUploads();
        pump();
      }
      function pump() {
        let running = S.uploads.filter((u) => u.state === 'run').length;
        for (const u of S.uploads) {
          if (running >= 2) break;
          if (u.state === 'wait') {
            running++;
            startUpload(u);
          }
        }
      }
      async function startUpload(u) {
        u.state = 'run';
        u.progress = 0;
        u.error = null;
        u.ctrl = new AbortController();
        renderUploads();
        try {
          const f = await api.upload(u.folderId, u.file, {
            onProgress: (p) => {
              u.progress = p;
              paintUploadProgress();
            },
            signal: u.ctrl.signal,
          });
          u.state = 'done';
          u.progress = 100;
          u.result = f;
          upBatch.ok++;
          S.items.set(f.id, f);
          clearTimeout(upRefreshT);
          upRefreshT = setTimeout(() => refreshAll(), 500);
        } catch (e) {
          if (e.code === 'RATE_LIMITED') {
            u.state = 'rl';
            u.retryAt = Date.now() + (e.retryAfter || 5) * 1000;
            u.error = e.message;
            startTicker();
          } else if (e.code === 'ABORTED' || (u.ctrl && u.ctrl.signal.aborted))
            u.state = 'cancel';
          else {
            u.state = 'fail';
            u.error = e.message || 'فشل الرفع';
            upBatch.fail++;
          }
        }
        u.ctrl = null;
        renderUploads();
        pump();
        if (!upActive()) finishBatch();
      }
      function finishBatch() {
        if (upBatch.ok || upBatch.fail) {
          toast(
            `اكتمل الرفع: ${upBatch.ok} ناجح${upBatch.fail ? `، ${upBatch.fail} فاشل` : ''}. الملفات المرفوعة خاصة افتراضيًا.`,
            upBatch.fail ? 'info' : 'ok'
          );
        }
        upBatch = { ok: 0, fail: 0 };
      }
      function startTicker() {
        if (upTicker) return;
        upTicker = setInterval(() => {
          const now = Date.now();
          let changed = false,
            any = false;
          S.uploads.forEach((u) => {
            if (u.state !== 'rl') return;
            if (now >= u.retryAt) {
              u.state = 'wait';
              changed = true;
              return;
            }
            any = true;
            const el = $(`#uppop [data-uid="${u.id}"] .rlsec`);
            if (el) el.textContent = Math.ceil((u.retryAt - now) / 1000);
          });
          if (changed) {
            renderUploads();
            pump();
          }
          if (!any) {
            clearInterval(upTicker);
            upTicker = null;
          }
        }, 400);
      }
      function cancelUpload(id) {
        const u = S.uploads.find((x) => x.id === id);
        if (!u) return;
        if (u.state === 'run' && u.ctrl) {
          u.ctrl.abort();
          return;
        }
        if (u.state === 'wait' || u.state === 'rl') {
          u.state = 'cancel';
          renderUploads();
          pump();
          if (!upActive()) finishBatch();
        }
      }
      function retryUpload(id) {
        const u = S.uploads.find((x) => x.id === id);
        if (!u || (u.state !== 'fail' && u.state !== 'cancel')) return;
        u.state = 'wait';
        u.error = null;
        u.progress = 0;
        renderUploads();
        pump();
      }
      function cancelAllUploads() {
        S.uploads
          .filter((u) => ['wait', 'run', 'rl'].includes(u.state))
          .forEach((u) => cancelUpload(u.id));
      }
      function clearFinished() {
        S.uploads = S.uploads.filter((u) =>
          ['wait', 'run', 'rl'].includes(u.state)
        );
        if (!S.uploads.length) S.upOpen = false;
        renderUploads();
      }
      function upStats() {
        const list = S.uploads.filter((u) => u.state !== 'cancel');
        const n = S.uploads.length,
          done = S.uploads.filter((u) => u.state === 'done').length,
          failed = S.uploads.filter((u) => u.state === 'fail').length;
        const pct = list.length
          ? Math.round(
              list.reduce(
                (a, u) => a + (u.state === 'done' ? 100 : u.progress),
                0
              ) / list.length
            )
          : 0;
        return { n, done, failed, pct, active: upActive() };
      }
      function paintIndicator() {
        const st = upStats(),
          ind = $('#upind');
        ind.classList.toggle('active', st.active);
        if (!st.n) ind.innerHTML = `${ic('upload')}<span>الرفع</span>`;
        else if (st.active)
          ind.innerHTML = `<span class="spin">${ic('loader')}</span><span>${ltr(`${st.done}/${st.n}`)} · ${ltr(st.pct + '%')}</span><span class="mini"><i style="width:${st.pct}%"></i></span>`;
        else
          ind.innerHTML = `${ic(st.failed ? 'triangle-alert' : 'circle-check')}<span>${st.failed ? `${st.failed} فشل` : 'اكتمل الرفع'}</span>`;
      }
      function paintUploadProgress() {
        if (upPaint) return;
        upPaint = true;
        requestAnimationFrame(() => {
          upPaint = false;
          paintIndicator();
          if (!S.upOpen) return;
          const st = upStats();
          const ob = $('#uppop .obar i');
          if (ob) ob.style.width = st.pct + '%';
          S.uploads.forEach((u) => {
            if (u.state !== 'run') return;
            const el = $(`#uppop [data-uid="${u.id}"]`);
            if (!el) return;
            $('.pbar i', el).style.width = u.progress + '%';
            $('.pct', el).textContent = Math.round(u.progress) + '%';
          });
        });
      }
      function upItemHtml(u) {
        let detail = '';
        if (u.state === 'run')
          detail = `<div class="pbar"><i style="width:${u.progress}%"></i></div><span class="pct num" dir="ltr">${Math.round(u.progress)}%</span>`;
        else if (u.state === 'rl')
          detail = `<span class="udet warn">${ic('timer')}انتظار حد الرفع — إعادة المحاولة خلال <b class="rlsec num">${Math.max(0, Math.ceil((u.retryAt - Date.now()) / 1000))}</b> ث</span>`;
        else if (u.state === 'fail')
          detail = `<span class="udet err">${esc(u.error)}</span>`;
        else if (u.state === 'done' && u.result) {
          const r = u.result,
            shrunk = r.mimeType === 'image/webp' && r.sizeBytes < u.size;
          detail = shrunk
            ? `<span class="udet ok">حُوّل إلى WebP: ${ltr(fmtSize(u.size))} ← ${ltr(fmtSize(r.sizeBytes))} (−${Math.round((1 - r.sizeBytes / u.size) * 100)}%)</span>`
            : `<span class="udet ok">تم الرفع — خاص</span>`;
        }
        const act =
          u.state === 'fail' || u.state === 'cancel'
            ? `<button class="ib sm" data-upretry="${u.id}" title="إعادة المحاولة">${ic('rotate-ccw')}</button>`
            : u.state === 'wait' || u.state === 'run' || u.state === 'rl'
              ? `<button class="ib sm" data-upcancel="${u.id}" title="إلغاء">${ic('x')}</button>`
              : '';
        const th = u.thumb
          ? `<span class="thumb" style="--h:${hue(u.name)}"><img src="${u.thumb}" alt="" draggable="false"></span>`
          : `<span class="dtile d-${tkeyOfFile(u.file) || 'file'}"><b>${(tkeyOfFile(u.file) || 'FILE').toUpperCase()}</b></span>`;
        return (
          `<div class="upi st-${u.state}" data-uid="${u.id}">${th}<div class="uinfo"><div class="urow"><span class="unm" title="${esc(u.name)}">${esc(u.name)}</span><span class="ust">${UP_STATE[u.state]}</span></div>` +
          `<div class="urow sub"><span class="udest">إلى «${esc(folderName(u.folderId))}» · ${ltr(fmtSize(u.size))}</span>${detail}</div></div>${act}</div>`
        );
      }
      function renderUploads() {
        paintIndicator();
        const pop = $('#uppop');
        pop.hidden = !S.upOpen;
        $('#upind').setAttribute('aria-expanded', S.upOpen ? 'true' : 'false');
        if (!S.upOpen) return;
        const st = upStats();
        const top = $('.uplist', pop) ? $('.uplist', pop).scrollTop : 0;
        pop.innerHTML =
          `<div class="uphead"><b>${ic('upload')}رفع الملفات</b><span class="upsum">${st.n ? `${ltr(`${st.done}/${st.n}`)} · ${st.active ? 'جارٍ الرفع' : 'انتهى'}` : ''}</span><button class="ib sm" data-upmin title="تصغير">${ic('minus')}</button><button class="ib sm" data-upclose title="إغلاق">${ic('x')}</button></div>` +
          (st.n
            ? `<div class="obar"><i style="width:${st.pct}%"></i></div>`
            : '') +
          `<div class="uplist">${st.n ? S.uploads.map(upItemHtml).join('') : `<div class="upempty">${ic('upload')}<p>لا توجد عمليات رفع. اسحب ملفات إلى أي مكان في النافذة.</p></div>`}</div>` +
          `<div class="upfoot"><span class="grow"></span>` +
          (st.active
            ? `<button class="linkbtn" data-upcancelall>إلغاء الكل</button>`
            : '') +
          (st.n &&
          st.n >
            S.uploads.filter((u) => ['wait', 'run', 'rl'].includes(u.state))
              .length
            ? `<button class="linkbtn" data-upclear>إزالة المنتهية</button>`
            : '') +
          `</div>`;
        const nl = $('.uplist', pop);
        if (nl) nl.scrollTop = top;
      }

      /* ---------- picking and dropping ---------- */
      function chooseFiles(dir, folderId) {
        const inp = $('#fileInput');
        inp.value = '';
        inp.webkitdirectory = !!dir;
        S.pickTarget = folderId === undefined ? loc() : folderId;
        inp.click();
      }
      function onFilesChosen() {
        const inp = $('#fileInput');
        const files = Array.from(inp.files || []);
        if (!files.length) return;
        const items = files.map((f) => ({
          file: f,
          dirs: f.webkitRelativePath
            ? f.webkitRelativePath.split('/').slice(0, -1)
            : [],
        }));
        uploadItems(items, S.pickTarget);
      }
      const readEntries = (dir) =>
        new Promise((res, rej) => {
          const r = dir.createReader(),
            all = [];
          const next = () =>
            r.readEntries((b) => {
              if (!b.length) res(all);
              else {
                all.push(...b);
                next();
              }
            }, rej);
          next();
        });
      async function walkEntry(en, dirs, out) {
        if (en.isFile) {
          const file = await new Promise((res, rej) => en.file(res, rej));
          out.items.push({ file, dirs });
        } else if (en.isDirectory) {
          const here = [...dirs, en.name];
          out.dirs.push(here);
          for (const c of await readEntries(en)) await walkEntry(c, here, out);
        }
      }
      async function handleDesktopDrop(dt, targetFid) {
        const entries = dt.items
          ? Array.from(dt.items).map((i) =>
              i.kind === 'file' && i.webkitGetAsEntry
                ? i.webkitGetAsEntry()
                : null
            )
          : [];
        const plain = Array.from(dt.files || []);
        const target = targetFid === undefined ? loc() : targetFid;
        const out = { items: [], dirs: [] };
        if (entries.some(Boolean)) {
          try {
            for (const en of entries) if (en) await walkEntry(en, [], out);
          } catch (e) {
            toast('تعذّرت قراءة المجلد المُسقَط', 'error');
            return;
          }
        } else plain.forEach((f) => out.items.push({ file: f, dirs: [] }));
        uploadItems(out.items, target, out.dirs);
      }

      /* =====================================================================
   5d. actions registry, menus, palette, quick look, search + filters
   ===================================================================== */

      const SORTS = [

      /* ---------- command palette ---------- */
      function openPalette() {
        if ($('#pal')) {
          closePalette();
          return;
        }
        closeMenu();
        const wrap = document.createElement('div');
        wrap.id = 'pal';
        wrap.className = 'pal-wrap';
        wrap.innerHTML = `<div class="pal" role="dialog" aria-modal="true" aria-label="لوحة الأوامر"><div class="pin">${ic('command')}<input id="palq" placeholder="اكتب أمرًا أو اسم مجلد…" autocomplete="off" aria-label="بحث في الأوامر"><kbd>Esc</kbd></div><div class="plist" id="pallist" role="listbox"></div><div class="pfoot"><span><kbd>↑</kbd><kbd>↓</kbd> تنقّل</span><span><kbd>Enter</kbd> تنفيذ</span><span><span class="fb">✦</span> ميزات تحتاج الخادم</span></div></div>`;
        $('#modalhost').appendChild(wrap);
        const prev = document.activeElement;
        const input = $('#palq', wrap),
          list = $('#pallist', wrap);
        let idx = 0,
          rows = [];
        const norm = (s) =>
          String(s)
            .toLowerCase()
            .replace(/[ً-ْـ]/g, '')
            .replace(/[أإآ]/g, 'ا');
        const build = () => {
          const q = norm(input.value.trim());
          rows = [];
          Object.values(ACT).forEach((a) => {
            if (a.pal === false) return;
            if ((a.fut || a.flag) && !S.future) return;
            if (!a.fut && !actOk(a)) return;
            if (q && !norm(a.label).includes(q)) return;
            rows.push({
              label: a.label,
              icon: a.icon,
              kbd: a.kbd,
              group: a.group,
              fut: a.fut,
              flag: a.flag,
              partial: a.partial,
              run: () => runAct(a.id),
            });
          });
          if (q.length >= 1) {
            S.fold.forEach((f) => {
              if (norm(f.name).includes(q))
                rows.push({
                  label: `الانتقال إلى «${f.name}»`,
                  icon: 'folder',
                  group: 'مجلدات',
                  hint: pathText(f.parentId),
                  run: () => goTo(f.id),
                });
            });
            const raw = input.value.trim();
            rows.unshift({
              label: `بحث عن «${raw}» في المكتبة كلها`,
              icon: 'search',
              group: 'بحث',
              run: () => {
                const qi = $('#q');
                qi.value = raw;
                onSearchInput(true);
                qi.focus();
              },
            });
          }
          rows = rows.slice(0, 60);
          idx = clamp(idx, 0, Math.max(0, rows.length - 1));
          let last = '';
          list.innerHTML = rows.length
            ? rows
                .map((r, i) => {
                  const g =
                    r.group !== last
                      ? `<div class="pgroup">${esc((last = r.group))}</div>`
                      : '';
                  return (
                    g +
                    `<button class="prow${i === idx ? ' on' : ''}${r.fut ? ' futi' : ''}" role="option" data-pi="${i}">${r.icon ? ic(r.icon) : ''}<span class="pl">${esc(r.label)}</span>${r.hint ? `<small>${esc(r.hint)}</small>` : ''}${r.fut ? futBadge(r.fut) : ''}${r.flag ? futBadge(r.flag) : ''}${r.partial ? partialBadge() : ''}${r.kbd ? `<kbd>${esc(r.kbd)}</kbd>` : ''}</button>`
                  );
                })
                .join('')
            : `<div class="pempty">لا توجد أوامر مطابقة</div>`;
          const on = $('.prow.on', list);
          if (on) on.scrollIntoView({ block: 'nearest' });
        };
        const run = (i) => {
          const r = rows[i];
          if (!r) return;
          closePalette();
          setTimeout(() => {
            if (r.fut) futureNote(r.fut);
            else r.run();
          }, 0);
        };
        input.addEventListener('input', () => {
          idx = 0;
          build();
        });
        wrap.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            idx = Math.min(rows.length - 1, idx + 1);
            build();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            idx = Math.max(0, idx - 1);
            build();
          } else if (e.key === 'Enter') {
            e.preventDefault();
            run(idx);
          } else if (e.key === 'Escape') {
            e.preventDefault();
            e.stopPropagation();
            closePalette();
          } else if (e.key === 'Tab') e.preventDefault();
        });
        list.addEventListener('click', (e) => {
          const b = e.target.closest('[data-pi]');
          if (b) run(+b.dataset.pi);
        });
        wrap.addEventListener('pointerdown', (e) => {
          if (e.target === wrap) closePalette();
        });
        wrap.__prev = prev;
        build();
        input.focus();
      }
      function closePalette() {
        const p = $('#pal');
        if (!p) return;
        const prev = p.__prev;
        p.remove();
        if (prev && prev.isConnected && prev.focus) prev.focus();
      }

      /* ---------- quick look ---------- */
      function openQL(id) {
        if (!id || !S.items.get(id)) return;
        closeMenu();
        const col = viewCol();
        let list = itemsOf(col).filter((x) => !isFolderId(x));
        if (!list.includes(id)) list = [id];
        S.ql = {
          list,
          i: list.indexOf(id),
          z: 1,
          tx: 0,
          ty: 0,
          col,
          prev: document.activeElement,
        };
        $('#ql').hidden = false;
        renderQL();
      }
      function closeQL() {
        if (!S.ql) return;
        const prev = S.ql.prev;
        $('#ql').hidden = true;
        $('#ql').innerHTML = '';
        S.ql = null;
        if (prev && prev.isConnected && prev.focus) prev.focus();
      }
      function qlGo(d) {
        const q = S.ql;
        if (!q) return;
        const i = clamp(q.i + d, 0, q.list.length - 1);
        if (i === q.i) return;
        q.i = i;
        q.z = 1;
        q.tx = 0;
        q.ty = 0;
        if (q.list.length > 1) selectOnly(q.list[i], q.col);
        renderQL();
      }
      function renderQL() {
        const q = S.ql,
          id = q.list[q.i],
          it = S.items.get(id),
          el = $('#ql');
        if (!it) {
          closeQL();
          return;
        }
        const dims = it.width ? ` · ${ltr(`${it.width} × ${it.height}`)}` : '';
        const k = tkey(it);
        const content =
          it.kind === 'image'
            ? `<img class="qlimg" id="qlimg" src="${esc(it.url)}" alt="${esc(it.displayName)}" draggable="false">`
            : `<div class="qldoc"><div class="bigdoc d-${k}">${ic('file-text')}<b>${k.toUpperCase()}</b></div><h3>${esc(it.displayName)}</h3><p>${typeLabel(it)} · ${ltr(fmtSize(it.sizeBytes))}</p><div class="erow"><button class="btn pri" data-ql="download">${ic('download')}تنزيل</button>${k === 'pdf' ? `<button class="btn" data-ql="pdf">${ic('eye')}معاينة${futBadge('pdfprev')}</button>` : ''}</div></div>`;
        el.innerHTML =
          `<div class="qlbar"><div class="qltitle"><b>${esc(it.displayName)}</b><span>${typeLabel(it)} · ${ltr(fmtSize(it.sizeBytes))}${dims}</span><span class="qlpos">${ltr(`${q.i + 1} / ${q.list.length}`)}</span></div>` +
          `<div class="qlbtns">${it.kind === 'image' ? `<button class="ib" data-ql="zout" title="تصغير (-)">${ic('zoom-out')}</button><button class="qlz" data-ql="zreset" id="qlz" title="100%">100%</button><button class="ib" data-ql="zin" title="تكبير (+)">${ic('zoom-in')}</button>` : ''}<button class="ib" data-ql="download" title="تنزيل">${ic('download')}</button><button class="ib qlclose" data-ql="close" title="إغلاق (Esc)">${ic('x')}</button></div></div>` +
          (q.list.length > 1
            ? `<button class="qlnav prev" data-ql="prev" aria-label="السابق" ${q.i === 0 ? 'disabled' : ''}>${ic('chevron-right')}</button><button class="qlnav next" data-ql="next" aria-label="التالي" ${q.i === q.list.length - 1 ? 'disabled' : ''}>${ic('chevron-left')}</button>`
            : '') +
          `<div class="qlstage" id="qlstage">${content}</div>`;
        applyQL();
        const c = $('.qlclose', el);
        if (c) c.focus();
      }
      function applyQL() {
        const q = S.ql,
          img = $('#qlimg');
        if (!q || !img) return;
        img.style.transform = `translate(${q.tx}px, ${q.ty}px) scale(${q.z})`;
        img.classList.toggle('zoomed', q.z > 1);

      }
      function qlZoom(f, reset) {
        const q = S.ql;
        if (!q) return;
        q.z = reset ? 1 : clamp(q.z * f, 0.5, 8);

      }

      /* ---------- search + filters ---------- */
      function apiFilters() {
        const f = S.filters;
        return {
          kind: f.kind,
          bucketType: f.bucketType,
          type: f.type,
          minSize: f.minSize,
          maxSize: f.maxSize,
          createdAfter: f.days ? Date.now() - f.days * 864e5 : undefined,
        };
      }
      // folder the user is "inside" (not the root, not the flat all-files mode)
      const ctxFolder = () => (!S.all && loc() != null ? loc() : null);
      const searchFolder = () =>
        ctxFolder() != null && S.scope === 'folder' ? ctxFolder() : null;
      function filtersChanged(fromUser) {
        renderFilterBadge();
        updateStatus();
        if (fromUser && filterCount() > 0 && !resultsMode() && loc() == null) {
          setAllMode(true);
          S.dirs.forEach((d, k) => loadDir(fromKey(k)));

        afterNav();
        afterSelUi();

      function setQuery(text, force) {
        const folder = text ? searchFolder() : null;
        if (!force && text === S.q && folder === S.qFolder) return;
        const was = resultsMode();
        S.q = text;
        S.qFolder = folder;
        if (!was && !resultsMode()) return;
        S.res = null;
        resGen++;
        S.sel.clear();
        S.anchor = null;
        S.pendingFocus = null;
        S.cursor = { id: null, col: resultsMode() ? 'R' : lastCol() };

        afterNav();
        afterSelUi();
        if (resultsMode()) loadResults();
      }
      function clearSearch() {
        $('#q').value = '';
        $('#qhint').hidden = true;

      function leaveResults() {

      }
      function setSearchScope(v) {
        S.scope = v;
        renderQHint($('#q').value);

      }
      function renderQHint(text) {
        const h = $('#qhint');
        const n = text.trim().length,
          focused = document.activeElement === $('#q');
        let html = '';
        if (focused && n > 0 && n < 3)

      let searchTimer = null;
      function onSearchInput(final) {

      }
      const SIZE_PRESETS = {
        lt100k: ['أقل من 100 KB', { maxSize: 102400 }],
        lt500k: ['أقل من 500 KB', { maxSize: 512000 }],
        gt500k: ['أكبر من 500 KB', { minSize: 512000 }],
        gt1m: ['أكبر من 1 MB', { minSize: 1048576 }],
        gt5m: ['أكبر من 5 MB', { minSize: 5242880 }],
      };
      const sizePresetOn = (f, id) => {
        const p = SIZE_PRESETS[id][1];
        return (
          (p.maxSize != null && f.maxSize === p.maxSize && f.minSize == null) ||
          (p.minSize != null && f.minSize === p.minSize && f.maxSize == null)
        );
      };
      function filterPopHtml() {
        const f = S.filters;
        const on = (k, v) => (f[k] === v ? ' on' : '');
        const opt = (key, val, label, extra) =>

        return (
          '<div class="fhead"><b>' +

          'تصفية الملفات</b><button class="linkbtn" data-f="clear">إزالة الكل</button></div>' +
          '<div class="fgroup"><h6>العرض</h6><div class="seg fill" role="radiogroup" aria-label="العرض">' +
          '<button class="' +
          (S.all ? '' : 'on') +
          '" data-f="view:folders" role="radio" aria-checked="' +

          '">' +
          ic('folder-open') +

          '<button class="' +
          (S.all ? 'on' : '') +
          '" data-f="view:all" role="radio" aria-checked="' +
          S.all +
          '">' +
          ic('file-image') +
          'كل الملفات</button></div></div>' +
          '<div class="fgroup"><h6>النوع</h6><div class="fopts">' +
          opt('kind', 'image', 'صورة', on('kind', 'image')) +
          opt('kind', 'document', 'مستند', on('kind', 'document')) +
          '</div></div>' +
          '<div class="fgroup"><h6>الرؤية</h6><div class="fopts">' +
          opt(
            'bucketType',
            'public',
            ic('globe') + 'عام',
            on('bucketType', 'public')
          ) +
          opt(
            'bucketType',

          ) +
          '</div></div>' +
          '<div class="fgroup"><h6>الصيغة</h6><div class="fopts">' +
          Object.keys(TYPES)
            .map((k) =>
              opt(
                'type',
                k,
                '<bdi dir="ltr">' + TYPES[k].label + '</bdi>',
                on('type', k)
              )
            )
            .join('') +
          '</div></div>' +
          '<div class="fgroup"><h6>الحجم</h6><div class="fopts">' +
          Object.keys(SIZE_PRESETS)
            .map((id) =>
              opt(
                'size',
                id,
                SIZE_PRESETS[id][0],
                sizePresetOn(f, id) ? ' on' : ''
              )
            )
            .join('') +
          '</div></div>' +
          '<div class="fgroup"><h6>التاريخ</h6><div class="fopts">' +
          [7, 30, 90]
            .map((d) =>
              opt('days', d, 'آخر ' + d + ' يومًا', f.days === d ? ' on' : '')
            )
            .join('') +
          '</div></div>'
        );
      }
      function openFilterPop(anchor) {
        showPop(filterPopHtml(), anchor, 'filterpop', (el) => {
          el.addEventListener('click', (e) => {
            const b = e.target.closest('[data-f]');
            if (!b) return;
            const [k, v] = b.dataset.f.split(':');
            if (k === 'view') {
              setAllMode(v === 'all');
              el.innerHTML = filterPopHtml();
              return;
            }
            if (k === 'clear') S.filters = {};
            else if (k === 'size') {
              const same = sizePresetOn(S.filters, v);
              delete S.filters.minSize;
              delete S.filters.maxSize;
              if (!same) Object.assign(S.filters, SIZE_PRESETS[v][1]);
            } else if (k === 'days') {
              if (S.filters.days === +v) delete S.filters.days;
              else S.filters.days = +v;
            } else if (S.filters[k] === v) delete S.filters[k];
            else S.filters[k] = v;
            filtersChanged(true);
            el.innerHTML = filterPopHtml();
          });
        });
      }

      /* =====================================================================
   5e. move = cut + paste (move clipboard). Drag & drop shares moveCore.
   ===================================================================== */
      const isCut = (id) => !!(S.clip && S.clip.set.has(id));
      const itemParent = (id) => {
        const it = S.items.get(id);
        return it ? (isFolderId(id) ? it.parentId : it.folderId) : undefined;
      };

      function makeClip(ids, sourceFolderId, sourceName) {
        return {
          ids,
          set: new Set(ids),
          sourceFolderId,
          sourceName,
          busy: false,
          step: null,
        };
      }
      function paintCut() {
        $$('#main [data-id]').forEach((el) =>
          el.classList.toggle('cut', isCut(el.dataset.id))
        );
      }
      function clipChanged() {
        paintCut();
        updateBulk();
      }

      function cutSelection() {
        const si = selInfo();
        if (!si.n) return;
        if (S.clip && S.clip.busy) {
          toast('انتظر حتى ينتهي النقل الجاري', 'info');
          return;
        }
        const parents = new Set(si.ids.map(itemParent));
        const src = parents.size === 1 ? [...parents][0] : undefined;
        S.clip = makeClip(
          si.ids,
          src,
          src === undefined ? 'عدة مواقع' : folderName(src)
        );
        S.sel.clear();
        S.anchor = null;
        S.cursor = { id: null, col: S.cursor.col };
        afterSelUi();
        clipChanged();
        toast(
          `حُدِّد ${cnt(si.n, 'item')} للنقل — افتح المجلد الهدف واضغط «لصق هنا»`,
          'info'
        );
      }
      function cancelCut(silent) {
        if (!S.clip || S.clip.busy) return;
        S.clip = null;
        clipChanged();
        if (!silent) toast('أُلغي النقل المعلّق', 'info');
      }
      // Deleted/moved items (or items living inside deleted folders) leave the clipboard.
      function clipDrop(ids, folderIds = []) {
        const c = S.clip;
        if (!c) return;
        const gone = new Set(ids);
        const keep = c.ids.filter((id) => {
          if (gone.has(id)) return false;
          const p = itemParent(id);
          return !(
            p != null &&
            folderIds.length &&
            chainOf(p).some((x) => folderIds.includes(x))
          );
        });
        if (keep.length === c.ids.length) return;
        S.clip = keep.length
          ? makeClip(keep, c.sourceFolderId, c.sourceName)
          : null;
        clipChanged();
      }

      /* ---------- where can we paste? ---------- */
      // folder the user is "in": deepest opened folder (columns) / current folder (grid, list); undefined in result lists
      const pasteTargetNow = () => (resultsMode() ? undefined : loc());
      function pasteVerdict(target) {
        const c = S.clip;
        if (!c) return { ok: false, reason: 'لا توجد عناصر معلّقة للنقل' };
        if (target === undefined)
          return { ok: false, reason: 'افتح مجلدًا للصق' };
        const folders = c.ids.filter(isFolderId);
        if (target != null && chainOf(target).some((x) => folders.includes(x)))
          return { ok: false, reason: 'لا يمكن نقل مجلد إلى داخله' };
        const movable = c.ids.filter((id) => itemParent(id) !== target);
        if (!movable.length)
          return { ok: false, reason: 'العناصر موجودة هنا بالفعل' };
        if (target == null) {
          const mf = movable.filter(isFolderId);
          if (!mf.length)
            return {
              ok: false,
              reason: 'الملفات تُحفظ داخل مجلد دائمًا — افتح مجلدًا للصق',
            };
          if (mf.length < movable.length)
            return {
              ok: true,
              foldersOnly: true,
              ids: mf,
              rest: movable.filter((id) => !isFolderId(id)),
            };
        }
        return { ok: true, ids: movable, rest: [] };
      }
      function pasteTip(target) {
        const v = pasteVerdict(target);
        if (!v.ok) return v.reason;
        return `لصق في «${folderName(target)}»${v.foldersOnly ? ' (المجلدات فقط)' : ''}`;
      }

      /* ---------- tray (action bar) ---------- */
      function pasteBtnHtml(label, cls) {
        const c = S.clip,
          v = pasteVerdict(pasteTargetNow());
        return `<button class="btn sm pri${v.ok ? '' : ' is-disabled'} ${cls || ''}" data-act="paste" title="${esc(pasteTip(pasteTargetNow()))}" aria-disabled="${!v.ok}" ${c.busy ? 'disabled' : ''}>${ic('clipboard-paste')}<span>${label}</span></button>`;
      }
      function pasteChipHtml() {
        return (
          pasteBtnHtml(`لصق (${S.clip.ids.length})`, 'chipbtn') +
          '<span class="sep"></span>'
        );
      }
      function trayHtml() {
        const c = S.clip,
          n = c.ids.length,
          dis = c.busy ? 'disabled' : '';
        const stack = c.ids
          .slice(0, 3)
          .map((id, i) => {
            const it = S.items.get(id);
            return `<span class="tk" style="--i:${i}">${it ? (isFolderId(id) ? folderIc : thumbHtml(it)) : ''}</span>`;
          })
          .join('');
        const label = c.busy
          ? `<span class="spin">${ic('loader')}</span> جارٍ النقل… ${c.step ? `${c.step[0]}/${c.step[1]}` : ''}`
          : `${cnt(n, 'item')} من «${esc(c.sourceName)}»`;
        return (
          `<span class="tstack" aria-hidden="true">${stack}</span><span class="tcount" title="${cnt(n, 'item')}">${n}</span><span class="ttext">${label}</span>` +
          pasteBtnHtml('لصق هنا') +
          `<button class="btn sm" data-act="newfolder" title="مجلد جديد في المجلد الحالي" ${dis}>${ic('folder-plus')}<span class="lbl">مجلد جديد</span></button>` +
          `<button class="ib sm" data-act="cancelcut" title="إلغاء النقل (Esc)" aria-label="إلغاء النقل" ${dis}>${ic('x')}</button>`
        );
      }

      /* ---------- the move itself (shared by paste and drag & drop) ---------- */
      // Files: moveFiles in chunks of 50 (all-or-nothing per request). Folders: one updateFolder per request.
      async function moveCore(ids, target, onStep) {
        const folders = ids.filter(isFolderId),
          files = ids.filter((i) => !isFolderId(i));
        const batches = chunk(files, BULK_MAX);
        const r = { moved: [], failed: [], gone: [], errs: [] };
        const total = folders.length + batches.length;
        let step = 0,
          targetOk;
        const tick = () => {
          step++;
          if (onStep) onStep(step, total);
        };
        const targetExists = async () => {
          if (target == null) return true;
          if (targetOk === undefined) {
            try {
              await api.list({ scope: 'folder', folderId: target, perPage: 1 });
              targetOk = true;
            } catch (e) {
              targetOk = e.code !== 'NOT_FOUND';
            }
          }
          return targetOk;
        };
        const one = async (id) => {
          try {
            if (isFolderId(id))
              await api.updateFolder(id, { parentId: target });
            else await api.moveFile(id, target);
            r.moved.push(id);
          } catch (e) {
            if (e.code === 'NOT_FOUND' && (await targetExists()))
              r.gone.push(id);
            else {
              r.failed.push(id);
              r.errs.push(e.message);
            }
          }
        };
        for (const id of folders) {
          await one(id);
          tick();
        }
        for (const b of batches) {
          if (b.length === 1) {
            await one(b[0]);
            tick();
            continue;
          }
          try {
            await api.moveFiles(b, target);
            r.moved.push(...b);
          } catch (e) {
            if (e.code === 'NOT_FOUND' && (await targetExists())) {
              for (const id of b) await one(id);
            } else {
              r.failed.push(...b);
              r.errs.push(e.message);
            }
          }
          tick();
        }
        return r;
      }
      async function afterMove(res, ids) {
        truncatePathAt(res.moved.filter(isFolderId));
        ids.forEach((i) => S.det.delete(i));
        clipDrop([...res.moved, ...res.gone]);
        S.sel.clear();
        S.anchor = null;
        S.cursor = {
          id: null,
          col: Math.min(
            typeof S.cursor.col === 'number' ? S.cursor.col : 0,
            S.path.length - 1
          ),
        };
        await refreshAll();
      }
      function reportMove(res) {
        if (res.gone.length)
          toast(
            `${cnt(res.gone.length, 'item')} لم يعد موجودًا وأُزيل من النقل`,
            'info'
          );
        [...new Set(res.errs)].slice(0, 3).forEach((m) => toast(m, 'error'));
      }
      const splitNote = (files) => {
        const nb = Math.ceil(files / BULK_MAX);
        if (nb > 1)
          toast(
            `تم تقسيم النقل إلى ${cnt(nb, 'batch')} (حد الطلب الواحد ${BULK_MAX} ملفًا)`,
            'info'
          );
      };

      // drag & drop
      async function moveItems(ids, target) {
        const files = ids.filter((i) => !isFolderId(i));
        if (files.length && target == null) {
          toast('لا يمكن نقل الملفات إلى الجذر — اختر مجلدًا', 'error');
          return;
        }
        splitNote(files.length);
        busy(true);
        let res;
        try {
          res = await moveCore(ids, target);
        } finally {
          busy(false);
        }
        await afterMove(res, ids);
        if (res.moved.length)
          toast(
            `نُقل ${cnt(res.moved.length, 'item')} إلى «${folderName(target)}»`,
            'ok'
          );
        reportMove(res);
      }

      // paste
      function pasteHere() {
        return pasteInto(pasteTargetNow());
      }
      async function pasteInto(target) {
        const c = S.clip;
        if (!c || c.busy) return;
        const v = pasteVerdict(target);
        if (!v.ok) {
          toast(v.reason, 'error');
          return;
        }
        if (v.foldersOnly) {
          const ok = await confirmModal({
            title: 'لصق المجلدات فقط',
            icon: 'clipboard-paste',
            confirm: 'لصق المجلدات',
            body: `<div class="warnbox">${ic('triangle-alert')}<div><b>الجذر يحتوي مجلدات فقط.</b><p>سيُنقل ${cnt(v.ids.length, 'folder')} إلى «المكتبة»، وتبقى ${cnt(v.rest.length, 'file')} في النقل المعلّق إلى أن تفتح مجلدًا وتلصقها فيه.</p></div></div>`,
          });
          if (!ok || S.clip !== c) return;
        }
        const nFiles = v.ids.filter((i) => !isFolderId(i)).length;
        c.busy = true;
        c.step = [
          0,
          v.ids.filter(isFolderId).length + Math.ceil(nFiles / BULK_MAX),
        ];
        updateBulk();
        splitNote(nFiles);
        busy(true);
        let res;
        try {
          res = await moveCore(v.ids, target, (s, t) => {
            c.step = [s, t];
            updateBulk();
          });
        } finally {
          busy(false);
          c.busy = false;
        }
        const failed = new Set(res.failed);
        const remaining = c.ids.filter(
          (id) => failed.has(id) || v.rest.includes(id)
        );
        S.clip = remaining.length
          ? makeClip(remaining, c.sourceFolderId, c.sourceName)
          : null;
        await afterMove(res, v.ids);
        if (!resultsMode() && target === loc()) {
          const here = dirIds(target),
            moved = res.moved.filter((id) => here.includes(id));
          if (moved.length) {
            setSel(moved, moved[0], lastCol(), moved[0]);
            scrollToItem(moved[0]);
          }
        }
        clipChanged();
        if (res.moved.length)
          toast(
            `نُقل ${cnt(res.moved.length, 'item')} إلى «${folderName(target)}»`,
            'ok'
          );
        reportMove(res);
      }

      /* =====================================================================
   6. EVENTS (delegated) + BOOT
   ===================================================================== */
      const colOf = (el) => {
        const c = el.closest('[data-col]');
        return c
          ? isNaN(+c.dataset.col)
            ? c.dataset.col
            : +c.dataset.col

      /* ---------- marquee + column resize ---------- */
      mainEl.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;

        if (rz) {
          startResize(e, rz);

        }
        if (e.pointerType === 'touch') return;
        const cont = e.target.closest('[data-col]');
        if (
          !cont ||
