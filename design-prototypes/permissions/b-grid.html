<div class="tip" id="tip" role="tooltip" hidden></div>
<div id="overlay-root"></div>
<div id="dialog-root" hidden></div>
<div class="toasts" id="toasts"></div>
<div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
'use strict';
/* ==========================================================================
   Script 1 — constants + mapping (UI <-> payload) + rule engine.
   Pure functions only, no DOM: the test-suite loads this script in Node.
   ========================================================================== */

/* ===== constants ===== */
const PAGES = [
  { key: 'home', label: 'الرئيسية', actions: ['view'] },
  { key: 'users', label: 'المستخدمين', actions: ['view', 'viewOwn', 'edit', 'editOwn', 'delete', 'deleteOwn', 'create', 'resetTwoFactor'] },
  { key: 'permissions', label: 'الصلاحيات', actions: ['view', 'viewOwn', 'edit', 'editOwn', 'delete', 'deleteOwn', 'create'] },
  { key: 'media', label: 'الملفات', actions: ['view', 'edit', 'editOwn', 'delete', 'deleteOwn', 'create', 'publish'] },
];
const PAGE_BY_KEY = Object.fromEntries(PAGES.map((p) => [p.key, p]));
const ACTION_LABELS = {
  view: 'عرض الكل', viewOwn: 'عرض الخاص', edit: 'تعديل الكل', editOwn: 'تعديل الخاص',
  delete: 'حذف الكل', deleteOwn: 'حذف الخاص', create: 'إنشاء',
  resetTwoFactor: 'إعادة تعيين التحقق بخطوتين', publish: 'نشر',
};
const VERB_KEYS = ['view', 'edit', 'delete', 'create', 'special'];
const VERB_LABELS = { view: 'عرض', edit: 'تعديل', delete: 'حذف', create: 'إنشاء', special: 'إجراءات خاصة' };
const PAIR = {
  view: { all: 'view', own: 'viewOwn' },
  edit: { all: 'edit', own: 'editOwn' },
  delete: { all: 'delete', own: 'deleteOwn' },
};
const SPECIAL_ACTIONS = ['resetTwoFactor', 'publish'];
const SCOPE_LABEL = ['لا شيء', 'الخاص', 'الكل'];
const SCOPE_PHRASE = ['لا شيء', 'الخاص فقط', 'الكل'];
const NAME_MAX = 100;
const DESC_MAX = 150;
const REAUTH_MS = 5 * 60 * 1000;

const MSG = {
  na: 'غير متاح لهذه الصفحة',
  locked: 'لا تملك هذه الصلاحية، فلا يمكنك منحها',
  escalation: 'لا يمكنك منح صلاحيات لا تملكها',
  ownRole: 'لا يمكنك تعديل الدور المخصص لحسابك',
  nameRequired: 'اسم الصلاحية مطلوب',
  nameTooLong: 'يجب ألا يتجاوز اسم الصلاحية 100 حرف',
  nameCustom: 'لا يمكن أن يبدأ اسم الدور بـ "custom-"',
  nameTaken: 'اسم الصلاحية موجود بالفعل، قم بتغييره',
  descTooLong: 'يجب ألا يتجاوز الوصف 150 حرفاً',
};

const PERSONAS = {
  admin: { label: 'مدير النظام', ownRole: null, denied: [] },
  moderator: {
    label: 'مشرف المحتوى', ownRole: 'r-editor',
    denied: ['media.publish', 'users.resetTwoFactor', 'permissions.delete', 'permissions.deleteOwn', 'users.delete'],
  },
};

/* ===== mapping: cells, levels, payload ===== */
// Level model: 0 none, 1 own, 2 all. Binary cells (create, specials, media/home view) use 0 and 2.
const offers = (pageKey, action) => PAGE_BY_KEY[pageKey].actions.includes(action);

function cellDef(pageKey, verb) {
  if (PAIR[verb]) {
    const { all, own } = PAIR[verb];
    if (!offers(pageKey, all)) return null;
    const scoped = offers(pageKey, own);
    return { page: pageKey, verb, kind: scoped ? 'scope' : 'bin', levels: scoped ? [0, 1, 2] : [0, 2], action: all };
  }
  if (verb === 'create') {
    return offers(pageKey, 'create') ? { page: pageKey, verb, kind: 'bin', levels: [0, 2], action: 'create' } : null;
  }
  const action = SPECIAL_ACTIONS.find((a) => offers(pageKey, a));
  return action ? { page: pageKey, verb: 'special', kind: 'bin', levels: [0, 2], action, special: true } : null;
}

function emptyPerms() {
  const perms = {};
  for (const page of PAGES) {
    perms[page.key] = {};
    for (const verb of VERB_KEYS) if (cellDef(page.key, verb)) perms[page.key][verb] = 0;
  }
  return perms;
}

const clonePerms = (perms) => JSON.parse(JSON.stringify(perms));
const permsEqual = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const levelOf = (perms, pageKey, verb) => (perms[pageKey] && perms[pageKey][verb]) || 0;

function actionAt(def, level) {
  if (def.kind === 'scope') return level === 2 ? PAIR[def.verb].all : PAIR[def.verb].own;
  return def.action;
}
const actionLabelAt = (pageKey, verb, level) => ACTION_LABELS[actionAt(cellDef(pageKey, verb), level)];

function normLevel(def, level) {
  if (def.kind === 'bin') return level > 0 ? 2 : 0;
  return Math.max(0, Math.min(2, level));
}

function toPayloadPermissions(perms) {
  return PAGES.map((page) => {
    const flags = {};
    for (const action of page.actions) flags[action] = false;
    for (const verb of VERB_KEYS) {
      const def = cellDef(page.key, verb);
      if (!def) continue;
      const level = levelOf(perms, page.key, verb);
      if (level > 0) flags[actionAt(def, level)] = true;
    }
    return { name: page.key, permissions: flags };
  });
}

function fromPayloadPermissions(list) {
  const perms = emptyPerms();
  for (const entry of Array.isArray(list) ? list : []) {
    const page = PAGE_BY_KEY[entry && entry.name];
    if (!page) continue;
    const flags = entry.permissions || {};
    for (const verb of VERB_KEYS) {
      const def = cellDef(page.key, verb);
      if (!def) continue;
      if (def.kind === 'scope') {
        if (flags[PAIR[verb].all]) perms[page.key][verb] = 2;
        else if (flags[PAIR[verb].own]) perms[page.key][verb] = 1;
      } else if (flags[def.action]) perms[page.key][verb] = 2;
    }
  }
  return perms;
}

// grants: { users: ['view','edit'] }  ->  payload permissions array
function payloadFromGrants(grants) {
  return PAGES.map((page) => {
    const flags = {};
    for (const action of page.actions) flags[action] = (grants[page.key] || []).includes(action);
    return { name: page.key, permissions: flags };
  });
}

function buildPayload({ mode, form, perms, basePerms }) {
  const body = {
    roleName: cleanText(form.name),
    description: cleanDescription(form.description),
    isActive: !!form.isActive,
  };
  if (mode === 'create' || !permsEqual(perms, basePerms)) body.permissions = toPayloadPermissions(perms);
  return body;
}

/* ===== text cleanup + validation (name / description) ===== */
const NAME_STRIP = /[^\p{L}\p{N}\s.,!?:\/\\;\-+=()\[\]'"؟،؛@#_&%]/gu;
const cleanText = (raw) => String(raw).replace(NAME_STRIP, '').replace(/\s+/g, ' ').trim();
const removedChars = (raw) => [...new Set(String(raw).match(NAME_STRIP) || [])];
const cleanDescription = (raw) => String(raw).replace(/\r\n?/g, '\n').trim();

function validateName(raw) {
  const clean = cleanText(raw);
  const removed = removedChars(raw);
  const spaces = /\s{2,}|^\s|\s$/.test(String(raw).replace(NAME_STRIP, ''));
  let error = null;
  if (!clean) error = MSG.nameRequired;
  else if (clean.length > NAME_MAX) error = MSG.nameTooLong;
  else if (clean.startsWith('custom-')) error = MSG.nameCustom;
  return { clean, length: clean.length, removed, spaces, error };
}

function validateDescription(raw) {
  const clean = cleanDescription(raw);
  return { clean, length: clean.length, error: clean.length > DESC_MAX ? MSG.descTooLong : null };
}

/* ===== persona: you can't grant what you don't hold ===== */
function holds(persona, pageKey, action) {
  return offers(pageKey, action) && !PERSONAS[persona].denied.includes(pageKey + '.' + action);
}

function canGrant(persona, pageKey, verb, level) {
  if (level <= 0) return true;
  const def = cellDef(pageKey, verb);
  if (!def) return false;
  if (def.kind === 'bin') return holds(persona, pageKey, def.action);
  const { all, own } = PAIR[verb];
  // Holding the "all" action also lets you grant the "own" one (supersession).
  return level === 2 ? holds(persona, pageKey, all) : holds(persona, pageKey, all) || holds(persona, pageKey, own);
}

function maxGrant(persona, pageKey, verb) {
  const def = cellDef(pageKey, verb);
  if (!def) return 0;
  let best = 0;
  for (const level of def.levels) if (canGrant(persona, pageKey, verb, level)) best = level;
  return best;
}

/* ===== dependencies ===== */
function requiredView(pageKey, verb, level) {
  if (level <= 0) return 0;
  if (verb === 'edit' || verb === 'delete') {
    if (level === 2) return 2;
    return cellDef(pageKey, 'view').kind === 'scope' ? 1 : 2;
  }
  if (verb === 'special' && cellDef(pageKey, 'special').action === 'publish') return 2;
  return 0;
}

// Static relations used by the dependency visualisation.
function relations(pageKey, verb) {
  const def = cellDef(pageKey, verb);
  if (!def) return { requires: [], neededBy: [] };
  if (verb === 'view') {
    return { requires: [], neededBy: ['edit', 'delete', 'special'].filter((v) => cellDef(pageKey, v) && requiredView(pageKey, v, 2) > 0) };
  }
  return { requires: requiredView(pageKey, verb, 2) > 0 ? ['view'] : [], neededBy: [] };
}

function prerequisiteText(pageKey, verb) {
  const def = cellDef(pageKey, verb);
  if (!def) return MSG.na;
  if (verb === 'create') return 'الإنشاء لا يتطلب «عرض»: يمكن إنشاء سجلات دون القدرة على رؤيتها.';
  if (verb === 'special') {
    return def.action === 'publish' ? '«نشر» يتطلب «عرض الكل».' : 'لا يتطلب أي صلاحية أخرى.';
  }
  if (verb === 'view') {
    const deps = relations(pageKey, 'view').neededBy;
    return deps.length
      ? 'التعديل والحذف' + (deps.includes('special') ? ' والنشر' : '') + ' يعتمدان على العرض؛ خفض العرض يخفضها تلقائياً.'
      : 'لا شيء يعتمد على هذا الخيار.';
  }
  return (def.kind === 'scope' ? '«الكل» يتطلب «عرض الكل»، و«الخاص» يتطلب «عرض الخاص» أو «عرض الكل».' : 'يتطلب «عرض».');
}

/* ===== setting a cell (the rule engine) ===== */
const dependentVerbs = (pageKey) => ['edit', 'delete', 'special'].filter((v) => cellDef(pageKey, v));

function reasonText(pageKey, verb, level) {
  return `«${actionLabelAt(pageKey, verb, level)}» غير متاح: ${MSG.locked}`;
}

function setCell(perms, pageKey, verb, level, persona) {
  const def = cellDef(pageKey, verb);
  if (!def) return { ok: false, changed: false, perms, notes: [], reason: MSG.na };
  const target = normLevel(def, level);
  const current = levelOf(perms, pageKey, verb);
  if (target === current) return { ok: true, changed: false, perms, notes: [] };
  if (target > current && !canGrant(persona, pageKey, verb, target)) {
    return { ok: false, changed: false, perms, notes: [], reason: reasonText(pageKey, verb, target) };
  }
  const next = clonePerms(perms);
  const page = next[pageKey];
  const pageLabel = PAGE_BY_KEY[pageKey].label;
  const notes = [];
  page[verb] = target;

  if (verb === 'view') {
    if (target < current) {
      const chunks = [];
      for (const dep of dependentVerbs(pageKey)) {
        const depDef = cellDef(pageKey, dep);
        const before = page[dep];
        if (!before || requiredView(pageKey, dep, before) <= target) continue;
        const kept = [...depDef.levels].reverse().find((l) => l < before && requiredView(pageKey, dep, l) <= target) || 0;
        page[dep] = kept;
        chunks.push(kept === 0
          ? `أُلغي «${actionLabelAt(pageKey, dep, before)}»`
          : `خُفِّض «${actionLabelAt(pageKey, dep, before)}» إلى «${actionLabelAt(pageKey, dep, kept)}»`);
      }
      if (chunks.length) {
        notes.push(`بعد تخفيض «${actionLabelAt(pageKey, 'view', current)}» في ${pageLabel} عُدِّلت الصلاحيات المعتمدة عليه: ${chunks.join('، ')}.`);
      }
    }
  } else if (target > 0) {
    const need = requiredView(pageKey, verb, target);
    const viewNow = page.view || 0;
    if (viewNow < need) {
      if (!canGrant(persona, pageKey, 'view', need)) {
        return {
          ok: false, changed: false, perms, notes: [],
          reason: `تعذّر منح «${actionLabelAt(pageKey, verb, target)}» لأنه يتطلب «${actionLabelAt(pageKey, 'view', need)}» وهو غير متاح لك`,
        };
      }
      page.view = need;
      const cause = {
        edit: target === 2 ? 'التعديل على الكل' : 'تعديل الخاص',
        delete: target === 2 ? 'الحذف على الكل' : 'حذف الخاص',
        special: 'النشر',
      }[verb];
      notes.push(`فُعِّل «${actionLabelAt(pageKey, 'view', need)}» لأن ${cause} يتطلبه — ${pageLabel}`);
    }
  }
  return { ok: true, changed: true, perms: next, notes };
}

// Next level when cycling; skips levels the persona can't grant. Returns null when stuck.
function cycleLevel(def, current, dir, persona) {
  const order = def.levels;
  const start = order.indexOf(current);
  for (let step = 1; step < order.length; step += 1) {
    const level = order[(((start + dir * step) % order.length) + order.length) % order.length];
    if (level < current || canGrant(persona, def.page, def.verb, level)) return level;
  }
  return null;
}

/* ===== counts + tri-state ===== */
function cellsOfPage(pageKey) {
  return VERB_KEYS.filter((v) => cellDef(pageKey, v));
}
// Progress is counted in verbs: "view all" is one, however many actions it maps to.
const verbTotal = (pageKey) => cellsOfPage(pageKey).length;
const verbCount = (pageKey, perms) => cellsOfPage(pageKey).filter((v) => levelOf(perms, pageKey, v) > 0).length;

function groupState(cells, perms, persona) {
  let any = false;
  let allAtMax = true;
  for (const { page, verb } of cells) {
    const level = levelOf(perms, page, verb);
    if (level > 0) any = true;
    if (level < maxGrant(persona, page, verb)) allAtMax = false;
  }
  if (!any) return 'none';
  return allAtMax ? 'all' : 'mixed';
}
const rowState = (perms, pageKey, persona) =>
  groupState(cellsOfPage(pageKey).map((verb) => ({ page: pageKey, verb })), perms, persona);
const columnState = (perms, verb, persona) =>
  groupState(PAGES.filter((p) => cellDef(p.key, verb)).map((p) => ({ page: p.key, verb })), perms, persona);

const countCellDiffs = (a, b) => {
  let n = 0;
  for (const page of PAGES) for (const verb of cellsOfPage(page.key)) if (levelOf(a, page.key, verb) !== levelOf(b, page.key, verb)) n += 1;
  return n;
};

/* ===== bulk operations (row + column shortcuts) ===== */
function applyRow(perms, pageKey, mode, persona) {
  let next = perms;
  const verbs = cellsOfPage(pageKey);
  const skipped = [];
  if (mode === 'grant') {
    for (const verb of verbs) {
      const target = maxGrant(persona, pageKey, verb);
      if (target > levelOf(next, pageKey, verb)) next = setCell(next, pageKey, verb, target, persona).perms;
      if (target < 2 && levelOf(next, pageKey, verb) < 2) skipped.push(actionLabelAt(pageKey, verb, 2));
    }
  } else {
    for (const verb of [...verbs].reverse()) next = setCell(next, pageKey, verb, 0, persona).perms;
  }
  const changedCells = countCellDiffs(perms, next);
  const pageLabel = PAGE_BY_KEY[pageKey].label;
  const notes = [];
  if (changedCells > 0) {
    notes.push(mode === 'grant'
      ? `منح الكل في «${pageLabel}»: تغيّر ${changedCells} من الخيارات.`
      : `إزالة الكل من «${pageLabel}»: أُزيل ${changedCells} من الخيارات.`);
  }
  if (skipped.length && mode === 'grant') notes.push(`لم يُمنح لأنك لا تملكه: ${skipped.join('، ')}.`);
  return { perms: next, notes, changed: changedCells > 0 };
}

function applyColumn(perms, verb, level, persona) {
  let next = perms;
  const extra = [];
  const skipped = [];
  for (const page of PAGES) {
    const def = cellDef(page.key, verb);
    if (!def) continue;
    const current = levelOf(next, page.key, verb);
    if (def.kind === 'bin' && level === 1) {
      extra.push(`تخطّي «${page.label}»: لا يوجد فيها نطاق «الخاص».`);
      continue;
    }
    if (level > current) {
      const allowed = Math.min(level, maxGrant(persona, page.key, verb));
      if (allowed < level) skipped.push(`${page.label} («${actionLabelAt(page.key, verb, level)}»)`);
      if (allowed > current) next = setCell(next, page.key, verb, allowed, persona).perms;
    } else if (level < current) {
      const res = setCell(next, page.key, verb, level, persona);
      next = res.perms;
      extra.push(...res.notes);
    }
  }
  const changed = countCellDiffs(perms, next);
  const notes = [];
  if (changed) {
    notes.push(`تطبيق «${VERB_LABELS[verb]}: ${verb === 'create' || verb === 'special' ? (level ? 'منح' : 'إزالة') : SCOPE_LABEL[level]}» على كل الصفحات: تغيّرت ${changed} خلايا.`);
    notes.push(...extra);
  } else if (extra.length) notes.push(...extra);
  if (skipped.length) notes.push(`لم يُمنح لأنك لا تملكه: ${skipped.join('، ')}.`);
  return { perms: next, notes, changed: changed > 0 };
}

/* ===== plain-language summary (one sentence per page) ===== */
const SUMMARY_TEXT = {
  users: { noun: 'المستخدمين', pron: 'هم', own: 'ما أنشأه', create: 'يُنشئ مستخدمين جدداً', special: 'يعيد تعيين التحقق بخطوتين' },
  permissions: { noun: 'الصلاحيات', pron: 'ها', own: 'ما أنشأه', create: 'يُنشئ صلاحيات جديدة' },
  media: { noun: 'الملفات', pron: 'ها', own: 'ما رفعه', create: 'يرفع ملفات جديدة', special: 'ينشر الملفات' },
};
const VERB_PRESENT = { view: 'يعرض', edit: 'يعدّل', delete: 'يحذف', create: 'يُنشئ' };
const EMPTY_PAGE_TEXT = 'لا يملك أي صلاحية على هذه الصفحة';

function summarizePage(pageKey, pp) {
  if (pageKey === 'home') return pp.view ? 'يعرض الرئيسية' : EMPTY_PAGE_TEXT;
  const t = SUMMARY_TEXT[pageKey];
  const all = [];
  const own = [];
  for (const verb of ['view', 'edit', 'delete']) {
    if (pp[verb] === 2) all.push(verb);
    else if (pp[verb] === 1) own.push(verb);
  }
  const pieces = [];
  let createDone = false;
  if (all.length) {
    let text = pageKey === 'media' && all[0] === 'view' ? 'يعرض الملفات' : `${VERB_PRESENT[all[0]]} كل ${t.noun}`;
    for (const verb of all.slice(1)) text += ` و${VERB_PRESENT[verb]}${t.pron}`;
    if (pp.create && pageKey !== 'media') { text += ` ويُنشئ${t.pron}`; createDone = true; }
    pieces.push(text);
  }
  if (pp.create && !createDone) pieces.push(t.create);
  if (own.length) {
    const verbs = own.map((v, i) => (i ? 'و' : '') + VERB_PRESENT[v]).join(' ');
    pieces.push(`${verbs} ${t.own}${all.length ? '' : ' من ' + t.noun} فقط`);
  }
  if (pp.special && t.special) pieces.push(t.special);
  if (!pieces.length) return EMPTY_PAGE_TEXT;
  let text = pieces.map((p, i) => (i ? 'و' : '') + p).join('، ');
  // Create needs no view, so say when a role can create things it can't see.
  if (pp.create && !pp.view) text += `، دون أن يعرض ${t.noun}`;
  else if (cellDef(pageKey, 'delete') && !pp.delete) text += '، دون حذف';
  return text;
}

/* ===== mock server rules (shared so the tests can call them) ===== */
function escalationOffenders(persona, nextPayloadPerms, storedPayloadPerms) {
  const out = [];
  for (const entry of nextPayloadPerms) {
    const stored = (storedPayloadPerms || []).find((e) => e.name === entry.name);
    for (const [action, on] of Object.entries(entry.permissions)) {
      if (!on || (stored && stored.permissions[action])) continue;
      const own = action.endsWith('Own');
      const base = own ? action.slice(0, -3) : action;
      const allowed = own ? holds(persona, entry.name, base) || holds(persona, entry.name, action) : holds(persona, entry.name, action);
      if (!allowed) out.push({ page: entry.name, action });
    }
  }
  return out;
}

const actionToVerb = (action) => (SPECIAL_ACTIONS.includes(action) ? 'special' : action.replace(/Own$/, ''));

if (typeof module === 'object' && module.exports) {
  module.exports = {
    PAGES, ACTION_LABELS, VERB_KEYS, PERSONAS, MSG, NAME_MAX, DESC_MAX, REAUTH_MS,
    cellDef, emptyPerms, clonePerms, permsEqual, levelOf, toPayloadPermissions, fromPayloadPermissions,
    payloadFromGrants, buildPayload, cleanText, removedChars, cleanDescription, validateName, validateDescription,
    holds, canGrant, maxGrant, requiredView, relations, setCell, cycleLevel, verbCount, verbTotal,
    rowState, columnState, applyRow, applyColumn, summarizePage, EMPTY_PAGE_TEXT, escalationOffenders,
    actionToVerb, prerequisiteText, countCellDiffs, actionLabelAt,
  };
}
</script>
<script>
'use strict';
/* ==========================================================================
   Script 2 — mock api, state, render, interactions.
   Depends on the pure core above (same global scope).
   The product UI is only the permissions matrix. Everything else on the page
   (mode, persona, name field, save, payload) is a dev control in the dev bar.
   ========================================================================== */

/* ===== mock api (in memory) ===== */
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const TIMING = { load: 500, save: 650, reauth: 350 };
const jsonClone = (v) => JSON.parse(JSON.stringify(v));

const db = {
  roles: [
    {
      id: 'r-editor', roleName: 'محرر', description: 'عرض وتعديل المستخدمين دون حذفهم، ورفع الملفات وإدارة ما رفعه',
      isActive: true, usersCount: 4,
      permissions: payloadFromGrants({ home: ['view'], users: ['view', 'edit', 'create'], media: ['view', 'create', 'editOwn', 'deleteOwn'] }),
    },
    {
      id: 'r-viewer', roleName: 'مشاهد', description: 'عرض فقط', isActive: false, usersCount: 2,
      permissions: payloadFromGrants({ home: ['view'], users: ['view'], permissions: ['view'], media: ['view'] }),
    },
  ],
  nextId: 3,
};

const api = {
  failNextLoad: false,
  reauthUntil: 0,
  log: [],
  async getRole(id) {
    await sleep(TIMING.load);
    if (api.failNextLoad) {
      api.failNextLoad = false;
      throw { status: 500, code: 'LOAD_FAILED' };
    }
    const role = db.roles.find((r) => r.id === id);
    if (!role) throw { status: 404, code: 'NOT_FOUND' };
    return jsonClone(role);
  },
  async reauth(password) {
    await sleep(TIMING.reauth);
    if (!String(password).trim()) throw { status: 400, code: 'PASSWORD_REQUIRED', message: 'كلمة المرور مطلوبة' };
    api.reauthUntil = Date.now() + REAUTH_MS;
  },
  async saveRole(id, body, persona) {
    await sleep(TIMING.save);
    api.log.push({ id, body: jsonClone(body), persona });
    if (Date.now() > api.reauthUntil) throw { status: 401, code: 'REAUTH_REQUIRED' };
    const stored = id ? db.roles.find((r) => r.id === id) : null;
    if (id && !stored) throw { status: 404, code: 'NOT_FOUND' };
    if (id && PERSONAS[persona].ownRole === id) throw { status: 403, code: 'OWN_ROLE', message: MSG.ownRole };
    const nameCheck = validateName(body.roleName);
    if (nameCheck.error) throw { status: 400, code: 'VALIDATION', field: 'roleName', message: nameCheck.error };
    const descCheck = validateDescription(body.description || '');
    if (descCheck.error) throw { status: 400, code: 'VALIDATION', field: 'description', message: descCheck.error };
    if (body.permissions) {
      const offenders = escalationOffenders(persona, body.permissions, stored && stored.permissions);
      if (offenders.length) throw { status: 403, code: 'ESCALATION', message: MSG.escalation, offenders };
    }
    if (db.roles.some((r) => r.id !== id && r.roleName === nameCheck.clean)) {
      throw { status: 409, code: 'NAME_TAKEN', field: 'roleName', message: MSG.nameTaken };
    }
    if (stored) {
      Object.assign(stored, { roleName: nameCheck.clean, description: descCheck.clean, isActive: body.isActive });
      if (body.permissions) stored.permissions = jsonClone(body.permissions);
      return jsonClone(stored);
    }
    const created = {
      id: 'r-' + db.nextId++, roleName: nameCheck.clean, description: descCheck.clean, isActive: body.isActive,
      usersCount: 0, permissions: jsonClone(body.permissions),
    };
    db.roles.push(created);
    return jsonClone(created);
  },
};

/* ===== state ===== */
const S = {
  mode: 'create', roleId: null, status: 'ready', persona: 'admin',
  form: { name: '', description: '', isActive: true }, base: null,
  perms: emptyPerms(), basePerms: emptyPerms(),
  history: [], seq: 0,
  errors: { name: null, form: null, cells: {} },
  saving: false, readOnly: false,
  showPayload: true, summaryOn: false, loadToken: 0, stacked: false,
  active: { hover: null, focus: null },
};
const stats = { cellWrites: 0, rowWrites: 0, headWrites: 0, sumWrites: 0, renders: 0 };
const SUMMARY_KEY = 'perm-b-summary';

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const el = {
  editor: $('#editor'), grid: $('#grid'), gridwrap: $('#gridwrap'), links: $('#links'),
  roBanner: $('#ro-banner'), sumSwitch: $('#sum-switch'),
  payloadCard: $('#payload'), payloadPre: $('#payload-pre'), payloadMethod: $('#payload-method'),
  devModes: $('#dev-modes'), devPersona: $('#dev-persona'), devName: $('#dev-name'), devNameMsg: $('#dev-name-msg'), devMsg: $('#dev-msg'),
  devSave: $('#dev-save'), devSaveText: $('#dev-save-text'),
  tip: $('#tip'), toasts: $('#toasts'), live: $('#live'), dialogRoot: $('#dialog-root'), overlay: $('#overlay-root'),
};

const isEdit = () => S.mode === 'edit';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (id, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

function setText(node, text) { if (node.textContent !== text) node.textContent = text; }
function setHtml(node, html) { if (node.__html !== html) { node.innerHTML = html; node.__html = html; } }
function setAttr(node, name, value) {
  if (value === null || value === undefined || value === false) { if (node.hasAttribute(name)) node.removeAttribute(name); } else if (node.getAttribute(name) !== String(value)) node.setAttribute(name, value);
}

const pageLabel = (key) => PAGE_BY_KEY[key].label;
const VERB_ICON = { view: 'eye', edit: 'pencil', delete: 'trash', create: 'plus', special: 'sparkles' };
const cellKey = (pageKey, verb) => pageKey + '.' + verb;

function isDirty() {
  const baseForm = S.base || { roleName: '' };
  return cleanText(S.form.name) !== baseForm.roleName || !permsEqual(S.perms, S.basePerms);
}

/* ===== announcements + toasts ===== */
let liveFlip = false;
function announce(text) {
  liveFlip = !liveFlip;
  el.live.textContent = text + (liveFlip ? ' ' : '');
}

function toast(text, kind = 'ok', opts = {}) {
  const lines = Array.isArray(text) ? text : [text];
  const node = document.createElement('div');
  node.className = `toast ${kind}`;
  if (opts.undoId) node.dataset.undoId = String(opts.undoId);
  node.innerHTML = `${icon(kind === 'bad' ? 'alert' : kind === 'info' ? 'info' : 'success', 'ti')}<div class="tx">${lines.map((l) => `<span>${esc(l)}</span>`).join('')}</div>`
    + (opts.undoId ? `<button type="button" class="act" data-undo="${opts.undoId}">تراجع</button>` : '');
  el.toasts.appendChild(node);
  while (el.toasts.children.length > 3) el.toasts.firstChild.remove();
  announce(lines.join(' '));
  setTimeout(() => node.remove(), opts.duration || (opts.undoId ? 6000 : 3600));
}

/* ===== grid: build once, patch what changed ===== */
const cellEls = {};
const rowEls = {};
const headEls = {};

function buildGrid() {
  const head = VERB_KEYS.map((verb) => `
    <div class="cell" role="columnheader" data-c-verb="${verb}">
      <div class="hhead">
        <button type="button" class="htri" role="checkbox" aria-checked="false" data-nav data-kind="colhead" data-verb="${verb}" tabindex="-1">
          <span class="tri" data-state="none">${icon('check', 't-all')}${icon('minus', 't-mixed')}</span>
        </button>
        <span class="htitle">${icon(VERB_ICON[verb], 'sm')}<span>${VERB_LABELS[verb]}</span></span>
        <button type="button" class="hmenu" data-hmenu data-verb="${verb}" tabindex="-1" aria-haspopup="menu" aria-expanded="false" aria-label="خيارات تطبيق «${VERB_LABELS[verb]}» على كل الصفحات">${icon('chev', 'sm')}</button>
      </div>
    </div>`).join('');
  let html = `<div class="row head" role="row"><div class="cell corner" role="columnheader">الصفحة</div>${head}</div>`;
  for (const page of PAGES) {
    const cells = VERB_KEYS.map((verb) => {
      const def = cellDef(page.key, verb);
      if (!def) {
        const label = `${VERB_LABELS[verb]} ${page.label}: ${MSG.na}`;
        return `<div class="cell na" role="gridcell" aria-disabled="true" data-page="${page.key}" data-verb="${verb}"><span class="na-mark" data-nav data-kind="na" role="img" tabindex="-1" aria-label="${label}" data-tip="${MSG.na}">—</span></div>`;
      }
      const cls = def.kind === 'scope' ? 'chip' : 'chip bin';
      const more = def.kind === 'scope'
        ? `<button type="button" class="more" data-more tabindex="-1" aria-hidden="true">${icon('chev', 'sm')}</button>` : '';
      return `<div class="cell ${def.special ? 'special' : ''}" role="gridcell" data-page="${page.key}" data-verb="${verb}">
        <span class="cell-label">${VERB_LABELS[verb]}</span>
        <div class="chipbox ${more ? 'has-more' : ''}">
          <button type="button" class="${cls}" data-nav data-kind="cell" tabindex="-1">
            <span class="pips" aria-hidden="true"><i></i><i></i></span>${icon('check', 'sm tick')}<span class="ctext"></span>${icon('lock', 'sm lk')}${icon('info', 'sm nb')}
          </button>${more}
        </div></div>`;
    }).join('');
    html += `<div class="row body" role="row" data-page="${page.key}">
      <div class="cell rowhead" role="rowheader">
        <div class="rh-top">
          <button type="button" class="rcheck" role="checkbox" aria-checked="false" data-nav data-kind="rowcheck" data-page="${page.key}" tabindex="-1">
            <span class="tri" data-state="none">${icon('check', 't-all')}${icon('minus', 't-mixed')}</span>
          </button>
          <span class="pname"><span>${page.label}</span></span>
        </div>
      </div>${cells}
      <div class="cell rsum" role="gridcell" aria-colspan="5"><span class="rsum-text"></span></div></div>`;
  }
  el.grid.innerHTML = html;
  for (const page of PAGES) {
    const row = $(`.row.body[data-page="${page.key}"]`, el.grid);
    rowEls[page.key] = {
      row, check: $('.rcheck', row), tri: $('.tri', row),
      sum: $('.rsum-text', row), sig: '', sumSig: '',
    };
    for (const verb of VERB_KEYS) {
      const cell = $(`.cell[data-verb="${verb}"]`, row);
      cellEls[cellKey(page.key, verb)] = { cell, nav: $('[data-nav]', cell), text: $('.ctext', cell), sig: '' };
    }
  }
  for (const verb of VERB_KEYS) {
    const button = $(`.htri[data-verb="${verb}"]`, el.grid);
    headEls[verb] = { button, tri: $('.tri', button), menu: $(`.hmenu[data-verb="${verb}"]`, el.grid), sig: '' };
  }
  cellEls['home.view'].nav.tabIndex = 0;
}

function lockText(maxG) {
  return maxG === 0 ? MSG.locked : `خيار «الكل» مقفل: ${MSG.locked}`;
}

function cellAria(def, level) {
  const page = pageLabel(def.page);
  if (def.special) return `${ACTION_LABELS[def.action]} — ${page}: ${level ? 'مفعّل' : 'غير مفعّل'}`;
  return `${VERB_LABELS[def.verb]} ${page}: ${def.kind === 'scope' ? SCOPE_PHRASE[level] : (level ? 'مسموح' : 'لا شيء')}`;
}

function patchCell(pageKey, verb) {
  const ref = cellEls[cellKey(pageKey, verb)];
  const def = cellDef(pageKey, verb);
  if (!def) return;
  const level = levelOf(S.perms, pageKey, verb);
  const maxG = maxGrant(S.persona, pageKey, verb);
  const err = S.errors.cells[cellKey(pageKey, verb)] || '';
  const warnCreate = verb === 'create' && level > 0 && levelOf(S.perms, pageKey, 'view') === 0;
  const stuck = S.readOnly || cycleLevel(def, level, 1, S.persona) === null;
  const sig = [level, maxG, err ? 1 : 0, warnCreate ? 1 : 0, stuck ? 1 : 0, S.readOnly ? 1 : 0].join('|');
  if (ref.sig === sig) return;
  ref.sig = sig;
  stats.cellWrites += 1;
  const chip = ref.nav;
  chip.className = `chip${def.kind === 'bin' ? ' bin' : ''} lvl-${level}${maxG < 2 ? ' locked' : ''}${stuck ? ' nope' : ''}${S.readOnly ? ' ro' : ''}${warnCreate ? ' warncreate' : ''}`;
  let text = def.special ? ACTION_LABELS[def.action] : def.kind === 'scope' ? SCOPE_LABEL[level] : (level ? 'مسموح' : 'لا شيء');
  if (def.special && def.action === 'publish') text = 'نشر';
  setText(ref.text, text);
  let aria = cellAria(def, level);
  const reasons = [];
  if (S.readOnly) reasons.push(MSG.ownRole);
  if (maxG < 2) reasons.push(lockText(maxG));
  if (reasons.length) aria += `، ${reasons.join('، ')}`;
  if (err) aria += `، خطأ: ${err}`;
  const prereq = prerequisiteText(pageKey, verb);
  setAttr(chip, 'aria-label', aria);
  setAttr(chip, 'aria-description', prereq);
  setAttr(chip, 'aria-disabled', stuck ? 'true' : null);
  setAttr(chip, 'data-tip', err || [...reasons, prereq].join(' — '));
  ref.cell.classList.toggle('err', !!err);
  if (tipTarget === chip) showTip(chip);
}

function rowTip(pageKey) {
  const state = rowState(S.perms, pageKey, S.persona);
  const label = pageLabel(pageKey);
  if (state === 'all') return `إزالة الكل من «${label}»`;
  if (state === 'mixed') return `منح الكل في «${label}»: إكمال ما تبقّى (ما تملكه فقط)`;
  return `منح الكل في «${label}» (ما تملكه فقط)`;
}

function patchRow(pageKey) {
  const ref = rowEls[pageKey];
  const count = verbCount(pageKey, S.perms);
  const total = verbTotal(pageKey);
  const state = rowState(S.perms, pageKey, S.persona);
  const tip = rowTip(pageKey);
  const sig = [count, state, tip, S.readOnly ? 1 : 0].join('|');
  if (ref.sig !== sig) {
    ref.sig = sig;
    stats.rowWrites += 1;
    ref.tri.dataset.state = state;
    setAttr(ref.check, 'aria-checked', state === 'all' ? 'true' : state === 'mixed' ? 'mixed' : 'false');
    setAttr(ref.check, 'aria-label', `${pageLabel(pageKey)}: ${tip}. الحالة: ${count} من ${total}`);
    setAttr(ref.check, 'data-tip', tip);
    if (tipTarget === ref.check) showTip(ref.check);
    setAttr(ref.check, 'aria-disabled', S.readOnly ? 'true' : null);
  }
  const sentence = summarizePage(pageKey, S.perms[pageKey]);
  if (ref.sumSig !== sentence) {
    ref.sumSig = sentence;
    stats.sumWrites += 1;
    setText(ref.sum, sentence);
  }
}

function patchHead(verb) {
  const ref = headEls[verb];
  const state = columnState(S.perms, verb, S.persona);
  const sig = state + (S.readOnly ? 'r' : '');
  if (ref.sig === sig) return;
  ref.sig = sig;
  stats.headWrites += 1;
  ref.tri.dataset.state = state;
  const names = { none: 'لا شيء', mixed: 'جزئي', all: 'مكتمل' };
  const action = state === 'all' ? 'إزالة الكل' : 'منح الكل';
  setAttr(ref.button, 'aria-checked', state === 'all' ? 'true' : state === 'mixed' ? 'mixed' : 'false');
  setAttr(ref.button, 'aria-label', `${VERB_LABELS[verb]}: ${action} في كل الصفحات. الحالة: ${names[state]}`);
  setAttr(ref.button, 'aria-description', 'للخيارات: Alt+السهم لأسفل');
  setAttr(ref.button, 'data-tip', `${action}: «${VERB_LABELS[verb]}» في كل الصفحات التي تدعمه — للخيارات اضغط السهم الصغير`);
  setAttr(ref.button, 'aria-disabled', S.readOnly ? 'true' : null);
  if (tipTarget === ref.button) showTip(ref.button);
}

function patchGrid() {
  for (const page of PAGES) {
    for (const verb of VERB_KEYS) patchCell(page.key, verb);
    patchRow(page.key);
  }
  for (const verb of VERB_KEYS) patchHead(verb);
}

/* ===== render: panels ===== */
function renderPayload() {
  el.payloadCard.hidden = !S.showPayload;
  if (!S.showPayload) return;
  const body = buildPayload({ mode: S.mode, form: S.form, perms: S.perms, basePerms: S.basePerms });
  setText(el.payloadPre, JSON.stringify(body, null, 2));
  setText(el.payloadMethod, isEdit() ? `PATCH /roles/${S.roleId}` : 'POST /roles');
}

function renderDevSave() {
  setAttr(el.devSave, 'aria-disabled', S.saving || S.readOnly || S.status !== 'ready' ? 'true' : null);
  setAttr(el.devSave, 'aria-busy', S.saving ? 'true' : null);
  setText(el.devSaveText, S.saving ? 'جارٍ الحفظ…' : isEdit() ? 'حفظ التغييرات (تجريبي)' : 'إنشاء (تجريبي)');
  const use = el.devSave.querySelector('svg use');
  use.setAttribute('href', S.saving ? '#i-loader' : '#i-save');
  el.devSave.querySelector('svg').classList.toggle('spin', S.saving);
  el.devName.disabled = S.saving;
  setText(el.devNameMsg, S.errors.name || '');
  setAttr(el.devName, 'aria-invalid', S.errors.name ? 'true' : null);
  setText(el.devMsg, S.errors.form || '');
  el.devMsg.classList.toggle('err', !!S.errors.form);
}

function renderShell() {
  el.editor.dataset.status = S.status;
  el.editor.dataset.mode = S.mode;
  el.roBanner.hidden = !S.readOnly;
}

function renderSummarySwitch() {
  setAttr(el.sumSwitch, 'aria-checked', S.summaryOn ? 'true' : 'false');
  el.grid.dataset.summary = S.summaryOn ? 'on' : 'off';
}

function renderPerms() {
  stats.renders += 1;
  patchGrid();
  renderPayload();
  renderDevSave();
  refreshLinks();
}

function renderAll() {
  renderShell();
  renderSummarySwitch();
  renderPerms();
  renderDev();
}

function modeOptions() {
  return [{ id: 'create', label: 'إنشاء' }, ...db.roles.map((r) => ({ id: 'edit:' + r.id, label: 'تعديل: ' + r.roleName }))];
}
const currentModeId = () => (isEdit() ? 'edit:' + S.roleId : 'create');

function renderDev() {
  const current = currentModeId();
  setHtml(el.devModes, modeOptions().map((m) => `<button type="button" data-mode="${esc(m.id)}" aria-pressed="${m.id === current}">${esc(m.label)}</button>`).join(''));
  el.devPersona.value = S.persona;
  if (el.devName.value !== S.form.name) el.devName.value = S.form.name;
}

/* ===== overlays: tooltip, menu, dialog, shortcuts ===== */
let tipTarget = null;
function showTip(target) {
  const text = target.getAttribute('data-tip');
  if (!text) { hideTip(); return; }
  tipTarget = target;
  el.tip.textContent = text;
  el.tip.hidden = false;
  const r = target.getBoundingClientRect();
  const tw = el.tip.offsetWidth;
  let left = r.left + r.width / 2 - tw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
  let top = r.bottom + 8;
  if (top + el.tip.offsetHeight > window.innerHeight - 8) top = r.top - el.tip.offsetHeight - 8;
  el.tip.style.left = left + 'px';
  el.tip.style.top = Math.max(8, top) + 'px';
}
function hideTip() { tipTarget = null; el.tip.hidden = true; }

let menu = null;
function closeMenu(restore = true) {
  if (!menu) return;
  const { node, anchor, returnFocus, hadExpanded } = menu;
  document.removeEventListener('pointerdown', menu.outside, true);
  node.remove();
  setAttr(anchor, 'aria-expanded', hadExpanded ? 'false' : null);
  menu = null;
  const back = returnFocus || anchor;
  if (restore && back.isConnected) back.focus();
}

function openMenu(anchor, { title, items, onPick, returnFocus }) {
  closeMenu(false);
  const node = document.createElement('div');
  node.className = 'menu';
  node.setAttribute('role', 'menu');
  node.setAttribute('aria-label', title);
  node.innerHTML = `<div class="mt" aria-hidden="true">${esc(title)}</div>` + items.map((it, i) => `
    <button type="button" class="mi" role="menuitemradio" data-i="${i}" aria-checked="${!!it.checked}" ${it.disabled ? 'aria-disabled="true"' : ''}>
      <span class="mk">${it.checked ? icon('check', 'sm') : ''}</span>
      <span class="mb"><span>${esc(it.label)}</span>${it.desc ? `<span class="md">${esc(it.desc)}</span>` : ''}</span>
      ${it.disabled ? icon('lock', 'sm lkk') : ''}
    </button>`).join('');
  el.overlay.appendChild(node);
  const r = anchor.getBoundingClientRect();
  const w = node.offsetWidth;
  let left = r.right - w;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = r.bottom + 6;
  if (top + node.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - node.offsetHeight - 6);
  node.style.left = left + 'px';
  node.style.top = top + 'px';
  const hadExpanded = anchor.hasAttribute('aria-expanded');
  setAttr(anchor, 'aria-expanded', 'true');
  const buttons = $$('.mi', node);
  const pick = (index) => {
    const it = items[index];
    if (it.disabled) { toast(it.reason || MSG.locked, 'bad'); return; }
    closeMenu(true);
    onPick(it.value);
  };
  node.addEventListener('click', (e) => { const b = e.target.closest('.mi'); if (b) pick(Number(b.dataset.i)); });
  node.addEventListener('keydown', (e) => {
    const idx = buttons.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); buttons[(idx + 1) % buttons.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); buttons[(idx - 1 + buttons.length) % buttons.length].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); buttons[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); buttons[buttons.length - 1].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === 'Tab') { e.preventDefault(); closeMenu(true); }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (idx >= 0) pick(idx); }
  });
  const outside = (e) => { if (!node.contains(e.target) && !anchor.contains(e.target)) closeMenu(false); };
  document.addEventListener('pointerdown', outside, true);
  menu = { node, anchor, outside, hadExpanded, returnFocus };
  (buttons.find((b, i) => items[i].checked) || buttons[0]).focus();
}

let shortcutsNode = null;
function toggleShortcuts(force) {
  const open = force === undefined ? !shortcutsNode : force;
  const btn = $('#btn-help');
  if (!open) {
    if (shortcutsNode) { shortcutsNode.remove(); shortcutsNode = null; }
    setAttr(btn, 'aria-expanded', 'false');
    return;
  }
  if (shortcutsNode) return;
  const node = document.createElement('div');
  node.className = 'shortcuts';
  node.setAttribute('role', 'dialog');
  node.setAttribute('aria-label', 'اختصارات لوحة المفاتيح');
  node.innerHTML = `<h3><span>اختصارات لوحة المفاتيح</span><button type="button" class="kbtn" data-close aria-label="إغلاق">${icon('x', 'sm')}</button></h3>
    <dl>
      <dt><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd></dt><dd>التنقل بين الخلايا (← للعمود التالي و→ للسابق في العربية)</dd>
      <dt><kbd>Home</kbd><kbd>End</kbd></dt><dd>أول الصف / آخره</dd>
      <dt><kbd>Space</kbd><kbd>Enter</kbd></dt><dd>الخيار التالي: لا شيء ← الخاص ← الكل (وعلى رأس العمود: منح الكل / إزالة الكل)</dd>
      <dt><kbd>Shift</kbd>+<kbd>Space</kbd></dt><dd>الخيار السابق (أو النقر الأيمن / Shift + نقرة)</dd>
      <dt><kbd>0</kbd><kbd>1</kbd><kbd>2</kbd></dt><dd>لا شيء / الخاص / الكل مباشرة</dd>
      <dt><kbd>Alt</kbd>+<kbd>↓</kbd></dt><dd>فتح قائمة الخيارات للخلية أو للعمود</dd>
      <dt><kbd>Ctrl</kbd>+<kbd>Z</kbd></dt><dd>التراجع عن آخر تغيير في الجدول</dd>
      <dt><kbd>?</kbd></dt><dd>إظهار / إخفاء هذه القائمة</dd>
    </dl>`;
  el.overlay.appendChild(node);
  const r = btn.getBoundingClientRect();
  const w = node.offsetWidth;
  node.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  node.style.top = Math.min(r.bottom + 8, Math.max(8, window.innerHeight - node.offsetHeight - 8)) + 'px';
  shortcutsNode = node;
  setAttr(btn, 'aria-expanded', 'true');
  node.querySelector('[data-close]').addEventListener('click', () => { toggleShortcuts(false); btn.focus(); });
  node.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); toggleShortcuts(false); btn.focus(); } });
  node.querySelector('[data-close]').focus();
}

let dialogOpen = false;
function openDialog({ title, body, actions, field, titleIcon }) {
  return new Promise((resolve) => {
    dialogOpen = true;
    const root = el.dialogRoot;
    const prev = document.activeElement;
    root.hidden = false;
    root.innerHTML = `<div class="scrim"></div>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-body">
        <h2 id="dlg-title">${titleIcon ? icon(titleIcon) : ''}${esc(title)}</h2>
        <p id="dlg-body">${body}</p>
        ${field ? `<div class="field"><label class="lrow" for="dlg-field"><span>${esc(field.label)}</span></label><input class="inl" id="dlg-field" type="password" autocomplete="current-password" aria-describedby="dlg-err"><div class="msg" id="dlg-err" role="alert"></div></div>` : ''}
        <div class="dlg-actions">${actions.map((a, i) => `<button type="button" class="btn ${a.kind || ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>
      </div>`;
    const dialog = $('.dialog', root);
    const input = $('#dlg-field', root);
    const errBox = $('#dlg-err', root);
    const buttons = $$('.dlg-actions .btn', root);
    let busy = false;
    const finish = (result) => {
      dialogOpen = false;
      root.hidden = true;
      root.innerHTML = '';
      document.removeEventListener('keydown', onKey, true);
      if (prev && prev.isConnected) prev.focus();
      resolve(result);
    };
    const run = async (index) => {
      if (busy) return;
      const action = actions[index];
      if (!action.confirm) { finish({ action: action.id, text: '' }); return; }
      if (field) {
        const text = input.value;
        if (!text.trim()) { setText(errBox, 'كلمة المرور مطلوبة'); input.setAttribute('aria-invalid', 'true'); input.focus(); return; }
        busy = true;
        buttons.forEach((b) => { b.disabled = true; });
        try { await field.submit(text); } catch (e) {
          busy = false;
          buttons.forEach((b) => { b.disabled = false; });
          setText(errBox, (e && e.message) || 'تعذّر التأكيد');
          input.focus();
          return;
        }
      }
      finish({ action: action.id, text: input ? input.value : '' });
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (!busy) finish({ action: 'cancel', text: '' }); return; }
      if (e.key === 'Enter' && input && e.target === input) { e.preventDefault(); run(actions.findIndex((a) => a.confirm)); return; }
      if (e.key === 'Tab') {
        const focusables = $$('button, input', dialog).filter((n) => !n.disabled);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    buttons.forEach((b) => b.addEventListener('click', () => run(Number(b.dataset.i))));
    if (input) input.addEventListener('input', () => { setText(errBox, ''); input.removeAttribute('aria-invalid'); });
    (input || buttons[actions.findIndex((a) => a.initial)] || buttons[0]).focus();
  });
}

async function confirmDialog({ title, body, confirmLabel, kind = 'primary', cancelLabel = 'رجوع', titleIcon = 'alert' }) {
  const res = await openDialog({
    title, body, titleIcon,
    actions: [{ id: 'cancel', label: cancelLabel, initial: true }, { id: 'ok', label: confirmLabel, kind, confirm: true }],
  });
  return res.action === 'ok';
}

const confirmDiscard = async () => !isDirty() || confirmDialog({
  title: 'تجاهل التغييرات؟',
  body: 'لديك تغييرات غير محفوظة وستضيع إن تابعت.',
  confirmLabel: 'تجاهل التغييرات', kind: 'danger', cancelLabel: 'متابعة التعديل',
});

/* ===== dependency links ===== */
function clearLinkMarks() {
  $$('.cell.is-self, .cell.is-prereq, .cell.is-needed', el.grid).forEach((c) => {
    c.classList.remove('is-self', 'is-prereq', 'is-needed');
    c.removeAttribute('data-tag');
  });
  $$('path', el.links).forEach((p) => p.remove());
}

function activeNav() { return S.active.hover || S.active.focus; }

function refreshLinks() {
  clearLinkMarks();
  const nav = activeNav();
  if (!nav || !nav.isConnected || nav.dataset.kind !== 'cell') return;
  const cell = nav.closest('.cell');
  const { page, verb } = cell.dataset;
  const rel = relations(page, verb);
  cell.classList.add('is-self');
  const mark = (v, cls, tag) => {
    const other = cellEls[cellKey(page, v)];
    other.cell.classList.add(cls);
    other.cell.setAttribute('data-tag', tag);
  };
  const pairs = [];
  rel.requires.forEach((v) => { mark(v, 'is-prereq', 'شرط لازم'); pairs.push({ from: verb, to: v, dep: verb }); });
  rel.neededBy.forEach((v) => { mark(v, 'is-needed', 'يعتمد عليه'); pairs.push({ from: v, to: verb, dep: v }); });
  if (S.stacked || !pairs.length) return;
  const wrap = el.gridwrap.getBoundingClientRect();
  const topOf = (v) => {
    const r = cellEls[cellKey(page, v)].nav.getBoundingClientRect();
    return { x: r.left - wrap.left + r.width / 2, y: r.top - wrap.top - 2 };
  };
  for (const { from, to, dep } of pairs) {
    const a = topOf(from);
    const b = topOf(to);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${a.x} ${a.y} C ${a.x} ${a.y - 20}, ${b.x} ${b.y - 20}, ${b.x} ${b.y}`);
    path.setAttribute('class', levelOf(S.perms, page, dep) > 0 ? 'on' : 'off');
    path.setAttribute('marker-end', 'url(#arrow)');
    el.links.appendChild(path);
  }
}

function setActive(kind, nav) {
  S.active[kind] = nav;
  refreshLinks();
}

/* ===== state mutations ===== */
function changedKeys(a, b) {
  const keys = [];
  for (const page of PAGES) for (const verb of cellsOfPage(page.key)) {
    if (levelOf(a, page.key, verb) !== levelOf(b, page.key, verb)) keys.push(cellKey(page.key, verb));
  }
  return keys;
}

const pulseTimers = {};
function pulse(keys) {
  for (const key of keys) {
    const cell = cellEls[key].cell;
    cell.classList.remove('pulse');
    void cell.offsetWidth;
    cell.classList.add('pulse');
    clearTimeout(pulseTimers[key]);
    pulseTimers[key] = setTimeout(() => cell.classList.remove('pulse'), 1300);
  }
}

// origin is the cell the user acted on; every other changed cell is an auto-adjustment.
function commit(nextPerms, notes, origin) {
  const entry = { id: ++S.seq, perms: S.perms };
  S.history.push(entry);
  if (S.history.length > 60) S.history.shift();
  const changed = changedKeys(S.perms, nextPerms);
  for (const key of changed) delete S.errors.cells[key];
  S.perms = nextPerms;
  renderPerms();
  pulse(changed.filter((k) => k !== origin));
  if (notes && notes.length) toast(notes, 'info', { undoId: entry.id });
}

function undoTo(id) {
  const index = S.history.findIndex((h) => h.id === id);
  if (index < 0) return;
  const restored = S.history[index].perms;
  const changed = changedKeys(S.perms, restored);
  S.perms = restored;
  S.history.length = index;
  S.errors.cells = {};
  $$('.toast[data-undo-id]', el.toasts).forEach((t) => { if (Number(t.dataset.undoId) >= id) t.remove(); });
  renderPerms();
  pulse(changed);
  toast('تم التراجع');
}

function undoLast() {
  const last = S.history[S.history.length - 1];
  if (last) undoTo(last.id);
}

function deny(pageKey, verb, text) {
  toast(text, 'bad');
  const ref = cellEls[cellKey(pageKey, verb)];
  if (ref) {
    ref.cell.classList.remove('shake');
    void ref.cell.offsetWidth;
    ref.cell.classList.add('shake');
    setTimeout(() => ref.cell.classList.remove('shake'), 350);
  }
}

function guardEditing(pageKey, verb) {
  if (S.saving) return true;
  if (S.readOnly) { deny(pageKey, verb, MSG.ownRole); return true; }
  return false;
}

function applyLevel(pageKey, verb, level) {
  const res = setCell(S.perms, pageKey, verb, level, S.persona);
  if (!res.ok) { deny(pageKey, verb, res.reason); return false; }
  if (!res.changed) return false;
  commit(res.perms, res.notes, cellKey(pageKey, verb));
  return true;
}

function stepCell(pageKey, verb, dir) {
  if (guardEditing(pageKey, verb)) return;
  const def = cellDef(pageKey, verb);
  const next = cycleLevel(def, levelOf(S.perms, pageKey, verb), dir, S.persona);
  if (next === null) { deny(pageKey, verb, `«${actionLabelAt(pageKey, verb, 2)}»: ${MSG.locked}`); return; }
  applyLevel(pageKey, verb, next);
}

function setDirect(pageKey, verb, level) {
  if (guardEditing(pageKey, verb)) return;
  applyLevel(pageKey, verb, level);
}

function toggleRow(pageKey) {
  if (S.saving) return;
  if (S.readOnly) { deny(pageKey, 'view', MSG.ownRole); return; }
  const mode = rowState(S.perms, pageKey, S.persona) === 'all' ? 'clear' : 'grant';
  const res = applyRow(S.perms, pageKey, mode, S.persona);
  if (!res.changed) { toast('لا يوجد ما يمكن تغييره هنا بصلاحياتك الحالية', 'bad'); return; }
  commit(res.perms, res.notes, null);
}

function applyColumnChoice(verb, level) {
  if (S.saving) return;
  if (S.readOnly) { toast(MSG.ownRole, 'bad'); return; }
  const res = applyColumn(S.perms, verb, level, S.persona);
  if (!res.changed) { toast(res.notes[0] || 'لا تغيير: كل الصفحات على هذا الخيار بالفعل', 'bad'); return; }
  commit(res.perms, res.notes, null);
}

function toggleColumn(verb) {
  applyColumnChoice(verb, columnState(S.perms, verb, S.persona) === 'all' ? 0 : 2);
}

function openCellMenu(pageKey, verb) {
  if (guardEditing(pageKey, verb)) return;
  const def = cellDef(pageKey, verb);
  if (def.kind !== 'scope') { stepCell(pageKey, verb, 1); return; }
  const current = levelOf(S.perms, pageKey, verb);
  const own = pageKey === 'media' ? 'ما رفعه المستخدم فقط' : 'ما أنشأه المستخدم فقط';
  const descs = ['بدون هذه الصلاحية', own, 'كل السجلات، ويشمل الخاص'];
  openMenu(cellEls[cellKey(pageKey, verb)].nav, {
    title: `${VERB_LABELS[verb]} ${pageLabel(pageKey)}`,
    items: def.levels.map((level) => {
      const locked = level > current && !canGrant(S.persona, pageKey, verb, level);
      return { value: level, label: SCOPE_PHRASE[level], desc: locked ? MSG.locked : descs[level], checked: level === current, disabled: locked, reason: reasonText(pageKey, verb, level) };
    }),
    onPick: (level) => setDirect(pageKey, verb, level),
  });
}

function openColumnMenu(verb) {
  if (S.saving) return;
  const scoped = PAGES.filter((p) => cellDef(p.key, verb) && cellDef(p.key, verb).kind === 'scope').map((p) => p.label);
  const binary = PAGES.filter((p) => cellDef(p.key, verb) && cellDef(p.key, verb).kind === 'bin').map((p) => p.label);
  let items;
  if (verb === 'create' || verb === 'special') {
    items = [
      { value: 0, label: 'لا شيء', desc: 'إزالته من كل الصفحات' },
      { value: 2, label: 'الكل', desc: 'منحه لكل صفحة تدعمه (ما تملكه فقط)' },
    ];
  } else {
    items = [
      { value: 0, label: 'لا شيء', desc: 'إزالته من كل الصفحات' },
      { value: 1, label: 'الخاص', desc: `ينطبق على: ${scoped.join('، ')}${binary.length ? ` — لا ينطبق على: ${binary.join('، ')}` : ''}` },
      { value: 2, label: 'الكل', desc: 'لكل الصفحات التي تدعمه (ما تملكه فقط)' },
    ];
  }
  openMenu(headEls[verb].menu, {
    title: `تطبيق «${VERB_LABELS[verb]}» على كل الصفحات`, items,
    onPick: (level) => applyColumnChoice(verb, level), returnFocus: headEls[verb].button,
  });
}

/* ===== loading / modes ===== */
function resetTransient() {
  S.history = [];
  S.errors = { name: null, form: null, cells: {} };
  S.saving = false;
  $$('.toast[data-undo-id]', el.toasts).forEach((t) => t.remove());
  clearLinkMarks();
}

function adoptEmpty() {
  S.form = { name: '', description: '', isActive: true };
  S.base = null;
  S.perms = emptyPerms();
  S.basePerms = emptyPerms();
  S.readOnly = false;
}

function adoptRole(role) {
  S.form = { name: role.roleName, description: role.description, isActive: role.isActive };
  S.base = { roleName: role.roleName, description: role.description, isActive: role.isActive, usersCount: role.usersCount };
  S.perms = fromPayloadPermissions(role.permissions);
  S.basePerms = clonePerms(S.perms);
  S.readOnly = PERSONAS[S.persona].ownRole === role.id;
}

async function loadMode(mode, roleId) {
  const token = ++S.loadToken;
  S.mode = mode;
  S.roleId = roleId || null;
  resetTransient();
  adoptEmpty();
  if (mode === 'edit') {
    S.status = 'loading';
    renderShell();
    renderDev();
    renderDevSave();
    try {
      const role = await api.getRole(roleId);
      if (token !== S.loadToken) return;
      adoptRole(role);
      S.status = 'ready';
    } catch (e) {
      if (token !== S.loadToken) return;
      S.status = 'error';
      renderShell();
      renderDevSave();
      return;
    }
  } else {
    S.status = 'ready';
  }
  renderAll();
  layoutCheck();
}

async function switchMode(id) {
  if (id === currentModeId() && S.status !== 'error') return;
  if (!(await confirmDiscard())) { renderDev(); return; }
  if (id === 'create') await loadMode('create');
  else await loadMode('edit', id.slice(5));
}

/* ===== save flow (dev bar) ===== */
async function reauthDialog() {
  const res = await openDialog({
    title: 'تأكيد الهوية', titleIcon: 'lock',
    body: 'هذا إجراء حساس. أكّد هويتك للمتابعة، ولن يُطلب منك ذلك مجدداً لفترة قصيرة.',
    field: { label: 'كلمة المرور', submit: (text) => api.reauth(text) },
    actions: [{ id: 'cancel', label: 'إلغاء' }, { id: 'ok', label: 'تأكيد ومتابعة', kind: 'primary', confirm: true }],
  });
  return res.action === 'ok';
}

async function withReauth(call) {
  for (;;) {
    try { return await call(); } catch (e) {
      if (!(e && e.code === 'REAUTH_REQUIRED')) throw e;
      if (!(await reauthDialog())) throw { code: 'CANCELLED' };
    }
  }
}

async function save() {
  if (S.saving || S.status !== 'ready') return;
  if (S.readOnly) { toast(MSG.ownRole, 'bad'); return; }
  S.errors.name = null; S.errors.form = null;
  const nv = validateName(S.form.name);
  if (nv.error) {
    S.errors.name = nv.error;
    renderDevSave();
    el.devName.focus();
    return;
  }
  if (isEdit() && !isDirty()) { renderDevSave(); toast('لا توجد تغييرات للحفظ', 'info'); return; }
  S.saving = true;
  S.errors.cells = {};
  renderDevSave(); patchGrid();
  const creating = !isEdit();
  try {
    const body = buildPayload({ mode: S.mode, form: S.form, perms: S.perms, basePerms: S.basePerms });
    const saved = await withReauth(() => api.saveRole(S.roleId, body, S.persona));
    S.saving = false;
    S.base = { roleName: saved.roleName, description: saved.description, isActive: saved.isActive, usersCount: saved.usersCount };
    S.basePerms = clonePerms(S.perms);
    S.form = { name: saved.roleName, description: saved.description, isActive: saved.isActive };
    if (creating) { S.mode = 'edit'; S.roleId = saved.id; }
    resetTransient();
    renderAll();
    toast(creating ? 'تم الإنشاء بنجاح' : 'تم التحديث بنجاح');
  } catch (e) {
    S.saving = false;
    handleSaveError(e);
  }
}

function handleSaveError(e) {
  if (e && e.code === 'CANCELLED') toast('لم يُحفظ شيء: أُلغي تأكيد الهوية', 'bad');
  else if (e && e.code === 'ESCALATION') {
    S.errors.cells = {};
    const names = [];
    for (const off of e.offenders) {
      const verb = actionToVerb(off.action);
      S.errors.cells[cellKey(off.page, verb)] = `لا يمكنك منح «${ACTION_LABELS[off.action]}» في ${pageLabel(off.page)}`;
      names.push(`${ACTION_LABELS[off.action]} (${pageLabel(off.page)})`);
    }
    S.errors.form = `${e.message}: ${names.join('، ')}`;
  } else if (e && e.field === 'roleName') S.errors.name = e.message;
  else if (e && e.code === 'OWN_ROLE') { S.errors.form = e.message; S.readOnly = true; }
  else S.errors.form = (e && e.message) || 'تعذّر الحفظ. حاول مرة أخرى.';
  renderPerms();
  if (e && e.field === 'roleName') el.devName.focus();
  else if (e && e.code === 'ESCALATION') {
    const [pageKey, verb] = Object.keys(S.errors.cells)[0].split('.');
    cellEls[cellKey(pageKey, verb)].nav.focus();
  }
}

/* ===== interactions ===== */
function navMatrix() {
  return $$('.row', el.grid).map((row) => [...row.children].map((cell) => cell.querySelector('[data-nav]')));
}

function posOf(nav, matrix) {
  for (let r = 0; r < matrix.length; r += 1) {
    const c = matrix[r].indexOf(nav);
    if (c >= 0) return { r, c };
  }
  return null;
}

function setRoving(nav) {
  $$('[data-nav][tabindex="0"]', el.grid).forEach((n) => { if (n !== nav) n.tabIndex = -1; });
  nav.tabIndex = 0;
}

function moveFocus(nav, dr, dc) {
  const matrix = navMatrix();
  const pos = posOf(nav, matrix);
  if (!pos) return;
  let r = pos.r + dr;
  let c = pos.c + dc;
  while (r >= 0 && r < matrix.length && c >= 0 && c < matrix[r].length) {
    const target = matrix[r][c];
    const hidden = target && S.stacked && target.closest('.cell.na');
    if (target && !hidden) { target.focus(); return; }
    r += dr; c += dc;
  }
}

function edgeFocus(nav, last) {
  const matrix = navMatrix();
  const pos = posOf(nav, matrix);
  const row = matrix[pos.r].filter((n) => n && !(S.stacked && n.closest('.cell.na')));
  (last ? row[row.length - 1] : row[0]).focus();
}

function cellOf(nav) {
  const cell = nav.closest('.cell[data-page]');
  return cell ? { pageKey: cell.dataset.page, verb: cell.dataset.verb } : null;
}

function activate(nav, dir, alt) {
  const { kind } = nav.dataset;
  if (kind === 'cell') {
    const { pageKey, verb } = cellOf(nav);
    if (alt) openCellMenu(pageKey, verb); else stepCell(pageKey, verb, dir);
  } else if (kind === 'rowcheck') toggleRow(nav.dataset.page);
  else if (kind === 'colhead') { if (alt) openColumnMenu(nav.dataset.verb); else toggleColumn(nav.dataset.verb); }
}

const RTL = () => document.documentElement.dir === 'rtl';

function onGridKeydown(e) {
  const nav = e.target.closest('[data-nav]');
  if (!nav) return;
  const key = e.key;
  if ((key === 'ArrowDown' || key === 'Enter') && e.altKey) { e.preventDefault(); activate(nav, 1, true); return; }
  if (e.ctrlKey || e.metaKey) {
    if (key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undoLast(); }
    return;
  }
  switch (key) {
    case 'ArrowUp': e.preventDefault(); moveFocus(nav, -1, 0); break;
    case 'ArrowDown': e.preventDefault(); moveFocus(nav, 1, 0); break;
    case 'ArrowRight': e.preventDefault(); moveFocus(nav, 0, RTL() ? -1 : 1); break;
    case 'ArrowLeft': e.preventDefault(); moveFocus(nav, 0, RTL() ? 1 : -1); break;
    case 'Home': e.preventDefault(); edgeFocus(nav, false); break;
    case 'End': e.preventDefault(); edgeFocus(nav, true); break;
    case ' ':
    case 'Enter': e.preventDefault(); activate(nav, e.shiftKey ? -1 : 1, false); break;
    case '0': case '1': case '2':
    case 'Delete': case 'Backspace': {
      if (nav.dataset.kind !== 'cell') break;
      e.preventDefault();
      const { pageKey, verb } = cellOf(nav);
      setDirect(pageKey, verb, key === '1' || key === '2' ? Number(key) : 0);
      break;
    }
    default:
  }
}

function onGridClick(e) {
  const more = e.target.closest('[data-more]');
  const hmenu = e.target.closest('[data-hmenu]');
  const chip = e.target.closest('.chip');
  const row = e.target.closest('.rcheck');
  const head = e.target.closest('.htri');
  if (more) { const { pageKey, verb } = cellOf(more); cellEls[cellKey(pageKey, verb)].nav.focus(); openCellMenu(pageKey, verb); return; }
  if (hmenu) { headEls[hmenu.dataset.verb].button.focus(); openColumnMenu(hmenu.dataset.verb); return; }
  if (chip) { const { pageKey, verb } = cellOf(chip); chip.focus(); stepCell(pageKey, verb, e.shiftKey ? -1 : 1); return; }
  if (row) { row.focus(); toggleRow(row.dataset.page); return; }
  if (head) { head.focus(); toggleColumn(head.dataset.verb); return; }
  const cell = e.target.closest('.cell');
  const nav = cell && cell.querySelector('[data-nav]');
  if (nav) nav.focus();
}

function onGridContext(e) {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  e.preventDefault();
  const { pageKey, verb } = cellOf(chip);
  chip.focus();
  stepCell(pageKey, verb, -1);
}

/* layout: stacked blocks on narrow widths */
function applyLayout(width) {
  const stacked = width > 0 && width < 880;
  if (stacked === S.stacked && el.editor.classList.contains('is-stacked') === stacked) return;
  S.stacked = stacked;
  el.editor.classList.toggle('is-stacked', stacked);
  refreshLinks();
}
function layoutCheck() { applyLayout(el.editor.getBoundingClientRect().width || el.editor.clientWidth); }

/* ===== wiring ===== */
function setTheme(theme, persist) {
  document.documentElement.setAttribute('data-theme', theme);
  setText($('#dev-theme-t'), theme === 'dark' ? 'فاتح' : 'داكن');
  $('#dev-theme svg use').setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  if (persist) { try { localStorage.setItem('perm-b-theme', theme); } catch (e) { /* storage unavailable */ } }
}

function initPrefs() {
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);
  let stored = null;
  try { stored = localStorage.getItem(SUMMARY_KEY); } catch (e) { stored = null; }
  S.summaryOn = stored === 'on';
}

function setSummary(on) {
  S.summaryOn = on;
  try { localStorage.setItem(SUMMARY_KEY, on ? 'on' : 'off'); } catch (e) { /* storage unavailable */ }
  renderSummarySwitch();
}

function wire() {
  el.grid.addEventListener('keydown', onGridKeydown);
  el.grid.addEventListener('keyup', (e) => { if (e.key === ' ' && e.target.closest('[data-nav]')) e.preventDefault(); });
  el.grid.addEventListener('click', onGridClick);
  el.grid.addEventListener('contextmenu', onGridContext);
  el.grid.addEventListener('focusin', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (!nav) return;
    setRoving(nav);
    setActive('focus', nav);
  });
  el.grid.addEventListener('focusout', (e) => {
    if (!el.grid.contains(e.relatedTarget)) setActive('focus', null);
  });
  el.grid.addEventListener('pointerover', (e) => {
    const cell = e.target.closest('.cell');
    const nav = cell && cell.querySelector('[data-nav]');
    if (nav && nav !== S.active.hover) setActive('hover', nav);
  });
  el.grid.addEventListener('pointerleave', () => setActive('hover', null));
  document.addEventListener('pointerover', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('pointerout', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && t === tipTarget) hideTip(); });
  document.addEventListener('focusin', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); else hideTip(); });
  document.addEventListener('scroll', hideTip, true);

  el.toasts.addEventListener('click', (e) => {
    const undo = e.target.closest('[data-undo]');
    if (undo) undoTo(Number(undo.dataset.undo));
  });
  el.sumSwitch.addEventListener('click', () => setSummary(!S.summaryOn));
  $('#btn-help').addEventListener('click', () => toggleShortcuts());
  $('#retry').addEventListener('click', () => loadMode('edit', S.roleId));

  el.devModes.addEventListener('click', (e) => { const b = e.target.closest('[data-mode]'); if (b) switchMode(b.dataset.mode); });
  el.devPersona.addEventListener('change', () => {
    S.persona = el.devPersona.value;
    if (isEdit() && S.status === 'ready') S.readOnly = PERSONAS[S.persona].ownRole === S.roleId;
    renderShell(); renderPerms();
    toast(`المستخدم الحالي: ${PERSONAS[S.persona].label}`, 'info');
  });
  el.devName.addEventListener('input', () => { S.form.name = el.devName.value; S.errors.name = null; renderDevSave(); renderPayload(); });
  el.devSave.addEventListener('click', save);
  $('#dev-theme').addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true));
  $('#dev-payload').addEventListener('click', (e) => {
    S.showPayload = !S.showPayload;
    e.currentTarget.setAttribute('aria-pressed', String(S.showPayload));
    renderPayload();
  });
  $('#dev-fail').addEventListener('change', (e) => { api.failNextLoad = e.target.checked; });
  $('#dev-reauth').addEventListener('click', () => { api.reauthUntil = 0; toast('سيُطلب تأكيد الهوية عند الحفظ التالي', 'info'); });

  document.addEventListener('keydown', (e) => {
    const tag = e.target && e.target.tagName;
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if (e.key === '?' && !typing && !dialogOpen) { e.preventDefault(); toggleShortcuts(); }
    else if (e.key === 'Escape' && shortcutsNode && !menu && !dialogOpen) toggleShortcuts(false);
  });
  window.addEventListener('beforeunload', (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('resize', layoutCheck);
  if (typeof ResizeObserver === 'function') new ResizeObserver(layoutCheck).observe(el.editor);
}

/* ===== boot ===== */
initPrefs();
buildGrid();
wire();
adoptEmpty();
renderAll();
layoutCheck();

window.__perm = { S, api, db, TIMING, stats, el, cellEls, rowEls, headEls, loadMode, switchMode, save, applyLayout, setTheme, undoLast };
</script>
</body>
</html>
