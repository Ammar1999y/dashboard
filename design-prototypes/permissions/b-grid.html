<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>مصفوفة الصلاحيات — التصميم B: شبكة ذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('perm-b-theme'); } catch (e) { t = null; }
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
})();
</script>
<style>
:root {
  color-scheme: light;
  --font-ui: 'Cairo', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace;
  --radius: 0.625rem;
  --r-sm: calc(var(--radius) - 2px);
  --background: hsl(0 0% 100%);
  --foreground: hsl(0 0% 4%);
  --card: hsl(0 0% 98%);
  --muted: hsl(0 0% 96%);
  --muted-fg: hsl(0 0% 45%);
  --accent: hsl(0 0% 92%);
  --border: hsl(0 0% 90%);
  --input: hsl(0 0% 94%);
  --line-strong: hsl(0 0% 80%);
  --primary: hsl(172 98% 40%);
  --primary-fg: #000;
  --primary-ink: hsl(172 98% 23%);
  --destructive: hsl(357 100% 45%);
  --warning: hsl(40 100% 50%);
  --warning-ink: hsl(34 100% 30%);
  --success: hsl(155 54% 46%);
  --info: hsl(189 100% 43%);
  --primary-10: color-mix(in srgb, var(--primary) 10%, transparent);
  --primary-40: color-mix(in srgb, var(--primary) 45%, transparent);
  --row-alt: color-mix(in srgb, var(--accent) 50%, transparent);
  --shadow: 0 8px 30px hsl(0 0% 0% / .14);
  --dev-a: #fff6dc; --dev-b: #fff0c4;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
[data-theme="dark"] {
  color-scheme: dark;
  --background: hsl(0 0% 4%);
  --foreground: hsl(0 0% 98%);
  --card: hsl(0 0% 9%);
  --muted: hsl(0 0% 12%);
  --muted-fg: hsl(0 0% 63%);
  --accent: hsl(0 0% 18%);
  --border: hsl(0 0% 100% / .1);
  --input: hsl(0 0% 19.89%);
  --line-strong: hsl(0 0% 100% / .2);
  --primary-ink: hsl(172 98% 46%);
  --destructive: hsl(359 100% 70%);
  --warning-ink: hsl(40 100% 55%);
  --shadow: 0 8px 30px hsl(0 0% 0% / .55);
  --dev-a: #19160e; --dev-b: #1d190f;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--background); color: var(--foreground);
  font: 14px/1.6 var(--font-ui); min-height: 100vh; -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num, bdi.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
svg.i { width: 16px; height: 16px; flex: none; }
svg.i.sm { width: 14px; height: 14px; }

/* ---------- dev bar (visually not product UI) ---------- */
.devbar {
  position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 8px 16px; font-size: 12px; color: var(--foreground);
  background: repeating-linear-gradient(135deg, var(--dev-a) 0 10px, var(--dev-b) 10px 20px);
  border-bottom: 1px dashed var(--warning);
}
.tag { font: 700 10px var(--font-mono); letter-spacing: .08em; padding: 2px 6px; border: 1px solid var(--warning-ink); color: var(--warning-ink); border-radius: 4px; direction: ltr; }
.devbar .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.devbar .lbl { color: var(--muted-fg); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border: 1px dashed var(--line-strong); border-radius: 8px; }
.seg button, .devbtn { border: 0; background: transparent; padding: 3px 10px; border-radius: 6px; font-size: 12px; color: var(--muted-fg); }
.seg button:hover, .devbtn:hover { color: var(--foreground); background: color-mix(in srgb, var(--foreground) 8%, transparent); }
.seg button[aria-pressed="true"] { background: var(--warning); color: #1b1405; font-weight: 600; }
.devbtn { border: 1px dashed var(--line-strong); display: inline-flex; align-items: center; gap: 6px; }
.devbtn[aria-pressed="true"] { border-color: var(--warning-ink); color: var(--foreground); }
.devbtn.save { border-style: solid; border-color: var(--warning-ink); color: var(--foreground); font-weight: 600; }
.devbtn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.devbar select, .devinput { background: var(--background); border: 1px dashed var(--line-strong); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
.devinput { width: 150px; }
.devinput[aria-invalid="true"] { border-color: var(--destructive); border-style: solid; }
.devbar input[type="checkbox"] { accent-color: var(--primary); }
.devmsgs { display: flex; gap: 12px; flex-wrap: wrap; flex-basis: 100%; }
.devmsgs:not(:has(.devmsg:not(:empty))) { display: none; }
.devmsg { font-size: 12px; color: var(--muted-fg); }
.devmsg.err { color: var(--destructive); }
.devmsg:empty { display: none; }

/* ---------- component shell ---------- */
.page { max-width: 1200px; margin: 0 auto; padding: 28px 16px 120px; display: grid; gap: 24px; }
.editor { display: grid; gap: 14px; position: relative; }
.editor-body { display: grid; gap: 12px; }
.editor-head { display: flex; align-items: center; gap: 12px; }
.editor-head h2 { margin: 0; font-size: 20px; line-height: 1.4; font-weight: 600; margin-inline-end: auto; }
.head-tools { display: flex; align-items: center; gap: 10px; }
.note {
  display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-radius: var(--radius);
  background: var(--muted); font-size: 13px; color: var(--muted-fg);
}
.note svg { margin-top: 4px; }
.note.ro { background: color-mix(in srgb, var(--warning) 14%, transparent); color: var(--foreground); }
.note.ro svg { color: var(--warning-ink); }
.sumswitch { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 4px 6px; border-radius: var(--r-sm); font-size: 13px; color: var(--muted-fg); }
.sumswitch:hover { color: var(--foreground); }
.sumswitch .track { position: relative; width: 30px; height: 17px; border-radius: 999px; background: var(--input); border: 1px solid var(--line-strong); transition: background .2s, border-color .2s; }
.sumswitch .track::after { content: ''; position: absolute; top: 1px; inset-inline-start: 1px; width: 13px; height: 13px; border-radius: 50%; background: var(--background); box-shadow: 0 1px 2px hsl(0 0% 0% / .3); transition: transform .2s var(--ease); }
.sumswitch[aria-checked="true"] .track { background: var(--primary); border-color: var(--primary); }
.sumswitch[aria-checked="true"] .track::after { transform: translateX(-13px); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px;
  border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--background); font-size: 13px; font-weight: 500;
}
.btn:hover { background: var(--accent); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.primary:hover { filter: brightness(.95); }
.btn.danger { background: var(--destructive); border-color: var(--destructive); color: #fff; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.kbtn { width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); background: var(--background); color: var(--muted-fg); font: 600 13px var(--font-ui); }
.kbtn:hover { color: var(--foreground); background: var(--accent); }

/* ---------- the matrix ---------- */
.gridwrap { position: relative; }
.grid {
  --cols: minmax(220px, 1.3fr) repeat(4, minmax(128px, 1fr)) minmax(190px, 1.4fr);
  display: grid; gap: 2px;
}
.row { display: grid; grid-template-columns: var(--cols); border-radius: var(--radius); transition: background .12s; }
.row.head { background: var(--row-alt); }
.row.body:nth-child(odd) { background: var(--row-alt); }
.row.body:hover { background: var(--accent); }
.cell { position: relative; padding: 10px 12px; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; border-radius: var(--r-sm); }
.row.body > .cell[data-verb] { grid-row: 1; }
.cell.corner { justify-content: flex-start; font-size: 12px; color: var(--muted-fg); padding-block: 8px; }
.cell.rowhead { grid-column: 1; grid-row: 1 / span 2; justify-content: flex-start; flex-direction: column; align-items: stretch; gap: 6px; }
.cell-label { display: none; font-size: 11px; color: var(--muted-fg); }

/* column header: tri-state, title and menu on one line */
.hhead { display: inline-flex; align-items: center; gap: 6px; flex-wrap: nowrap; white-space: nowrap; }
.htitle { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; }
.htitle svg { color: var(--muted-fg); }
.htri, .hmenu, .rcheck { border: 0; background: transparent; padding: 3px; margin: 0; border-radius: 6px; display: inline-flex; align-items: center; color: var(--muted-fg); }
.hmenu:hover, .htri:hover, .rcheck:hover { background: var(--accent); }
.htri:focus-visible, .rcheck:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--primary); }
.htri[aria-disabled="true"], .rcheck[aria-disabled="true"] { opacity: .5; }

.tri { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line-strong); background: var(--background); display: inline-grid; place-items: center; flex: none; color: var(--primary-fg); transition: background .15s, border-color .15s; }
.tri svg { width: 12px; height: 12px; display: none; }
.tri svg path { stroke-width: 2.5; }
.tri[data-state="all"] { background: var(--primary); border-color: var(--primary); }
.tri[data-state="all"] .t-all { display: block; }
.tri[data-state="mixed"] { background: var(--primary-10); border-color: var(--primary-40); color: var(--primary-ink); }
.tri[data-state="mixed"] .t-mixed { display: block; }

/* row header: checkbox + name, then the progress bar directly beneath */
.rh-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pname { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
.pname svg { color: var(--muted-fg); }

/* summary sub-line spans the verb columns */
.cell.rsum { grid-column: 2 / -1; grid-row: 2; justify-content: flex-start; padding-block: 0 10px; padding-inline: 12px; font-size: 12.5px; color: var(--muted-fg); }
.grid[data-summary="off"] .rsum { display: none; }
.rsum-text { transition: color .2s; }

/* chips */
.chipbox { display: inline-flex; align-items: stretch; width: 100%; max-width: 136px; position: relative; }
.cell.special .chipbox { max-width: 100%; }
.chip {
  all: unset; box-sizing: border-box; flex: 1; min-width: 0;
  /* fixed slots: indicator | text | status — icons toggling never move the text */
  display: grid; grid-template-columns: 14px minmax(0, 1fr) 14px; align-items: center; column-gap: 8px; text-align: start;
  min-height: 32px; padding: 3px 10px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--background); color: var(--muted-fg);
  font-size: 12.5px; line-height: 1.35; cursor: pointer; transition: background .15s, border-color .15s, color .15s, transform .08s; user-select: none;
}
.chipbox.has-more .chip { border-start-end-radius: 0; border-end-end-radius: 0; }
.chip:hover { border-color: var(--primary-40); color: var(--foreground); }
.chip:active { transform: scale(.97); }
.chip:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--primary); z-index: 2; }
.chip.lvl-1 { background: var(--primary-10); border-color: var(--primary-40); color: var(--primary-ink); }
.chip.lvl-2 { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.chip .ctext { grid-area: 1 / 2; justify-self: start; overflow-wrap: anywhere; font-weight: 500; }
.chip .pips, .chip .tick { grid-area: 1 / 1; justify-self: center; }
.chip .lk, .chip .nb { grid-area: 1 / 3; justify-self: center; }
.chip .pips { display: inline-flex; gap: 2px; flex: none; }
.chip .pips i { width: 3px; height: 11px; border-radius: 2px; background: currentColor; opacity: .25; }
.chip.lvl-1 .pips i:first-child, .chip.lvl-2 .pips i { opacity: 1; }
.chip .tick { display: none; flex: none; }
.chip.bin.lvl-2 .tick { display: block; }
.chip.bin .pips { display: none; }
.chip .lk, .chip .nb { display: none; flex: none; }
.chip.locked .lk { display: block; color: var(--warning-ink); }
.chip.lvl-2.locked .lk { color: var(--primary-fg); }
.chip.warncreate .nb { display: block; color: var(--warning-ink); }
.chip.nope { cursor: not-allowed; opacity: .75; border-style: dashed; }
.chip.nope:hover { border-color: var(--line-strong); color: var(--muted-fg); }
.chip.lvl-1.nope, .chip.lvl-2.nope { opacity: .88; }
.chip.ro { cursor: default; }
.more {
  all: unset; box-sizing: border-box; width: 22px; display: grid; place-items: center; cursor: pointer; color: var(--muted-fg);
  border: 1px solid var(--line-strong); border-inline-start: 0; border-start-end-radius: var(--r-sm); border-end-end-radius: var(--r-sm); background: var(--background);
}
.more:hover { color: var(--foreground); background: var(--accent); }
.chipbox:has(.chip.lvl-2) .more { border-color: var(--primary); background: var(--primary); color: var(--primary-fg); }
.chipbox:has(.chip.lvl-1) .more { border-color: var(--primary-40); background: var(--primary-10); color: var(--primary-ink); }
.cell.err .chip { border-color: var(--destructive); box-shadow: 0 0 0 2px color-mix(in srgb, var(--destructive) 20%, transparent); }
.cell.shake .chipbox { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(3px); } 75% { transform: translateX(-3px); } }
.na-mark { color: var(--muted-fg); opacity: .6; font-size: 16px; line-height: 1; padding: 6px 14px; border-radius: 6px; cursor: help; user-select: none; }
.na-mark:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--primary); }

/* auto-adjusted cells flash briefly */
.cell.pulse { animation: pulse 1.3s ease-out; }
@keyframes pulse {
  0% { background: color-mix(in srgb, var(--primary) 38%, transparent); box-shadow: 0 0 0 2px var(--primary); }
  100% { background: transparent; box-shadow: 0 0 0 2px transparent; }
}

/* dependency visualisation */
.cell.is-prereq, .cell.is-needed { background: var(--primary-10); }
.cell.is-prereq::before, .cell.is-needed::before { content: ''; position: absolute; inset: 3px; border: 1px dashed var(--primary-40); border-radius: var(--r-sm); pointer-events: none; }
.cell.is-needed::before { border-style: dotted; }
.cell[data-tag]::after {
  content: attr(data-tag); position: absolute; top: 1px; inset-inline-end: 8px; font-size: 9.5px; line-height: 1.3; padding: 0 4px;
  background: var(--background); color: var(--primary-ink); border-radius: 3px; pointer-events: none;
}
.cell.is-self .chip { border-color: var(--primary-ink); }
.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
.links path { fill: none; stroke: var(--primary-ink); stroke-width: 1.5; stroke-linecap: round; }
.links path.off { stroke-dasharray: 3 4; opacity: .55; }
.links path.on { filter: drop-shadow(0 0 3px var(--primary)); }

/* ---------- dev payload panel ---------- */
.payload { border: 1px dashed var(--warning-ink); border-radius: var(--radius); overflow: hidden; }
.payload header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px dashed var(--warning-ink); font-size: 12px; color: var(--muted-fg); background: repeating-linear-gradient(135deg, var(--dev-a) 0 10px, var(--dev-b) 10px 20px); }
.payload header .m { font-family: var(--font-mono); direction: ltr; color: var(--primary-ink); }
.payload header .live { margin-inline-start: auto; }
.payload pre { margin: 0; padding: 12px 14px; max-height: 360px; overflow: auto; font: 12px/1.6 var(--font-mono); direction: ltr; text-align: left; color: var(--foreground); background: var(--card); }

/* ---------- states ---------- */
.state-loading, .state-error { display: none; }
.editor[data-status="loading"] .state-loading { display: grid; gap: 10px; }
.editor[data-status="loading"] .editor-body { display: none; }
.editor[data-status="error"] .state-error { display: grid; }
.editor[data-status="error"] .editor-body { display: none; }
.sk { border-radius: var(--radius); background: linear-gradient(90deg, var(--muted) 25%, var(--accent) 37%, var(--muted) 63%); background-size: 400% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.state-error { place-items: center; text-align: center; padding: 40px 16px; gap: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
.state-error .big { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--destructive) 12%, transparent); color: var(--destructive); }
.state-error h3 { margin: 0; font-size: 16px; }
.state-error p { margin: 0 0 6px; color: var(--muted-fg); }

/* ---------- overlays ---------- */
.menu {
  position: fixed; z-index: 90; min-width: 200px; max-width: min(340px, calc(100vw - 16px)); padding: 4px; border-radius: var(--radius);
  background: var(--background); border: 1px solid var(--border); box-shadow: var(--shadow); animation: pop .14s var(--ease);
}
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.menu .mt { padding: 6px 10px 4px; font-size: 11px; color: var(--muted-fg); }
.mi { all: unset; box-sizing: border-box; display: flex; width: 100%; gap: 10px; align-items: flex-start; padding: 7px 10px; border-radius: var(--r-sm); cursor: pointer; font-size: 13px; }
.mi:hover, .mi:focus-visible { background: var(--accent); }
.mi:focus-visible { box-shadow: inset 0 0 0 2px var(--primary); }
.mi .mk { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--primary-ink); }
.mi .mb { display: grid; gap: 1px; flex: 1; }
.mi .md { font-size: 11.5px; color: var(--muted-fg); }
.mi[aria-disabled="true"] { cursor: not-allowed; opacity: .65; }
.mi[aria-disabled="true"] .md { color: var(--warning-ink); }
.mi .lkk { margin-top: 3px; color: var(--warning-ink); }
.tip {
  position: fixed; z-index: 95; max-width: 280px; padding: 6px 10px; border-radius: var(--r-sm); background: var(--foreground); color: var(--background);
  font-size: 12px; line-height: 1.5; pointer-events: none; box-shadow: var(--shadow);
}
.shortcuts { position: fixed; z-index: 92; width: min(380px, calc(100vw - 16px)); padding: 14px 16px; border-radius: var(--radius); background: var(--background); border: 1px solid var(--border); box-shadow: var(--shadow); animation: pop .14s var(--ease); }
.shortcuts h3 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.shortcuts dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 12.5px; align-items: center; }
.shortcuts dt { display: flex; gap: 4px; flex-wrap: wrap; }
.shortcuts dd { margin: 0; color: var(--muted-fg); }
kbd { font: 600 11px var(--font-mono); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); border-bottom-width: 2px; background: var(--muted); direction: ltr; display: inline-block; }
.scrim { position: fixed; inset: 0; background: hsl(0 0% 0% / .55); z-index: 100; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.dialog {
  position: fixed; z-index: 101; inset-block-start: 50%; inset-inline-start: 50%; transform: translate(50%, -50%);
  width: min(440px, calc(100vw - 24px)); padding: 20px; border-radius: var(--radius); background: var(--background);
  border: 1px solid var(--border); box-shadow: var(--shadow); display: grid; gap: 12px; animation: fade .18s;
}
.dialog h2 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.dialog p { margin: 0; color: var(--muted-fg); }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field .lrow { font-size: 12px; color: var(--muted-fg); }
.inl { width: 100%; min-height: 36px; padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--input); color: var(--foreground); }
.inl:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-10); }
.inl[aria-invalid="true"] { border-color: var(--destructive); }
.msg { font-size: 12px; color: var(--destructive); }
.msg:empty { display: none; }

/* toasts, in the spirit of sonner */
.toasts { position: fixed; inset-block-end: 20px; inset-inline: 0; display: grid; justify-items: center; gap: 8px; z-index: 110; pointer-events: none; padding-inline: 16px; }
.toast {
  pointer-events: auto; display: flex; gap: 10px; align-items: center; width: min(356px, 100%); padding: 14px 16px; border-radius: var(--radius);
  background: var(--background); color: var(--foreground); border: 1px solid var(--border); box-shadow: 0 4px 14px hsl(0 0% 0% / .12); font-size: 13px;
  animation: toast-in .3s var(--ease);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.toast .ti { flex: none; }
.toast.ok .ti { color: var(--success); }
.toast.info .ti { color: var(--info); }
.toast.bad .ti { color: var(--destructive); }
.toast .tx { flex: 1; display: grid; gap: 2px; min-width: 0; }
.toast .act { flex: none; border: 0; border-radius: 6px; padding: 5px 10px; background: var(--foreground); color: var(--background); font-size: 12px; font-weight: 500; }
.toast .act:hover { opacity: .88; }
.toast .act:focus-visible { outline-offset: 2px; }

/* ---------- stacked (phones / narrow widths) ---------- */
.is-stacked .grid { gap: 8px; }
.is-stacked .row.head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; padding: 6px 8px; }
.is-stacked .row.head::before { content: 'تطبيق على كل الصفحات:'; font-size: 11px; color: var(--muted-fg); width: 100%; padding-inline: 4px; }
.is-stacked .row.head .corner { display: none; }
.is-stacked .row.head .cell { padding: 2px 4px; }
.is-stacked .row.body { grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--card); border: 1px solid var(--border); padding: 4px; gap: 4px; }
.is-stacked .row.body:nth-child(odd) { background: var(--card); }
.is-stacked .row.body:hover { background: var(--card); }
.is-stacked .row.body > * { grid-row: auto !important; }
.is-stacked .row.body .cell { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 5px; padding: 8px; }
.is-stacked .row.body .rowhead { grid-column: 1 / -1; }
.is-stacked .cell-label { display: block; }
.is-stacked .cell.na { display: none; }
.is-stacked .chipbox, .is-stacked .cell.special .chipbox { max-width: none; }
.is-stacked .cell.special { grid-column: 1 / -1; }
.is-stacked .cell.rsum { grid-column: 1 / -1; padding: 6px 8px 4px; border-top: 1px solid var(--border); border-radius: 0; }
.is-stacked .chip { min-height: 40px; }
.is-stacked .more { width: 32px; }
.is-stacked .links { display: none; }
@media (max-width: 720px) {
  .page { padding-inline: 10px; }
  .devbar { padding-inline: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  /* the pulse becomes a static highlight that the script removes after the same delay */
  .cell.pulse { animation: none !important; background: color-mix(in srgb, var(--primary) 30%, transparent); box-shadow: 0 0 0 2px var(--primary); }
}
</style>

      <div class="note ro" id="ro-banner" role="status" hidden><svg class="i" aria-hidden="true"><use href="#i-lock"/></svg><span><strong>لا يمكنك تعديل الدور المخصص لحسابك.</strong> الجدول للقراءة فقط.</span></div>
      <div class="gridwrap" id="gridwrap">
        <div class="grid" id="grid" role="grid" data-summary="on" aria-label="مصفوفة الصلاحيات: الصفحات في الصفوف والإجراءات في الأعمدة"></div>
        <svg class="links" id="links" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8z" style="fill:var(--primary-ink);stroke:none"/></marker></defs></svg>
      </div>
    </div>
  </section>

  <section class="payload" id="payload" aria-label="الطلب المرسل">
    <header><span class="tag">DEV</span><svg class="i sm" aria-hidden="true"><use href="#i-code"/></svg><span>الطلب المرسل</span><span class="m" id="payload-method">POST /roles</span><span class="live">يتحدّث مباشرة</span></header>
    <pre id="payload-pre" tabindex="0" aria-label="جسم الطلب بصيغة JSON"></pre>
  </section>
