

### [Low] REC-1 — Under `OTP_AUTO_VERIFY`, the contact-change verify routes commit a new email or phone without re-authentication

- **Where:** `app/api/dash/users/me/change-email/verify/handler.ts:51-72`, `app/api/dash/users/me/change-phone/verify/handler.ts:51-68`; `lib/otp/verify.ts:428-435` (`verifyOtpOrAutoVerify` → `onVerified(tx, null)`); `commitEmailChange` / `commitPhoneChange` then write `matched?.targetIdentifier ?? newEmail`, the request body.
- **Evidence:** the password or re-auth window check happens only in `authorizeContactChange` (`lib/users/contact-change.ts:139-173`), which only the initiate handlers call. That function's own docblock says it is owed "before it commits" under `OTP_AUTO_VERIFY`. The verify routes never call it.
- **Failure scenario:** with the documented switch on (`packages/shared/src/config.ts:80`), a stolen session cookie posts `/change-email/verify {newEmail: attacker@gmail.com, code: "000000"}`, commits without a password, then takes the account through forgot-password.
- **Impact:** latent while `OTP_AUTO_VERIFY = false`. This is distinct from #61: that entry accepts that auto-verify skips the _code_, not that a second route skips the _password_.
- **Remediation:** under auto-verify, make the verify routes refuse (the initiate route has already committed), or run `authorizeContactChange` before `onVerified`.


