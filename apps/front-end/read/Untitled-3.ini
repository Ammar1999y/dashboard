  ## Orchestration  
  - You are the orchestrator: map the codebase, split it into coherent areas, dispatch subagents, cross-check their evidence, decide what is a finding. 
  - The effortLevel of the subagents you create should be the same as the current session (opus 5.5 with high effort). - Subagents do not see this prompt. Pass each one the Scope, Evidence, Runtime targets and Writes and reads rules, and the contents of @reports/should-ignore.md relevant to its area. - Subagents return evidence only; you alone write the report.
  
  