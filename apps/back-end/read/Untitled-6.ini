


اختبار الحرارة والأداء: أعده والشاحن مربوط. على البطارية الجهاز يقلّل الطاقة عمداً، فالنتيجة ما تنفع للحكم. والقراءات اللي طلعت كويسة: أعلى حرارة 79°، وما فيه خنق للمعالج.
الملصق في الصورتين ما فيه السيريال (S/N) ولا رقم الموديل (MT). هو ملصق المواصفات والشهادات فقط: الشاحن 20V، والـ Compliance ID TP00120F2. اطلب صورة للملصق اللي فيه S/N، وتأكد إنه PF3JPM3S. بعدها ادخله في pcsupport.lenovo.com وشوف تاريخ التصنيع والبلد.
الشاشة: سنة التصنيع المسجّلة في بيانات الشاشة 2016، والجهاز من 2021. هذا التاريخ أحياناً يكون غلط، بس شيك على زوايا الرؤية: إذا الألوان تتغير كثير لما تميل الشاشة، فهي غالباً TN رخيصة أو شاشة مبدّلة.
Absolute (برنامج تتبع الأجهزة المسروقة): حالته “Enable”. هذا طبيعي، بس تأكد في BIOS إنه مو “Activated”.