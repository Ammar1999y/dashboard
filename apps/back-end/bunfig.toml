# `bun test` configuration.
#
# `root` closes a SELECTION hole: `bun test <path>` treats its arguments as
# filename FILTERS, so a file outside the filter is skipped silently and the run
# still exits 0. Use `bun run test`, `test:integration` or `test:process`:
# `tests/helpers/run.ts` selects one tier with its provisioning and guards,
# while a bare `bun test` walks every tier without them.
[test]
root = "tests"

# Every tier gets this one. The PostgreSQL preload is added per tier on the
# command line by `tests/helpers/run.ts`, because bunfig cannot vary by tier and
# a unit test must not pay for a database connection.
preload = ["./tests/helpers/preload-base.ts"]

coverageSkipTestFiles = true
# `lcov` must be declared HERE: this key wins over `--coverage-reporter` on the
# command line. `text` is for a human; `lcov` is what `scripts/check-coverage.ts`
# reads.
coverageReporter = ["text", "lcov"]

# No `coverageThreshold`: Bun applies it PER FILE, so it cannot express an
# aggregate floor; `scripts/check-coverage.ts` is that gate.

# `tsc`, `eslint`, `prettier`, `drizzle-kit`, `knip` and `lefthook` ship a
# `#!/usr/bin/env node` shebang, which `bun run` honours whenever `node` is on
# `$PATH`. This makes the runtime Bun regardless of what else is installed, so
# a Node-less container and a developer machine run the same thing. It relies on
# the explicit `^bun$`/`^bun:` groups in the Prettier config's `importOrder`,
# which keep import sorting identical under either runtime.
#
# Bunfig is resolved from the working directory and not inherited.
[run]
bun = true

# `[install]` lives in the root bunfig.toml: installs run from the workspace
# root, and that is the file Bun reads for them.
