# Hooks for the whole repository. A job with `root:` runs inside that workspace
# and its `{staged_files}` are that workspace's staged files, so every command
# below is the one the workspace's own package.json scripts use.
#
# `--no-warn-ignored` on the per-file eslint jobs: a staged path that matches an
# eslint ignore pattern is reported as a warning when passed by name, and
# `--max-warnings 0` would turn that warning into a blocked commit.

# The pre-commit hook script is patched by `scripts/install-git-hooks.mjs`
# (see its header); an automatic reinstall would drop the patch. After adding or
# removing a hook here, run `bun run prepare`.
no_auto_install: true

pre-commit:
  parallel: true
  jobs:
    # No `root:` on the two consumer typechecks: it also narrows the staged
    # files to its workspace, and a commit touching only `packages/shared` has
    # to re-check both consumers, which compile it with their own tsconfig.
    - name: front-end typecheck
      glob: ['apps/front-end/*.{ts,tsx,mts,cts}', 'packages/shared/*.ts']
      run: cd apps/front-end && bun run typecheck
    - name: front-end lint
      root: 'apps/front-end/'
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs}'
      run: bun scripts/lint.mjs --no-warn-ignored {staged_files}
    - name: front-end format
      root: 'apps/front-end/'
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs,json,jsonc,md,yml,yaml,css}'
      run: bun fmt --no-script --check {staged_files}
    - name: front-end icons
      root: 'apps/front-end/'
      glob: '*.{ts,tsx,js,jsx,mjs}'
      run: bun scripts/build-icons.ts --check
    - name: back-end typecheck
      glob: ['apps/back-end/*.{ts,tsx,mts,cts}', 'packages/shared/*.ts']
      run: cd apps/back-end && bun run typecheck
    - name: back-end lint
      root: 'apps/back-end/'
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs}'
      run: bunx eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: back-end format
      root: 'apps/back-end/'
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs,json,jsonc,md,yml,yaml,css}'
      run: bun fmt --no-script --check {staged_files}
    - name: shared typecheck
      root: 'packages/shared/'
      glob: '*.ts'
      run: bun run typecheck
    - name: shared lint
      root: 'packages/shared/'
      glob: '*.{ts,js,mjs}'
      run: bunx eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: shared format
      root: 'packages/shared/'
      glob: '*.{ts,js,mjs,json,jsonc,md}'
      run: bun fmt --no-script --check {staged_files}
    # Root-level files: the guard script, the hooks, the workflows and the
    # manifests. No `root:`, so nothing that lives above the workspaces escapes.
    - name: root lint
      glob: '{scripts/**/*.mjs,*.mjs}'
      exclude: '{apps/**,packages/**}'
      run: bunx eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: root format
      glob: '{scripts/**/*.mjs,*.js,*.mjs,*.json,*.yml,README.md,.github/**/*.yml,patches/**/*.md}'
      exclude: '{apps/**,packages/**}'
      run: bun fmt --no-script --check {staged_files}
    # No `exclude`, unlike the two jobs above: the workspace manifests are the
    # point. The script reads every manifest whatever was staged; the glob only
    # decides whether a commit is one it needs to look at.
    - name: dependency parity
      glob: '{package.json,apps/*/package.json,packages/*/package.json}'
      run: bun scripts/check-dependency-parity.mjs
    - name: secrets
      run: mise exec -- gitleaks git --staged --redact --verbose --no-banner

# Three stages, not one parallel group.
#
# - `tests/unit/lint-security-gate.test.ts` writes a deliberately rule-violating
#   probe into the back-end tree while it runs, and every gate reads the whole
#   tree, so running them concurrently fails naming a file that no longer exists
#   by the time the developer looks — the classic reason a gate gets disabled.
# - Memory, measured alone: front-end ESLint peaks at 2.6 GB, back-end ESLint at
#   2.1 GB, each semgrep scan at 0.5 GB. All of it at once swapped an 8 GB
#   machine for 7-15 minutes; the two lints side by side take 190 s.
#
# `piped`: a failed stage stops the next; the jobs inside a stage still run in
# parallel.
#
# The slow jobs are skipped when no pushed file is in their scope. Each one
# leaves out the OTHER app, so a change to the lockfile, a root config or
# `packages/shared` still runs both sides. No pre-push job takes a `root:`:
# lefthook narrows the pushed files to it, and skipped `apps/back-end` typecheck
# on a push touching only `packages/shared`.
#
# Lefthook 2.2.2 builds the pushed files from `git diff HEAD @{push}`, else from
# the remote default branch's merge-base, else every file, and drops each path
# that no longer exists; a `files:` command does not replace that list. So a
# push that only DELETES files runs no job, and a deletion pushed beside a
# change elsewhere skips the deleted file's jobs. After deleting files, run
# `bun run verify` (in apps/back-end) before pushing: a hook lefthook does not
# know filters nothing, so it runs every job.
pre-push:
  piped: true
  jobs: &full_verify
    - name: gates
      group:
        parallel: true
        jobs:
          - name: front-end typecheck
            run: cd apps/front-end && bun run typecheck
          - name: front-end lint
            exclude: &front_end_scope
              - 'apps/back-end/**'
              - 'docs/**'
              - 'design-prototypes/**'
              - '.claude/**'
            run: cd apps/front-end && bun scripts/lint.mjs .
          - name: front-end format
            run: cd apps/front-end && bun run format:check
          - name: front-end icons
            run: cd apps/front-end && bun scripts/build-icons.ts --check
            fail_text:
              'lib/icons-bundle.generated.ts does not match the icon names in
              the source (run `bun scripts/build-icons.ts` inside apps/front-end)'
          - name: back-end typecheck
            run: cd apps/back-end && bun run typecheck
          - name: back-end lint
            exclude: &back_end_scope
              - 'apps/front-end/**'
              - 'docs/**'
              - 'design-prototypes/**'
              - '.claude/**'
            run: cd apps/back-end && bunx eslint . --max-warnings 0
          - name: back-end format
            run: cd apps/back-end && bun run format:check
          - name: shared typecheck
            run: cd packages/shared && bun run typecheck
          - name: shared lint
            run: cd packages/shared && bunx eslint . --max-warnings 0
          - name: shared format
            run: cd packages/shared && bun run format:check
          - name: root lint
            run: bun run lint:root
          - name: root format
            run: bun run format:check:root
          - name: audit
            run: cd apps/back-end && bun run audit
            fail_text:
              'a vulnerable dependency, or the advisories registry is down (the
              script retries a 5xx three times before giving up)'
          # The half of the Bun-only guard that a skipped `preinstall` cannot
          # hide: `--ignore-scripts` silences the hook silently, so a foreign
          # lockfile can reach the tree with no install-time complaint at all.
          - name: runtime
            run: bun scripts/require-bun.mjs
            fail_text:
              'wrong package manager, an outdated Bun, a foreign lockfile, or a
              workspace whose packageManager pin disagrees with the root'
          - name: unused-files
            run: cd apps/back-end && bun run find:unused-files
            fail_text: 'an unreachable file, or a knip finding'
          - name: schema-drift
            run: cd apps/back-end && bun run check:schema-drift
            fail_text:
              'db/schema.ts has changes db/drizzle/ does not carry (run `bun run
              db:generate` inside apps/back-end)'
          - name: migration-lint
            run: cd apps/back-end && bun run lint:migrations
            fail_text:
              'a new migration would break the release still serving, or tools
              not installed (mise install)'
          - name: doc-references
            run: cd apps/back-end && bun run check:doc-refs
            fail_text:
              'a document or comment cites a path that no longer exists, or a
              line past the end of its file (cite where it went, or list a
              deliberate citation in ABSENT_ON_PURPOSE)'
          # Ten seconds in a parallel group, and the alternative is learning of a
          # contract change from CI after the push.
          - name: openapi-drift
            run: cd apps/back-end && bun run check:openapi-drift
            fail_text:
              'the served OpenAPI document differs from openapi.snapshot.json
              (run `bun run openapi:snapshot` inside apps/back-end, review it,
              commit it)'
          # `bun dedupe --check` reports only duplicates it could COLLAPSE, so it
          # passes a lockfile holding several incompatible majors of one package.
          # `dependency-parity` covers the half of that which enters through the
          # manifests: two direct declarations of one package with two
          # specifiers. A transitive duplicate is still only visible in the
          # lockfile.
          - name: collapsible-duplicates
            run: bun dedupe --check
            fail_text:
              'a dependency resolves to several versions that could be collapsed
              into one (run `bun dedupe`)'
          - name: dependency-parity
            run: bun scripts/check-dependency-parity.mjs
            fail_text:
              'a package declared with different specifiers in two manifests
              (align them, then `bun install` at the root)'
          - name: secrets
            run: mise exec -- gitleaks git . --redact --verbose --no-banner
            fail_text: 'leaked secret, or tools not installed (mise install)'
          - name: workflows
            run: mise exec -- actionlint
            fail_text: 'workflow errors, or tools not installed (mise install)'
          # actionlint checks that a workflow is valid, zizmor that it is safe:
          # injection, credential persistence, unpinned actions, risky triggers.
          - name: workflow security
            run: mise exec -- zizmor --offline --no-progress .github/workflows
            fail_text: 'workflow security findings, or tools not installed (mise install)'
    - name: scans
      group:
        parallel: true
        jobs:
          # One scan for the three trees that share a ruleset: each run spends
          # about 18 s loading rules whatever it scans. Semgrep still reads
          # `apps/back-end/.semgrepignore` from here. It also scans untracked
          # files that git does not ignore; the lint probes are ignored.
          - name: sast
            exclude: *back_end_scope
            run: mise exec -- semgrep scan --config=p/typescript
              --config=p/secrets --config=p/nodejs --error --metrics=off
              apps/back-end packages/shared scripts
            fail_text: 'semgrep findings, or tools not installed (mise install)'
          - name: front-end sast
            exclude: *front_end_scope
            run: cd apps/front-end && mise exec -- semgrep scan
              --config=p/typescript --config=p/secrets --config=p/react
              --config=p/nextjs --error --metrics=off
            fail_text: 'semgrep findings, or tools not installed (mise install)'
          # Part of the front-end's `lint` script, which CI runs; the lint job
          # calls ESLint alone.
          - name: front-end css audit
            exclude: *front_end_scope
            run: cd apps/front-end && bun run audit:css
    # The cheap tier only: the database tiers are `bun run test:all` by hand, or
    # the `tests` CI job.
    - name: test
      exclude: *back_end_scope
      run: cd apps/back-end && bun run test

verify:
  piped: true
  jobs: *full_verify

fix:
  # Sequential: the pairs rewrite the same files.
  piped: true
  jobs:
    - name: front-end format
      root: 'apps/front-end/'
      run: bun run format
    - name: front-end lint
      root: 'apps/front-end/'
      run: bun scripts/lint.mjs . --fix
    - name: back-end format
      root: 'apps/back-end/'
      run: bun run format
    - name: back-end lint
      root: 'apps/back-end/'
      run: bunx eslint . --fix
    - name: shared format
      root: 'packages/shared/'
      run: bun run format
    - name: shared lint
      root: 'packages/shared/'
      run: bunx eslint . --fix
    - name: root format
      run: bun run format:root
    - name: root lint
      run: bunx eslint scripts *.mjs --fix
