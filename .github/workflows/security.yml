name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both scanners install from mise.toml, the same file `bun run verify` uses,
  # so a CI scan and a local scan run identical binaries.
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Semgrep's --baseline-commit needs the PR base commit in history.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Semgrep OSS scan
        # The back-end, the shared package it depends on and the root scripts,
        # each from its own directory so `apps/back-end/.semgrepignore` keeps
        # applying. The front-end is not in scope here, as it was not before the
        # monorepo.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          args=(--config=p/typescript --config=p/secrets --error --metrics=off)
          if [ -n "${BASE_SHA:-}" ]; then
            args+=(--baseline-commit="$BASE_SHA")
          fi
          (cd apps/back-end && semgrep scan "${args[@]}")
          (cd packages/shared && semgrep scan "${args[@]}")
          (cd scripts && semgrep scan "${args[@]}")

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the tip commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Scan git history for secrets
        run: gitleaks git . --redact --verbose --no-banner
